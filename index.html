      }).join("") + '</div>' : '<p class="empty">Changes you make show up here.</p>');
}
ACTIONS["activity-all"] = function(){
  openDialog("Recent changes", '<div class="undo-list">' + activityLog().map(function(a){
    return '<div class="rule-row"><span><b>' + escapeHTML(a.label) + '</b>' + (a.by ? ' <span class="muted">· ' + escapeHTML(a.by) + '</span>' : '') + '</span><span class="muted num">' + escapeHTML(activityWhen(a.at)) + '</span></div>'; }).join("") + '</div>',
    '<button type="button" class="btn primary" data-close>Close</button>');
};
var activitySettingsPlain = RENDER.settings;
RENDER.settings = function(){
  activitySettingsPlain.apply(this, arguments);
  var grid = $("screen-settings") && $("screen-settings").querySelector(".grid"); if(!grid) return;
  var sec = document.createElement("section"); sec.className = "card span6"; sec.setAttribute("aria-labelledby", "actTitle"); sec.innerHTML = activityHTML();
  var help = Array.prototype.filter.call(grid.children, function(c){ var h = c.querySelector("h2"); return h && /^Help/.test(h.textContent); })[0];
  if(help) grid.insertBefore(sec, help); else grid.appendChild(sec);
};


/* ============================================================
   Start: load (never overwrite what can't be read), catch up the
   repeating items, notice a quiet spell, then open Today.
   ============================================================ */
function firstRun(){
  $("app").hidden = true;
  var el = $("first"); el.hidden = false;
  el.innerHTML = '<div class="eyebrow">FinNestStudio</div><h1>Ultimate Budget Planner</h1>'
    + '<p>Your whole money picture, and one number for today. It lives on this device, and it still works when you fall behind.</p>'
    + '<div class="btns"><button type="button" class="btn primary" id="frMine">Start with my numbers</button>'
    + '<button type="button" class="btn ghost" id="frExample">Look around the example first</button></div>';
  $("frMine").addEventListener("click", function(){ state.settings.onboarded = true; persist(); openApp("today"); });
  $("frExample").addEventListener("click", function(){ state = sampleState(); persist(); openApp("today"); });
}
function openApp(screen){
  $("first").hidden = true; $("app").hidden = false;
  applyTheme();
  go(screen || "today", {replace:true, silent:true});
}
function boot(){
  load();
  applyTheme();
  if(loadProblem){
    openApp("today");
    openDialog("Your saved data couldn’t be read",
      '<p>Nothing has been overwritten: your saved copy is exactly where it was. The dashboard has opened empty so you can keep working, and it won’t save over that copy.</p>'
        + (goodCopy() ? '<p>There’s a good copy from <b>' + escapeHTML(longDateLabel(parseDate(goodCopy().day))) + '</b>. You can bring that back, or restore a backup file from Settings.</p>' : ''),
      (goodCopy() ? '<button type="button" class="btn ghost" data-close>Not now</button><button type="button" class="btn primary" data-act="restore-good">Bring back ' + escapeHTML(shortDateLabel(parseDate(goodCopy().day))) + '’s copy</button>' : '<button type="button" class="btn primary" data-close>OK</button>'));
    return;
  }
  materialiseBills();
  materialiseRecurring();
  applyDebtPlan();
  if(!state.settings.onboarded){ firstRun(); return; }
  autoPayBills();
  autoLogSources();
  noteAbsence(lastActivityDate());
  state.settings.lastSeen = NOW().toISOString();
  snapshotWorth();
  persist();
  openApp(location.hash.slice(1) || "today");
}

/* ============================================================
   The hosted demo layer: compiled ONLY into the demo build
   (node build.mjs --demo). It is not in the UI list, so nothing
   here can reach a buyer's file or the hosted app.

   Spliced inside the closure, just ahead of boot(), so it can
   wrap addExpense(), commit(), saveImport() and firstRun().

   The cap counts spends, the thing a visitor logs every day.
   Every spend goes through addExpense() (Add, the usuals, the
   quick chips, a wish bought), and a bank file goes through
   saveImport(). Money in, bills paid, goals, debts, edits and
   deletes stay free: a demo that fights you is not a demo.

   The counter has its own key beside the plan, so a backup
   carries no demo bookkeeping, and "Start fresh" or "Load the
   example" cannot reset it.
   ============================================================ */

/* The lines worth editing. The buy button goes to the listing itself,
   not the shop front, with ?ref=demo so Etsy Stats shows what the demo sends. */
var DEMO_BUY_URL   = "https://www.etsy.com/listing/4515406663/ultimate-digital-personal-finance?ref=demo";
var DEMO_CAP       = 40;
var DEMO_COUNT_KEY = KEY + "_logged";

function demoLogged(){
  try{ var n = parseInt(window.localStorage.getItem(DEMO_COUNT_KEY) || "0", 10); return isFinite(n) && n > 0 ? n : 0; }
  catch(e){ return 0; }
}
function demoSetLogged(n){ try{ window.localStorage.setItem(DEMO_COUNT_KEY, String(n)); }catch(e){} }
function demoLeft(){ return Math.max(0, DEMO_CAP - demoLogged()); }

/* ---------------- first visit: straight into the example ----------------
   The buyer file asks "my numbers or the example?". A visitor came to look,
   so the demo opens on the example household, exactly as that button would. */
firstRun = function(){ state = sampleState(); persist(); openApp("today"); };

/* ---------------- the cap ---------------- */
var demoBlocked = false, demoJustFilled = false;
var addExpenseUncapped = addExpense;
addExpense = function(){
  if(demoLeft() <= 0){ demoBlocked = true; return; }
  addExpenseUncapped.apply(null, arguments);
  demoSetLogged(demoLogged() + 1);
  if(demoLeft() === 0) demoJustFilled = true;
};
/* Every caller of addExpense() follows it with commit("Added …"). When the spend
   was refused, nothing changed, so swap that message for the cap notice. */
var commitUncapped = commit;
commit = function(message){
  if(demoBlocked){ demoBlocked = false; renderAll(); demoCapReached(); return; }
  commitUncapped(message);
  /* the last spend: let its "Added" message land before taking the room away */
  if(demoJustFilled){ demoJustFilled = false; setTimeout(demoCapReached, 900); }
};
/* Buying a wish writes to the wish after addExpense(), so ask before it starts. */
var wishGoUncapped = ACTIONS["wish-go"];
ACTIONS["wish-go"] = function(el){
  var to = el.getAttribute("data-to");
  if(to !== "released" && to !== "goal" && demoLeft() <= 0){ demoCapReached(); return; }
  wishGoUncapped(el);
};
/* A bank file is judged as a whole: a 60-row file with 12 spends left is refused
   with both numbers, rather than half-imported. */
var saveImportUncapped = saveImport;
saveImport = function(rows, fileName, acctId){
  var outs = (rows || []).filter(function(x){ return x.dir === "out"; }).length;
  if(outs > demoLeft()){
    closeDialog();
    openDialog("That file is bigger than the demo",
      '<p>It has <b>' + outs + '</b> purchases, and the demo has room for <b>' + demoLeft() + '</b> more.</p>'
      + '<p class="hint">The full planner imports your whole bank file, with no limit.</p>',
      '<button type="button" class="btn ghost" data-close>OK</button><button type="button" class="btn primary" data-demo="buy">Get the full planner</button>');
    return;
  }
  saveImportUncapped(rows, fileName, acctId);
  if(outs){
    demoSetLogged(demoLogged() + outs); paintDemoBar();
    if(demoLeft() === 0) setTimeout(demoCapReached, 900);
  }
};

/* ---------------- what a visitor sees at the cap ---------------- */
function demoCapReached(){
  openDialog("That’s all " + DEMO_CAP + " spends the demo holds",
    '<p style="font-weight:600">You’ve logged ' + DEMO_CAP + ' spends, enough to see how this planner handles a real month.</p>'
    + '<p>Nothing you entered is lost. Download your backup now, and the full planner restores it exactly as it is, with every spend, bill, goal and debt in place.</p>'
    + '<p class="hint">The full version has no limit and no subscription. It installs on your phone and your computer, works offline, and can keep the two in step with private, encrypted sync.</p>',
    '<button type="button" class="btn ghost" data-demo="reset">Reset the demo</button>'
    + '<button type="button" class="btn ghost" data-demo="export">Download my backup</button>'
    + '<button type="button" class="btn primary" data-demo="buy">Get the full planner</button>');
}

/* ---------------- the banner, with a live count ---------------- */
function paintDemoBar(){
  var bar = $("demoBar");
  if(!bar){
    bar = document.createElement("div");
    bar.id = "demoBar";
    bar.innerHTML = '<span class="db-note db-long">Free demo · example data, and nothing leaves your browser</span>'
      + '<span class="db-note db-short">Free demo</span>'
      + '<span class="db-count" id="demoCount"></span>'
      + '<a class="db-buy" id="demoBuy" href="' + DEMO_BUY_URL + '" target="_blank" rel="noopener">Get the full planner</a>'
      + '<button type="button" class="db-reset" data-demo="reset">reset</button>';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  var left = demoLeft(), count = $("demoCount");
  count.textContent = left > 0 ? demoLogged() + " of " + DEMO_CAP + " spends logged" : "demo full: " + DEMO_CAP + " of " + DEMO_CAP + " logged";
  count.classList.toggle("low", left <= 5);
}
/* repaint after anything that can change the count */
var renderAllUncapped = renderAll;
renderAll = function(){ renderAllUncapped.apply(null, arguments); paintDemoBar(); };

/* ---------------- demo-only actions ---------------- */
document.addEventListener("click", function(e){
  var el = e.target && e.target.closest ? e.target.closest("[data-demo]") : null;
  if(!el) return;
  e.preventDefault();
  var what = el.getAttribute("data-demo");
  if(what === "buy"){ window.open(DEMO_BUY_URL, "_blank", "noopener"); }
  else if(what === "export"){ ACTIONS.export(); }
  else if(what === "reset"){
    closeDialog(); storage.clear();
    try{ window.localStorage.removeItem(DEMO_COUNT_KEY); window.localStorage.removeItem(KEY + "_good"); }catch(err){}
    location.reload();
  }
});

/* ---------------- styling, kept here so the layer is self-contained ---------------- */
(function(){
  var css = ""
    + "#demoBar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;"
    +   "background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);"
    +   "font:600 14px/1.3 var(--ui);position:relative;z-index:45}"
    + "#demoBar .db-note{flex:1 1 auto;min-width:0}"
    + "#demoBar .db-count{padding:3px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);"
    +   "font-variant-numeric:tabular-nums;white-space:nowrap}"
    + "#demoBar .db-count.low{border-color:var(--warn);color:var(--warn)}"
    + "#demoBar .db-buy{padding:6px 14px;border-radius:999px;background:var(--accent);color:var(--onaccent);"
    +   "text-decoration:none;white-space:nowrap}"
    + "#demoBar .db-reset{background:none;border:0;color:inherit;opacity:.75;font:inherit;text-decoration:underline;cursor:pointer;padding:0}"
    + "#demoBar .db-short{display:none}"
    + "@media(max-width:640px){"
    +   "#demoBar{font-size:12px;padding:8px 12px;gap:8px;flex-wrap:nowrap}"
    +   "#demoBar .db-long,#demoBar .db-reset{display:none}"
    +   "#demoBar .db-short{display:inline;flex:1 1 auto;font-weight:700}"
    +   "#demoBar .db-count{padding:2px 8px;font-size:11px}"
    +   "#demoBar .db-buy{padding:5px 10px;font-size:12px}}";
  var s = document.createElement("style");
  s.textContent = css;
  document.head.appendChild(s);
})();

/* boot() runs straight after this; the banner goes up first so the page never looks bare */
paintDemoBar();

boot();
})();

</script>
</body>
</html>
