/* ============================================================
   Look A with six colour themes. <html data-theme="…"> picks one.
   Every colour on screen comes from these tokens.
   ============================================================ */
:root{
  --ui:'InterFN',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'DisplayFN','InterFN',system-ui,sans-serif;
  --bignum:'DisplayFN','InterFN','CurrencyFN',system-ui,sans-serif;
  --numfont:'InterFN','CurrencyFN',system-ui,sans-serif;
  --r:20px;--r-sm:12px;--r-pill:999px;
  --shadow:none;
  --outc:color-mix(in srgb,var(--warn) 62%,var(--card));
}

/* Noir: black and gold, dark by nature */

/* ---------- Number style: the font of the big money numbers (Settings → Look and feel) ---------- */
html[data-numfont="elegant"]{--bignum:'NumElegantFN','CurrencyFN',Georgia,serif}
html[data-numfont="modern"]{--bignum:'NumModernFN','CurrencyFN',system-ui,sans-serif}
html[data-numfont="ledger"]{--bignum:'NumLedgerFN','CurrencyFN',ui-monospace,monospace;--numfont:'NumLedgerFN','CurrencyFN',ui-monospace,monospace}
html[data-numfont="friendly"]{--bignum:'NumFriendlyFN','CurrencyFN',system-ui,sans-serif}
/* serif and mono digits sit a little differently: loosen the tight tracking made for the display font */
html[data-numfont="elegant"] .hero .big,html[data-numfont="ledger"] .hero .big{letter-spacing:-.01em}
html[data-numfont="ledger"] .tile .v,html[data-numfont="ledger"] .strip .card .v{letter-spacing:-.02em}

/* ============================================================
   Shell: sidebar, screens, cards, buttons, forms, dialog, toast.
   Phone width gets a bottom bar instead of the sidebar.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-family:var(--numfont);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand .shop{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.brand .prod{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1;margin-top:4px;color:var(--brandink);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--navink);background:none;border:0;font-weight:500;cursor:pointer;text-align:left;min-height:42px}
.nav button:hover{background:color-mix(in srgb,var(--navon) 8%,transparent)}
.nav button[aria-current="page"]{background:var(--navon);color:var(--navonink);font-weight:600}
.nav svg,.tabbar svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.side .foot{margin-top:auto;font-size:12px;color:var(--soft);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--warn)}

.main{padding:30px 38px 60px;max-width:1260px;width:100%;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:600}
h1{font-family:var(--display);font-size:36px;font-weight:800;letter-spacing:-.02em;font-optical-sizing:auto;margin-top:6px;color:var(--brandink);line-height:1.1}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{font-weight:600;border-radius:var(--r-pill);padding:10px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:14px}
.link{background:none;border:0;color:var(--accentink);font-weight:600;cursor:pointer;padding:0;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-head h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brandink);font-weight:700}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span5{grid-column:span 5}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}
.muted{color:var(--soft)}
.empty{color:var(--soft);font-size:14px;padding:6px 0}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>span.over{background:var(--warn)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--card);color:var(--ink);border-radius:var(--r);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.dialog header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 6px}
.dialog header h2{font-family:var(--display);font-size:22px;letter-spacing:-.015em}
.dialog .body{padding:10px 22px 4px}
.dialog footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px;flex-wrap:wrap}
.x{background:none;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--soft);font-size:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.input,.select{border:1px solid var(--line2);background:var(--card);border-radius:var(--r-sm);padding:11px 13px;min-height:44px;width:100%}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.money-in{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--card)}
.money-in span{padding:0 4px 0 13px;color:var(--soft);font-weight:600}
.money-in .input{border:0;box-shadow:none;font-size:22px;font-weight:700;font-family:var(--numfont)}
.hint{font-size:13px;color:var(--soft)}
.error{color:var(--warnink);font-size:13px;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line2);background:var(--card);border-radius:var(--r-pill);padding:8px 13px;cursor:pointer;font-weight:500;min-height:40px}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:12px 14px 12px 18px;border-radius:14px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast .btn{min-height:34px;padding:6px 12px;background:color-mix(in srgb,var(--page) 16%,transparent);color:var(--page)}

/* phone */
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 100px}
  h1{font-size:28px}
  /* the header's buttons stay on phones: "+ Add a repeat", "+ Add a debt", the forecast range and the
     eye are only up here. "+ Add spending" and Print hide: the tab bar has +, and phones don't print. */
  .top{gap:12px;margin-bottom:18px}
  .top-actions{gap:8px;width:100%}
  .top-actions .btn{min-height:40px;padding:8px 14px;font-size:15px}
  .top-actions [data-act="add-spend"],.top-actions [data-act="print"]{display:none}
  .grid{grid-template-columns:1fr;gap:14px}
  .span12,.span8,.span7,.span6,.span5,.span4,.span3{grid-column:1/-1}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:40}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--soft);background:none;border:0;font-weight:600;cursor:pointer;min-height:44px}
  .tabbar button[aria-current="page"]{color:var(--accentink)}
  .tabbar .plus{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;margin-top:-16px;font-size:26px;font-weight:500;line-height:1}
  .toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================
   Today: the answer card, coming up, forecast, tiles, categories.
   ============================================================ */
.hero{background:var(--herobg);color:var(--heroink);border:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding:28px 30px}
.hero .label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--herosoft)}
.hero .big{font-family:var(--bignum);font-size:88px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-optical-sizing:auto;line-height:1;margin:10px 0 8px;color:var(--herobig);white-space:nowrap}
.hero .big .cur{font-size:.46em;vertical-align:.7em;margin-right:4px;color:var(--herocur);letter-spacing:0}
.hero .big .after{font-size:.46em;margin-left:8px;color:var(--herocur);letter-spacing:0}
.hero .sub{color:var(--herosoft);font-size:15px}
.hero .short{color:#FFB4A2;font-weight:600;margin-top:6px}
.cert{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px;border-radius:var(--r-pill);background:var(--certbg);font-size:13px;font-weight:600;color:var(--certink);max-width:100%}
.cert i{width:8px;height:8px;border-radius:50%;background:var(--good);display:block;flex:none}
.cert[data-level="guess"] i{background:#E8B04B}.cert[data-level="fuzzy"] i,.cert[data-level="setup"] i{background:#F08A6C}
.sum{align-self:center;border-radius:var(--r-sm);background:var(--sumbg);padding:14px 18px}
.sum .row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:6px 0;font-size:15px}
.sum .op{color:var(--herosoft);font-weight:700;text-align:center}
.sum .v{font-weight:600;white-space:nowrap}
.sum .row.total{border-top:1px solid var(--sumline);margin-top:6px;padding-top:10px;font-weight:700}
.sum .row.total .v{color:var(--herototal);font-size:17px}
.hero .next{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--sumline);padding-top:16px;margin-top:4px}
.hero .next b{font-weight:700}
.hero .btn.primary{background:var(--herobtn);color:var(--herobtnink)}
.hero .btn.ghost{border-color:var(--sumline);color:var(--heroink)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.06)}
.quick{display:flex;gap:8px;flex-wrap:wrap}

.welcome{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--r);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.welcome strong{font-size:17px}
.welcome p{color:var(--soft);margin-top:2px}

.list .it{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.date{border-radius:10px;background:var(--chip);text-align:center;padding:5px 0;line-height:1.05}
.date b{display:block;font-size:17px;font-family:var(--numfont)}
.date small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.it .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m{font-size:13px;color:var(--soft)}
.it .a{font-family:var(--numfont);font-weight:600;white-space:nowrap}
.it .a.in{color:var(--good)}

.chart{width:100%;height:190px;display:block;overflow:visible}
.legend{display:flex;gap:18px;font-size:13px;color:var(--soft);margin-top:8px;flex-wrap:wrap}
.legend b{color:var(--ink)}

.tile .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:600}
.tile .v{font-family:var(--bignum);font-size:32px;font-weight:700;margin:8px 0 6px;letter-spacing:-.015em;font-variant-numeric:tabular-nums;color:var(--brandink);white-space:nowrap}
.tile .s{font-size:13px;color:var(--soft)}
.tile .up{color:var(--good);font-weight:600}
.tile .bar{margin-top:12px}
.spark{width:100%;height:40px;margin-top:8px;display:block}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 34px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0}
.cat .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .am{font-family:var(--numfont);font-size:14px;white-space:nowrap}
.cat .am small{color:var(--soft)}
.cat .bar{grid-column:1/-1;height:7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.chip .num{color:var(--soft);font-weight:500;margin-left:4px}

.soon{text-align:center;padding:60px 24px}
.soon h2{font-family:var(--display);font-size:24px;margin-bottom:8px}
.soon p{color:var(--soft);max-width:460px;margin:0 auto}

.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.theme-opt{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.theme-opt[aria-pressed="true"]{border-color:var(--accent)}
.theme-opt .sw{height:44px;border-radius:9px;display:grid;grid-template-columns:2fr 1fr;overflow:hidden}
.theme-opt b{font-size:14px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.setrow:last-child{border-bottom:0}
.setrow .t{font-weight:600}.setrow .d{font-size:13px;color:var(--soft);margin-top:2px}

.first{max-width:560px;margin:10vh auto;padding:0 16px;text-align:center}
.first h1{font-size:40px}
.first p{color:var(--soft);font-size:17px;margin:12px 0 26px}
.first .btns{display:flex;flex-direction:column;gap:10px;align-items:center}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px 20px;gap:16px}
  .hero .big{font-size:64px}
  .cats{grid-template-columns:1fr}
  .setrow{grid-template-columns:1fr;gap:10px}
  .themes{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.goals-mini{display:grid;gap:12px;margin-top:16px}
.goals-mini .gm-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.goals-mini .gm-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goals-mini .bar{margin-top:0;height:7px}
.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .quick .btn.sm+.btn.sm+.btn.sm{display:none}}

/* ============================================================
   Spending, Repeats, Goals, Debt: one calm pattern on every screen.
   A summary strip, one main list, details folded away.
   ============================================================ */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:18px}
.strip .card .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:600}
.strip .card .v{font-family:var(--bignum);font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--brandink)}
.strip .card .s{font-size:13px;color:var(--soft);margin-top:2px}
.strip .v.good{color:var(--good)}.strip .v.warn{color:var(--warnink)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{min-width:150px;text-align:center;font-size:16px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink);font-size:18px}
.iconbtn:disabled{opacity:.35;cursor:default}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pills button{border:1px solid var(--line2);background:var(--card);border-radius:var(--r-pill);padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;color:var(--ink)}
.pills button[aria-pressed="true"]{background:var(--navon);border-color:var(--navon);color:var(--navonink)}
.pills .count{opacity:.7;margin-left:4px;font-weight:500}

/* category plans with a slider each */
.plan-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.plan-row:last-child{border-bottom:0}
.plan-row .nm{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.plan-row .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-row .am{font-family:var(--numfont);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.plan-row .am small{color:var(--soft)}
.plan-row .bar{grid-column:1/-1;height:8px}
.plan-row .ctl{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;color:var(--soft)}
.plan-row input[type=range]{width:100%;height:32px;accent-color:var(--accent);cursor:pointer}
.plan-row .left{font-size:13px;color:var(--soft)}
.plan-row .left.over{color:var(--warnink);font-weight:600}

/* transaction and repeat lists */
.day{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:16px 0 6px}
.day:first-child{padding-top:0}
.row-btn{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;border-radius:10px;color:var(--ink)}
.row-btn:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row-btn .em{width:38px;height:38px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:17px}
.row-btn .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-btn .m{font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-btn .a{font-family:var(--numfont);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.search{margin-bottom:12px}
.rep{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rep .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep .m{font-size:13px;color:var(--soft)}
.rep .a{font-family:var(--numfont);font-weight:600;white-space:nowrap}
.rep.overdue .m{color:var(--warnink);font-weight:600}
.rep.done{opacity:.55}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--soft);margin-left:6px;vertical-align:1px}

/* goals */
.goal{display:grid;gap:14px}
.goal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.goal-top .t{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
.goal-top .t .em{font-size:26px}
.goal .nums{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.goal .nums .big{font-family:var(--bignum);font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal .nums .of{color:var(--soft)}
.goal .bar{height:12px}
.goal .when{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-sm);background:var(--chip)}
.goal .when b{font-family:var(--bignum);font-size:22px;font-weight:800}
.goal .slider-head{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.goal .slider-head output{font-family:var(--bignum);font-weight:800;color:var(--accentink);font-size:18px}
.goal input[type=range]{width:100%;height:36px;accent-color:var(--accent);cursor:pointer}
.goal .acts{display:flex;gap:8px;flex-wrap:wrap}
.goal .held{font-size:13px;color:var(--soft)}

/* debt: one date, one slider, one list (from the ADHD Planner v2.5) */
.dp-hero{text-align:center;padding:26px 24px 20px}
.dp-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
.dp-date{font-family:var(--bignum);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:800;line-height:1.05;margin:.2rem 0;letter-spacing:-.02em;color:var(--brandink)}
.dp-sub{color:var(--soft);font-size:15px}
.dp-slider{max-width:540px;margin:22px auto 6px;text-align:left}
.dp-slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-weight:600}
.dp-slider-head output{font-family:var(--bignum);font-size:24px;font-weight:800;color:var(--accentink)}
#dpSlider{width:100%;height:44px;accent-color:var(--accent);cursor:pointer}
.dp-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:-4px}
.dp-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:40px;margin-top:10px}
.dp-chip{padding:8px 14px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--good) 14%,var(--card));font-weight:700;font-size:14px}
.dp-chip.quiet{background:var(--chip);font-weight:500;color:var(--soft)}
.dp-methods{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
.dp-method{min-height:44px;padding:8px 18px;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.dp-method[aria-checked="true"]{background:var(--navon);border-color:var(--navon);color:var(--navonink)}
.dp-why{text-align:center;color:var(--soft);font-size:14px;margin:6px 0 16px}
.dp-row{padding:14px 0;border-bottom:1px solid var(--line)}
.dp-row:last-child{border-bottom:0}
.dp-row-top{display:flex;align-items:center;gap:10px}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--chip);font-size:13px;font-weight:700;flex:none}
.dp-name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-bal{font-family:var(--bignum);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.dp-bar{height:10px;border-radius:99px;background:var(--track);margin:10px 0 8px;overflow:hidden}
.dp-bar>span{display:block;height:100%;width:0;border-radius:99px;background:var(--dcolor,var(--accent));transition:width .25s ease}
.dp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--soft)}
.dp-foot .clear{margin-left:auto}
.dp-foot .clear b{color:var(--ink)}
.dp-tag{padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--ink);font-weight:700;font-size:12px;border:0}
.dp-tag.warn{background:color-mix(in srgb,var(--warn) 16%,var(--card));cursor:pointer}
.small-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);cursor:pointer;color:var(--ink);display:grid;place-items:center;flex:none}
.small-btn:disabled{opacity:.3;cursor:default}
details.how{margin-top:16px;color:var(--soft);font-size:14px}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:44px;display:flex;align-items:center}
details.how p{margin:6px 0;line-height:1.55}

@media (max-width:820px){
  .strip{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .strip .card{padding:10px 12px;border-radius:14px}
  .strip .card .k{font-size:10px;letter-spacing:.06em}
  .strip .card .v{font-size:18px;margin-top:4px}
  .strip .card .s{display:none}
  .monthnav b{min-width:120px}
  .rep{grid-template-columns:46px minmax(0,1fr) auto}
  .rep .btn{grid-column:2/-1;justify-self:start}
  .dp-methods{display:grid;grid-template-columns:repeat(3,1fr)}
  .dp-method{padding:8px 4px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.dp-bar>span{transition:none}}

.more-list .row-btn{grid-template-columns:38px minmax(0,1fr) auto}
.more-list .em svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   Today's richer cards: small wins, the month calendar strip,
   the donut, run to payday, this week, milestones, confetti.
   ============================================================ */
.wins{list-style:none;display:grid;gap:4px}
.wins li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wins li:last-child{border-bottom:0}
.wins .t{font-weight:600}
.wins .s{font-size:13px;color:var(--soft)}
.wins li.done .t{color:var(--soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--soft) 50%,transparent)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.tick.on{background:var(--good);border-color:var(--good)}
.wins-note{margin-top:10px;font-size:13px;color:var(--soft);font-weight:600}

/* every day this month: a calendar coloured by spending */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days>b{font-size:11px;color:var(--soft);text-align:center;font-weight:700;letter-spacing:.06em}
.days>b:nth-child(1)+.dayc,.days .dayc:first-of-type{grid-column-start:calc(var(--first) + 1)}
.dayc{aspect-ratio:2.3;border:0;border-radius:9px;background:var(--track);cursor:pointer;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink);min-height:30px}
.dayc[data-level="0"]{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.dayc[data-level="1"]{background:color-mix(in srgb,var(--accent) 20%,var(--card))}
.dayc[data-level="2"]{background:color-mix(in srgb,var(--accent) 42%,var(--card))}
.dayc[data-level="3"]{background:color-mix(in srgb,var(--accent) 60%,var(--card));color:var(--ink)}
.dayc[data-level="4"]{background:var(--accent);color:var(--onaccent)}
.dayc.future{background:transparent;border:1px dashed var(--line2);color:var(--soft);cursor:default}
.dayc.today{outline:2px solid var(--ink);outline-offset:1px}
.dayc:not(.future):hover{transform:translateY(-1px)}
.days-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--soft)}
.scale{display:inline-flex;gap:3px}
.scale i{width:14px;height:10px;border-radius:3px;display:inline-block}
.scale i[data-level="0"]{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.scale i[data-level="1"]{background:color-mix(in srgb,var(--accent) 20%,var(--card))}
.scale i[data-level="2"]{background:color-mix(in srgb,var(--accent) 42%,var(--card))}
.scale i[data-level="3"]{background:color-mix(in srgb,var(--accent) 66%,var(--card))}
.scale i[data-level="4"]{background:var(--accent)}

/* donut */
.donut{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center}
.donut svg{width:140px;height:140px}
.donut .d-big{font-family:var(--bignum);font-weight:800;font-size:17px;fill:var(--brandink)}
.donut .d-small{font-size:10px;fill:var(--soft)}
.legend-list{list-style:none;display:grid;gap:7px;font-size:13px}
.legend-list li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend-list i{width:10px;height:10px;border-radius:3px}
.legend-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* run to payday */
.runs{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 14px}
.run{width:14px;height:14px;border-radius:50%;background:var(--track)}
.run.past{background:color-mix(in srgb,var(--accent) 45%,var(--card))}
.run.now{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.run.pay{background:var(--good);width:auto;padding:0 6px;border-radius:99px;height:14px;min-width:26px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--chip);border-radius:12px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--soft)}
.facts dd{font-family:var(--bignum);font-weight:800;font-size:19px;margin-top:2px;white-space:nowrap}
.facts.rows{grid-template-columns:1fr}
.facts.rows div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px}
.facts.rows dd{font-size:16px}

/* milestones */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--good) 13%,var(--card));font-size:12px;font-weight:700;max-width:100%}
.badge span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-ms{list-style:none;display:grid;gap:8px}
.next-ms li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--chip)}
.next-ms small{color:var(--soft);white-space:nowrap}

/* one small celebration */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.5s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes fall{to{top:100%;transform:translateX(40px) rotate(540deg);opacity:.2}}

@media (max-width:820px){
  .donut{grid-template-columns:120px minmax(0,1fr)}
  .donut svg{width:120px;height:120px}
  .dayc{aspect-ratio:1.3}
}

/* ============================================================
   Net Worth, Forecast, Reviews: the bigger pictures.
   ============================================================ */
.axis{font-size:11px;fill:var(--soft)}
.chart.big{height:280px}
.chart-empty{display:grid;place-items:center;height:170px;border:1px dashed var(--line2);border-radius:14px;color:var(--soft);font-size:14px;text-align:center;padding:16px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* net worth */
.worth-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:center}
.worth-big{font-family:var(--bignum);font-size:clamp(2.6rem,5vw,3.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0;color:var(--brandink);white-space:nowrap}
.worth-big .cur{font-size:.5em;vertical-align:.6em;margin-right:4px;color:var(--soft)}
.worth-change{font-weight:700;font-size:14px;color:var(--soft)}
.worth-change.up{color:var(--good)}.worth-change.down{color:var(--warnink)}
.split{height:12px;border-radius:99px;background:color-mix(in srgb,var(--warn) 55%,var(--card));overflow:hidden;margin-top:18px}
.split span{display:block;height:100%;background:var(--good);border-radius:99px 0 0 99px}
.split-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:600}
.split-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split-legend i.own{background:var(--good)}.split-legend i.owe{background:color-mix(in srgb,var(--warn) 55%,var(--card))}

/* forecast what-if */
.whatif{margin-top:16px;padding:16px 18px;border-radius:14px;background:var(--chip)}
.whatif-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.whatif-head span{font-weight:600;color:var(--brandink)}
.whatif-grid{display:grid;grid-template-columns:auto minmax(0,1fr) 90px;gap:8px 14px;align-items:center;font-size:14px}
.whatif-grid input[type=range]{width:100%;height:32px;accent-color:var(--warn);cursor:pointer}
.whatif-grid output{font-family:var(--bignum);font-weight:800;text-align:right}

/* reviews */
.note-gap{padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 30%,var(--card));margin-bottom:16px;font-size:14px}
.health-top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ring-num{font-family:var(--bignum);font-weight:800;font-size:30px;fill:var(--brandink)}
.health-label{font-family:var(--display);font-size:24px;font-weight:800}
.parts{list-style:none;display:grid;gap:12px}
.parts .pt{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.parts .pt small{color:var(--soft);font-weight:500}
.parts .bar{height:7px}
.parts .pd{font-size:12px;color:var(--soft);margin-top:4px}
.facts.three{grid-template-columns:repeat(3,1fr)}
.facts.three dd{font-size:24px}
.inout{display:grid;gap:8px;margin:16px 0}
.inout div{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;color:var(--soft);font-weight:600}
.inout i{display:block;height:14px;border-radius:99px}
.highlights{list-style:none;display:grid;gap:8px}
.highlights li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.highlights b{white-space:nowrap}
.compare{display:grid;gap:12px}
.cmp{display:grid;gap:4px}
.cmp-top{display:flex;justify-content:space-between;font-size:14px}
.cmp-top .more{color:var(--warnink);font-weight:700}.cmp-top .less{color:var(--good);font-weight:700}
.cmp i{display:block;height:8px;border-radius:99px;min-width:2px}
.year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:190px}
.ym{display:grid;grid-template-rows:1fr auto;height:100%;text-align:center;gap:4px}
.ybars{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%}
.ybars i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:2px}
.ym small{font-size:11px;color:var(--soft);font-weight:700}

@media (max-width:820px){
  .worth-hero{grid-template-columns:1fr}
  .whatif-grid{grid-template-columns:auto minmax(0,1fr);}
  .whatif-grid output{grid-column:2;text-align:left}
  .facts.three{grid-template-columns:1fr 1fr 1fr}
  .facts.three dd{font-size:17px}
}
@media print{
  .side,.tabbar,.top-actions,.toast,#modalRoot{display:none!important}
  .app{display:block}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}

/* segmented switch: Spending / Money in, List / Calendar */
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--track);gap:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:var(--r-pill);padding:8px 16px;min-height:40px;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view-bar{display:flex;justify-content:flex-end}

/* month calendar in Repeats */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal>b{font-size:11px;color:var(--soft);text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cal .calc:first-of-type{grid-column-start:calc(var(--first) + 1)}
.calc{min-height:92px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden}
.calc:hover{border-color:var(--line2)}
.calc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calc.future{background:color-mix(in srgb,var(--card) 70%,var(--page))}
.calc .dn{font-size:12px;font-weight:700;color:var(--soft)}
.calc.today .dn{color:var(--accentink)}
.ev{display:block;font-size:11px;font-weight:700;line-height:1.3;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ev.bill{background:color-mix(in srgb,var(--brandink) 12%,var(--card));color:var(--ink)}
.ev.sub{background:color-mix(in srgb,#7A5CC7 15%,var(--card));color:color-mix(in srgb,#6246B0 80%,var(--ink))}
.ev.debt{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warnink)}
.ev.pay{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.ev.paid{opacity:.55}
.ev.paid::before{content:"✓ "}
.ev.late{outline:1.5px solid var(--warn)}
.ev.more{background:none;color:var(--soft);font-weight:600}
.calc .sp{margin-top:auto;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.cal-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--soft)}
.cal-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-key i.bill{background:color-mix(in srgb,var(--brandink) 40%,var(--card))}
.cal-key i.sub{background:#7A5CC7}
.cal-key i.debt{background:var(--warn)}
.cal-key i.pay{background:var(--good)}
.cal-key i.sp{background:var(--line2)}
.day-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:14px 0 6px}
.day-h:first-child{margin-top:0}
@media (max-width:700px){
  .cal{gap:3px}
  .calc{min-height:58px;padding:4px 3px}
  .ev{font-size:0;padding:0;height:5px;border-radius:3px}
  .ev.more{display:none}
  .calc .sp{font-size:0;height:3px;width:70%;border-radius:2px;background:var(--line2)}
  .ev.paid::before{content:none}
  #calTitle{font-size:14px}
  .cal-sum{flex-basis:100%}
  section:has(>.card-head .cal-sum)>.card-head{flex-wrap:wrap}
}

/* rollover and splits */
.carry{grid-column:1/-1;font-size:12px;color:var(--good);font-weight:600;margin-top:2px}
.split-edit{margin-top:10px;padding:12px;border-radius:var(--r-sm);background:var(--chip);display:grid;gap:8px}
.split-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;align-items:center}
.split-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.split-foot .ok{color:var(--good);font-weight:600}
.split-foot .todo{color:var(--warnink);font-weight:600}
.small-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card);cursor:pointer;color:var(--ink)}

/* a usual, learned from what you buy */
.chip.usual{border-style:dashed}

/* wait list */
.wish .wait .bar{height:8px}
.wish.ready{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wait-t{font-size:13px;color:var(--soft);margin-top:6px;font-weight:600}
.wish.ready .wait-t{color:var(--accentink)}
.wish-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.seg .count{font-size:12px;opacity:.7;margin-left:2px}

/* challenges */
.ch-sum{font-size:14px;color:var(--soft)}
.ch-sum b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.tiles.days7{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
.challenge .tile{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;padding:2px}
.challenge .tile:hover{border-color:var(--accent)}
.challenge .tile.done{background:var(--good);border-color:var(--good);color:var(--card)}
.challenge .tile.done::before{content:"✓ "}
.challenge .tile:disabled{opacity:.4;cursor:default}
.ch-types{display:grid;gap:8px}
.ch-types button{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:var(--r-sm);min-height:auto}
.ch-types button span{font-size:13px;color:var(--soft);font-weight:400}
.ch-types button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* year planner */
.yr-bars{position:relative;display:grid;grid-template-columns:repeat(var(--cols,12),minmax(0,1fr));gap:8px;height:190px;align-items:end;padding-top:6px}
.yr-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.yr-col b{font-size:11px;color:var(--soft);font-weight:700}
.yr-stack{flex:1;width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end}
.yr-stack span{display:block;width:100%}
.yr-stack .reg{background:color-mix(in srgb,var(--brandink) 22%,var(--card));border-radius:0 0 6px 6px}
.yr-stack .irr{background:var(--warn);border-radius:6px 6px 0 0;opacity:.85}
.yr-even{position:absolute;left:0;right:0;border-top:2px dashed var(--good);margin-bottom:23px;pointer-events:none;z-index:1}
.cal-key i.yr-k-reg{background:color-mix(in srgb,var(--brandink) 30%,var(--card))}
.cal-key i.yr-k-irr{background:var(--warn)}
.cal-key i.yr-k-even{background:none;border-top:2px dashed var(--good);height:0;width:14px;vertical-align:3px;border-radius:0}
.pot{padding:14px 0;border-bottom:1px solid var(--line)}
.pot:last-child{border-bottom:0}
.pot-t{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pot .n{font-weight:600}
.pot .m{font-size:13px;color:var(--soft);margin-top:2px}
.pot-b{display:flex;gap:12px;align-items:center}
.pot-ok{color:var(--good);font-weight:700;font-size:14px}
.bar span.done{background:var(--good)}
.yr-grid-wrap{overflow-x:auto}
.yr-grid{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:720px}
.yr-grid th,.yr-grid td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.yr-grid th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.yr-grid thead th{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.yr-grid tr.tot th,.yr-grid tr.tot td{color:var(--soft)}
@media (max-width:700px){.yr-bars{gap:3px;height:150px}.yr-col b{font-size:9px}}
[data-screen]{min-width:0}
#screen-year>.card{min-width:0;max-width:100%}

/* jump to anything, shortcuts, help */
.jump-btn,.help-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line2);background:var(--card);color:var(--soft);border-radius:12px;padding:9px 12px;margin:0 0 14px;cursor:pointer;font-size:14px;min-height:40px}
.help-btn{border:0;background:none;margin:8px 0 0;padding:8px 12px}
.jump-btn:hover,.help-btn:hover{color:var(--ink);border-color:var(--accent)}
.jump-btn kbd{margin-left:auto}
kbd{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--ink)}
.jump-list{margin-top:10px;max-height:340px;overflow:auto;display:grid;gap:2px}
.jump-list button{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);min-height:44px}
.jump-list button[aria-selected="true"],.jump-list button:hover{background:var(--chip)}
.jump-list button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.jump-list .kd{font-size:12px;color:var(--soft)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;margin-bottom:12px}
.keys dd{margin:0}
.help-cards{display:grid;gap:10px}
.help-card{display:grid;grid-template-columns:36px 1fr;gap:2px 12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--chip)}
.help-card .em{grid-row:span 2;font-size:24px}
.help-card h3{font-size:15px;margin:0}
.help-card p{margin:0;font-size:14px;color:var(--soft)}

/* bank file import */
.dialog.wide{width:min(980px,100%)}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
.imp-sum{font-size:14px;color:var(--soft);margin:4px 0 10px}
.imp-wrap{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.imp{width:100%;border-collapse:collapse;font-size:13px}
.imp th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);padding:8px;border-bottom:1px solid var(--line);z-index:1}
.imp td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.imp td.d{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp .r{text-align:right;white-space:nowrap}
.imp td.in{color:var(--good);font-weight:600}
.imp tr.dup td{opacity:.5}
.imp tr.maybe{background:color-mix(in srgb,var(--warn) 7%,var(--card))}
.imp input[type=checkbox]{width:20px;height:20px}
.select.sm{min-height:34px;padding:4px 8px;font-size:13px;max-width:190px}
.imports{margin-top:12px}

/* files */
label.check{display:flex;gap:10px;align-items:center;margin:10px 0;min-height:32px}
label.check input{width:20px;height:20px}
.warn-note{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
#printArea{display:none}
@media print{
  body.printing-recovery>*:not(#printArea){display:none!important}
  body.printing-recovery #printArea{display:block;color:#000;font-size:14pt;padding:20mm}
  #printArea h1{font-size:24pt;margin:0}
  #printArea h2{font-size:15pt;margin:18pt 0 6pt}
  #printArea .p-sub{color:#444}
}

/* warning words: the warn colour pulled toward the text colour so it reads at 4.5:1 in every theme */
html{--warnink:color-mix(in srgb,var(--warn) 78%,var(--ink))}

input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.tag.pays{background:color-mix(in srgb,var(--good) 14%,var(--card));color:var(--good);border-color:transparent}

/* ---------- motion: where things grow from ---------- */
.bar > span,.inout i,.cmp i,.split > span,.dp-bar > span,.wait .bar span{transform-origin:left center}
.yr-stack,.year .ym i{transform-origin:bottom center}
.wf-bar{transform-box:fill-box}
.wf-up{transform-origin:bottom center}
.wf-down{transform-origin:top center}
.sk-node{transform-box:fill-box;transform-origin:center}

/* the sheen that passes once over the big card */
.hero,.worth-hero,.dp-hero{position:relative;overflow:hidden;isolation:isolate}
.m-sheen{position:absolute;top:-20%;bottom:-20%;left:0;width:34%;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,#fff 26%,transparent),transparent)}
/* a soft light that follows the mouse over the big cards */
.hero::before,.worth-hero::before,.dp-hero::before,.health::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,#fff 16%,transparent),transparent 60%)}
.health{position:relative;overflow:hidden}
.m-lit::before{opacity:1}
.hero > *,.worth-hero > *,.dp-hero > *{position:relative;z-index:1}
/* the dot riding the edge of a line as it draws */
.m-comet{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);pointer-events:none;z-index:3;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent),0 0 18px 6px color-mix(in srgb,var(--accent) 45%,transparent)}
/* sparks from something you just finished */
.m-spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:90}
.m-pop{animation:m-pop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes m-pop{0%{transform:scale(1)}30%{transform:scale(1.035);box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 22%,transparent)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}
.tile.m-pop{animation:m-tile .6s cubic-bezier(.2,.8,.2,1)}
@keyframes m-tile{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* a new theme spreading out from the tap */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- scrubbing a line chart ---------- */
svg[data-scrub]{touch-action:pan-y;cursor:crosshair;outline-offset:4px}
.scrub-line{position:absolute;width:0;border-left:1.5px dashed var(--brandink);opacity:.45;pointer-events:none;z-index:3}
.scrub-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--accent);transform:translate(-50%,-50%);pointer-events:none;z-index:4;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.scrub-tip{position:absolute;z-index:5;pointer-events:none;background:var(--brandink);color:var(--card);border-radius:10px;padding:6px 10px;font-size:12px;display:grid;gap:1px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.scrub-tip b{font-size:15px}
.scrub-tip small{opacity:.8}
.scrub-line[hidden],.scrub-dot[hidden],.scrub-tip[hidden]{display:none}

/* ---------- where the money went ---------- */
.sankey svg{width:100%;height:auto;display:block;overflow:visible}
.sk-link{opacity:.42;transition:opacity .25s;cursor:pointer}
.sk-link:hover{opacity:.62}
.sk-node{cursor:pointer}
.sk-label{font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;cursor:pointer;transition:opacity .25s}
.sk-amt{font-size:12.5px;font-weight:500;fill:var(--soft)}
.sk.focus .sk-link{opacity:.1}
.sk.focus .sk-link.on{opacity:.72}
.sk.focus .sk-node:not(.on),.sk.focus .sk-label:not(.on){opacity:.35}
.sk-detail{font-size:14px;color:var(--soft);margin:8px 0 0;min-height:1.4em;text-align:center}
.chart-data{margin-top:10px;font-size:13px}
.chart-data summary{cursor:pointer;color:var(--soft);min-height:32px;display:flex;align-items:center;gap:6px}
.chart-data table{width:100%;border-collapse:collapse;margin-top:8px}
.chart-data th,.chart-data td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.chart-data td{text-align:right}
.chart-data tr.sub th{padding-left:20px;font-weight:400;color:var(--soft)}

/* ---------- how the month added up ---------- */
.wf{width:100%;height:auto;display:block}
.wf-val{font-size:14px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.wf-lab{font-size:13px;fill:var(--soft)}
.wf-conn{stroke:var(--line2);stroke-dasharray:3 4}
.wf-zero{stroke:var(--brandink);stroke-opacity:.35}

/* ---------- debt payoff line ---------- */
.dp-chart-box{margin-top:18px}
.dp-chart-box .legend{color:inherit;opacity:.8}

/* ---------- goal jars ---------- */
.goal-body{display:flex;align-items:center;gap:14px}
.jar{width:58px;flex:none}
.jar svg{width:100%;height:auto;display:block}

@media (prefers-reduced-motion:reduce){.m-sheen,.m-comet,.m-spark{display:none}.m-pop,.tile.m-pop{animation:none}}
@media (max-width:700px){.sk-label{font-size:16px}.sk-amt{font-size:14px}.wf-val{font-size:16px}.wf-lab{font-size:15px}}
.wf-said{font-size:14px;margin:0 0 10px;line-height:1.5}
.wf-said .muted{display:block;font-size:13px;margin-top:2px}
.wf-key{font-size:13px;color:var(--soft);margin:0 0 4px}

/* ---------- every theme has a dark version (html[data-scheme="dark"]) ---------- */
html[data-scheme="dark"]:not([data-theme="midnight"]){color-scheme:dark;--herobtnink:#10130F}
html[data-scheme="dark"][data-theme="ink"]{
  --page:#101114;--side:#131418;--card:#1A1C21;--ink:#ECEAE4;--brandink:#FFFFFF;--soft:#A3A6AE;--line:#2A2D34;--line2:#3A3E47;
  --navink:#C3C6CE;--navon:#8FA4FF;--navonink:#101114;
  --accent:#8FA4FF;--accentink:#B3C1FF;--onaccent:#101114;--good:#4FD69C;--warn:#FF8A6B;--track:#2A2D34;--chip:#15171B;
  --herobg:#23262E;--herocur:#8FA4FF;--herototal:#B3C1FF;--herobtn:#8FA4FF;--herobtnink:#101114}
html[data-scheme="dark"][data-theme="sage"]{
  --page:#0F1511;--side:#111813;--card:#18211B;--ink:#E6EEE7;--brandink:#FFFFFF;--soft:#9DB0A2;--line:#253128;--line2:#344437;
  --navink:#BFD0C3;--navon:#8FD1A8;--navonink:#0F1511;
  --accent:#7CC79B;--accentink:#A3DDBA;--onaccent:#0F1511;--good:#6FD39B;--warn:#F08C6C;--track:#253128;--chip:#141B16;
  --herobg:#223A2C;--herocur:#B6C9BC;--herototal:#CFE8D6;--herobtn:#CFE8D6;--herobtnink:#10241A}
html[data-scheme="dark"][data-theme="blush"]{
  --page:#161013;--side:#1A1216;--card:#22181D;--ink:#F3E6EA;--brandink:#FFFFFF;--soft:#BFA2AC;--line:#35252C;--line2:#48323B;
  --navink:#DCC3CB;--navon:#F29BB6;--navonink:#161013;
  --accent:#F08DAD;--accentink:#F7B4C9;--onaccent:#161013;--good:#6FD39B;--warn:#FF8F77;--track:#35252C;--chip:#1C1418;
  --herobg:#4A2232;--herocur:#E3C2CB;--herototal:#F6C9D5;--herobtn:#F6C9D5;--herobtnink:#3A1624}
html[data-scheme="dark"][data-theme="sand"]{
  --page:#15120E;--side:#191511;--card:#211C16;--ink:#F1E9DD;--brandink:#FFFFFF;--soft:#BBAB96;--line:#342C22;--line2:#463B2E;
  --navink:#DACBB6;--navon:#F2B98C;--navonink:#15120E;
  --accent:#F0A56E;--accentink:#F6C39C;--onaccent:#15120E;--good:#86C98A;--warn:#FF8C6E;--track:#342C22;--chip:#1B1712;
  --herobg:#3B2F24;--herocur:#D6C5AE;--herototal:#F2B98C;--herobtn:#F2B98C;--herobtnink:#2E1C0E}
html[data-scheme="dark"][data-theme="lavender"]{
  --page:#110F19;--side:#14121D;--card:#1C1928;--ink:#ECE9F7;--brandink:#FFFFFF;--soft:#AAA3C6;--line:#2B2740;--line2:#3B3556;
  --navink:#CAC4E6;--navon:#B3A6FF;--navonink:#110F19;
  --accent:#A99BFF;--accentink:#C7BDFF;--onaccent:#110F19;--good:#6FD39B;--warn:#FF8FA3;--track:#2B2740;--chip:#17141F;
  --herobg:#2E2656;--herocur:#C6BEEA;--herototal:#CFC4FF;--herobtn:#CFC4FF;--herobtnink:#1D1640}

/* ---------- text size ---------- */
html[data-textsize="large"] .app,html[data-textsize="large"] #modalRoot,html[data-textsize="large"] .first{zoom:1.12}
html[data-textsize="larger"] .app,html[data-textsize="larger"] #modalRoot,html[data-textsize="larger"] .first{zoom:1.25}

/* ---------- accounts ---------- */
.acct-ctl{display:flex;gap:10px;align-items:center}

/* ---------- setup ---------- */
.setup{max-width:520px;margin:0 auto;text-align:left}
.setup h1{margin:6px 0 14px}
.su-lede{color:var(--soft);margin-bottom:14px}
.su-big{font-size:28px;font-weight:700}
.su-dots{display:flex;gap:6px;margin-bottom:18px}
.su-dots i{height:6px;flex:1;border-radius:3px;background:var(--track)}
.su-dots i.on{background:var(--accent)}
.su-acts{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:22px}
.su-acts #suBack{margin-right:auto}
.su-bills{display:grid;gap:8px;margin-bottom:10px}
.su-bill{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 64px;gap:8px;align-items:center}
.su-bill .em{font-size:20px;text-align:center}

/* ---------- plan ---------- */
.step-list{display:grid;gap:2px}
.step{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);min-height:44px}
.step.done span{text-decoration:line-through;color:var(--soft)}
.step-add{display:flex;gap:8px;margin-top:14px}
.step-add .input{flex:1}
.note-area{width:100%;resize:vertical;min-height:90px;font:inherit;line-height:1.5}
.note-area.dump{min-height:320px}
.timer{position:relative;width:180px;height:180px;margin:0 auto}
.timer svg{width:100%;height:100%}
.timer-num{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700;font-family:var(--bignum)}
#timerArc{transition:stroke-dashoffset 1s linear}
.ms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ms{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:4px;font-size:13px;color:var(--soft);opacity:.7}
.ms.on{opacity:1;border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--card))}
.ms b{color:var(--ink);font-size:14px}
.ms-ic{font-size:22px}
@media (max-width:700px){.su-bill{grid-template-columns:24px minmax(0,1fr) 90px 54px}}

/* the heat calendar's second-darkest cells read at 4.5:1 in every dark theme */
html[data-scheme="dark"] .dayc[data-level="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--card));color:var(--onaccent)}

/* ---------- batch 6: trust and polish ---------- */
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.eye[aria-pressed="true"]{background:var(--navon);color:var(--navonink);border-color:var(--navon)}
.rng{display:flex;align-items:center;gap:6px;min-width:0;width:100%}
.rng input[type=range]{flex:1;min-width:0}
.step-btn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:18px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.step-btn:hover{border-color:var(--accent)}
.dp-hero .step-btn{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.paid-st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;white-space:nowrap}
.paid-st .ok{color:var(--good);font-weight:700}
.paid-st .link{min-height:24px}
.fc-assume,.dp-note,.yr-base{font-size:13px;color:var(--soft);margin-top:10px;line-height:1.5}
.dp-note{opacity:.85;color:inherit}
.link{min-height:32px;padding:4px 2px}
/* phones: a row puts its name first, then amount and action underneath, so nothing squeezes */
@media (max-width:420px){
  .rep{grid-template-columns:40px minmax(0,1fr) auto;row-gap:6px}
  .rep > :last-child:not(.a){grid-column:2 / -1;justify-self:start}
  .rep .n{white-space:normal}
  .row-btn .m{white-space:normal}
  .paid-st{flex-direction:row;align-items:center;gap:10px}
}

/* ============================================================
   Batch 7: number pad, payments calendar on Today, rules and tags,
   undo history, balance history, backup check.
   ============================================================ */

/* ---------- number pad ---------- */
.np{margin-top:10px;display:grid;gap:10px}
.np-bump{display:flex;gap:8px;flex-wrap:wrap}
.np-bump button{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid transparent;background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accentink);font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.np-bump button:hover{border-color:var(--accent)}
.np-bump .np-clear{margin-left:auto;background:none;color:var(--soft);font-weight:600}
.np-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np-keys button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--bignum);font-size:22px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation}
.np-keys button:hover{border-color:var(--line2)}
.np-keys button:active{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.np-keys button[data-np="back"]{font-size:20px;color:var(--soft)}
@media (min-width:900px) and (pointer:fine){.np-keys button{min-height:44px;font-size:19px}}

/* ---------- payments calendar on Today ---------- */
.paycal .card-head{flex-wrap:wrap;gap:6px 14px}
.paycal .pc-sum{font-size:13px;margin-right:auto}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pcal>b{font-size:11px;color:var(--soft);text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pc-day{min-height:74px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.pc-day:hover{border-color:var(--line2)}
.pc-day.past{opacity:.5}
.pc-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc-day .dn{font-size:12px;font-weight:700;color:var(--soft);white-space:nowrap}
.pc-day.today .dn{color:var(--accentink)}
@media (max-width:700px){
  .pcal{gap:3px}
  .pc-day{min-height:50px;padding:4px 3px}
  .pc-day .ev{font-size:0;padding:0;height:5px;border-radius:3px}
  .pc-day .ev.more{display:none}
  .pc-day .ev.paid::before{content:none}
  .pc-day .dn{font-size:11px}
}

/* ---------- tags and rules ---------- */
.tag.hash{background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accentink);text-transform:none;letter-spacing:0}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tagbar .chip[aria-pressed="true"]{background:var(--navon);color:var(--navonink);border-color:var(--navon)}
.rule-list,.undo-list{display:grid;gap:2px;margin:8px 0 4px}
.rule-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rule-row:last-child{border-bottom:0}
.rule-row .muted{font-size:13px}
.tx-more{display:block;margin:14px auto 0}
.bk-list{margin:8px 0 10px 18px;line-height:1.7}
.acct-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* calendar amounts: always the main text colour (readable in every theme, light and dark);
   the kind of payment shows as the tint and a coloured edge */
.ev.bill,.ev.sub,.ev.debt,.ev.pay{color:var(--ink);padding-left:7px}
.ev.bill{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--brandink) 55%,var(--card))}
.ev.sub{background:color-mix(in srgb,#7A5CC7 14%,var(--card));box-shadow:inset 3px 0 0 #7A5CC7}
.ev.debt{background:color-mix(in srgb,var(--warn) 14%,var(--card));box-shadow:inset 3px 0 0 var(--warn)}
.ev.pay{background:color-mix(in srgb,var(--good) 14%,var(--card));box-shadow:inset 3px 0 0 var(--good)}
/* phone: the amount hides and the pill becomes a solid 5px bar, drawn by the inset edge so the text colour stays readable */
@media (max-width:700px){.pc-day .ev.bill,.calc .ev.bill{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--brandink) 45%,var(--card))}.pc-day .ev.sub,.calc .ev.sub{box-shadow:inset 0 0 0 3px #7A5CC7}.pc-day .ev.debt,.calc .ev.debt{box-shadow:inset 0 0 0 3px var(--warn)}.pc-day .ev.pay,.calc .ev.pay{box-shadow:inset 0 0 0 3px var(--good)}}
/* one row of quick amounts on a phone, Clear included; no blue tap flash */
.np button{-webkit-tap-highlight-color:transparent}
.np-bump{flex-wrap:nowrap}
.np-bump button{flex:1 1 0;min-width:0;padding:6px 4px}
.np-bump .np-clear{flex:0 0 auto;margin-left:0;padding:6px 8px}

/* ============================================================
   Batch 8: sidebar subtabs, the V2 parity cards, Today your way,
   and the moments that answer real changes.
   ============================================================ */

/* ---------- sidebar: groups, screens, subtabs ---------- */
.side{overflow-y:auto}
.nav-top{display:flex;justify-content:flex-end;margin:0 2px 6px}
.nav-all{background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--soft);cursor:pointer;min-height:28px}
.nav-all:hover,.nav-all[aria-pressed="true"]{color:var(--navink);border-color:var(--navon)}
.nav-grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:12px 12px 4px}
.nav-item{display:flex;flex-direction:column}
.nav-row{display:flex;align-items:center;gap:2px}
.nav .nav-row .nav-main{flex:1;min-width:0}
.nav .nav-chev{flex:none;width:34px;min-height:34px;padding:0;justify-content:center;border-radius:var(--r-sm);color:var(--soft)}
.nav .nav-chev svg{width:15px;height:15px;transition:transform .2s ease}
.nav .nav-chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.nav-subs{display:flex;flex-direction:column;margin:2px 0 6px 22px;padding-left:10px;border-left:1px solid var(--line2)}
.nav .nav-sub{min-height:32px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--soft);border-radius:8px}
.nav .nav-sub:hover{color:var(--navink)}
.nav .nav-sub[aria-current="true"]{color:var(--navink);font-weight:700;background:color-mix(in srgb,var(--navon) 10%,transparent)}
.nav-item.open .nav-subs{animation:subsIn .18s ease-out}
@keyframes subsIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.sub-glow{animation:subGlow 1.5s ease-out}
@keyframes subGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.more-groups .nav-grp{margin:14px 4px 4px}
.more-subs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px 46px}
.more-subs .chip{font-size:13px;min-height:32px}

/* ---------- Spending: purchases · money in · both ---------- */
.ledger-seg{margin:0 0 10px}
.ledger-sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:4px 0 8px;color:var(--soft)}
.ledger-sum b{color:var(--ink)}

/* ---------- Debt ---------- */
.dp-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.dp-cmp{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--card)}
.dp-cmp.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dp-cmp .t{font-weight:700;font-size:14px}
.dp-cmp .v{font-family:var(--bignum);font-size:22px;font-weight:700;margin:4px 0 2px;color:var(--brandink)}
.dp-cmp .s{font-size:13px;color:var(--soft)}
.dp-cleared{font-weight:700;color:var(--good)}

/* ---------- Split my pay ---------- */
.ps-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line);margin:4px 0 14px}
.ps-bar span{height:100%}
.ps-bills{background:color-mix(in srgb,var(--brandink) 55%,var(--card))}
.ps-debt{background:var(--warn)}
.ps-save{background:var(--accent)}
.ps-spend{background:#7A5CC7}
.ps-left{background:var(--good)}
.ps-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.ps-part{display:flex;align-items:center;gap:10px;font-size:14px}
.ps-part .ps-n{flex:1;min-width:0}
.ps-part input{width:110px;text-align:right}
.ps-dot{width:10px;height:10px;border-radius:3px;flex:none}
.ps-left-line{margin:14px 0 6px;font-size:15px}
.ps-left-line.warn{color:var(--warnink)}

/* ---------- Goals: safety net, top priority ---------- */
.safety-net .card-head{flex-wrap:wrap;gap:8px}
.sn-months{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.sn-line{font-size:15px;margin:0 0 10px}
.sn-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--soft)}
.tag.top{background:color-mix(in srgb,#E0A526 22%,var(--card));color:var(--ink)}
.tag.price.up{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--ink)}
.tag.price.down{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--ink)}
.every-n{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.every-n input{width:70px}

/* ---------- Today: worth a look, your order ---------- */
.nba-list{display:grid;gap:8px}
.nba{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px}
.nba .em{font-size:18px;flex:none}
.nba .t{flex:1;min-width:0}
.nba.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.nba-none{margin:0;color:var(--soft)}
.today-foot{text-align:center;margin:18px 0 4px;font-size:13px}
.tc-list{display:grid;gap:2px;margin-top:8px}
.tc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.tc-row .small-btn{margin-left:4px}
.breath{display:inline-block;margin:2px 0 8px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,#fff 16%,transparent)}
.breath.up{color:inherit}
.rebuild{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.rb-step{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,#fff 18%,transparent);opacity:1}
.rebuilding .rb-step{animation:rbIn .3s ease-out both;animation-delay:calc(var(--i) * .35s)}
.rebuilding .big{animation:settle .4s ease-out 1.1s both}
@keyframes rbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:.3;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- This year ---------- */
.an-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.an-strip .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
.an-strip .v{font-family:var(--bignum);font-size:24px;font-weight:700;margin-top:4px}
.an-strip .v.warn{color:var(--warnink)}
.an-strip .s{font-size:12px;color:var(--soft)}
.an-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.an-cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-bottom:8px}
.an-cat .bar{grid-column:1/-1;height:6px}
.an-month{font-size:14px;margin:0 0 8px}
@media (max-width:700px){.an-cols,.dp-compare{grid-template-columns:1fr}}

/* ---------- moments ---------- */
.just-paid .ok{animation:writeIn .45s ease-out both}
@keyframes writeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.goal{position:relative}
.closer{position:absolute;top:14px;right:54px;font-size:13px;font-weight:800;color:var(--good);animation:closer 1.8s ease-out both;pointer-events:none}
@keyframes closer{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.rising .jar,.rising .bar>span{transition:height .4s cubic-bezier(.2,.8,.2,1),width .4s cubic-bezier(.2,.8,.2,1)}
.ghost-line{fill:none;stroke:var(--soft);stroke-width:3;opacity:.28;vector-effect:non-scaling-stroke}
.dayc{position:relative;overflow:hidden}
.dayc.ink::after{content:"";position:absolute;inset:4px;border-radius:8px;background:var(--accent);animation:ink .6s ease-out both;pointer-events:none}
@keyframes ink{from{transform:scale(.5);opacity:.35}to{transform:scale(1.1);opacity:0}}
html.theme-changing body{opacity:.72;transition:opacity .09s ease}
html body{transition:opacity .16s ease}
.seal-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:700;color:var(--good)}
.seal{width:44px;height:44px;fill:none;stroke:var(--good);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seal.go rect,.seal.go path{stroke-dasharray:90;stroke-dashoffset:90;animation:seal .5s ease-out forwards}
.seal.go path{animation-delay:.25s}.seal.go .tick{animation-delay:.55s}
@keyframes seal{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .sub-glow,.nav-item.open .nav-subs,.just-paid .ok,.closer,.dayc.ink::after,.rebuilding .rb-step,.rebuilding .big,.seal.go rect,.seal.go path{animation:none}
  .seal.go rect,.seal.go path{stroke-dashoffset:0}
}
html[data-motion="off"] .sub-glow,html[data-motion="off"] .nav-item.open .nav-subs,html[data-motion="off"] .just-paid .ok,html[data-motion="off"] .closer,
html[data-motion="off"] .dayc.ink::after,html[data-motion="off"] .rebuilding .rb-step,html[data-motion="off"] .rebuilding .big,
html[data-motion="off"] .seal.go rect,html[data-motion="off"] .seal.go path,html[data-motion="off"] .nav .nav-chev svg{animation:none;transition:none}
html[data-motion="off"] .seal.go rect,html[data-motion="off"] .seal.go path{stroke-dashoffset:0}
html[data-motion="off"] body{transition:none}
.more-groups .em svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- changed on two devices ---------- */
.conflict-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin:0 0 16px;border-radius:var(--r-sm);border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card));font-size:14px;font-weight:600}
.cf-list{display:grid;gap:12px;margin-top:10px}
.cf-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.cf-t{font-size:14px;margin-bottom:8px}
.cf-opts{display:flex;flex-wrap:wrap;gap:8px}
.cf-opts .btn{white-space:normal;text-align:left}
.cf-who{opacity:.85;font-weight:500}

/* ---------- Reviews: folded charts ---------- */
.fold-btn{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--soft);flex:none}
.fold-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transition:transform .2s ease}
.folded .fold-btn svg{transform:rotate(0deg)}
.fold-peek{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:4px 0 0;text-align:left;font:inherit;font-size:14px;color:var(--soft);cursor:pointer}
.fold-peek .fold-open{color:var(--accentink);font-weight:700;white-space:nowrap}
.folded{padding-bottom:16px}
html[data-motion="off"] .fold-btn svg{transition:none}
@media print{.fold-body{display:block!important}.fold-body[hidden]{display:block!important}.fold-peek,.fold-btn,[data-act="rev-all"]{display:none!important}}

/* ---------- medium widths (tablets, half-screen windows): nothing gets squeezed ---------- */
@media (min-width:821px) and (max-width:1080px){
  .app{grid-template-columns:208px minmax(0,1fr)}
  .side{padding:22px 12px}
  .grid .span8,.grid .span7,.grid .span5{grid-column:span 12}
  .grid .span4,.grid .span3{grid-column:span 6}
  .hero{grid-template-columns:1fr}
  .an-cols{grid-template-columns:1fr}
}
/* the 365-day year has a short first and last column; their labels wrap instead of crowding */
.yr-col b{white-space:normal;text-align:center;line-height:1.2}
@media (min-width:821px) and (max-width:1080px){#screen-today [aria-labelledby="winsTitle"]{grid-column:span 12}}

/* ---------- number style picker ---------- */
.numfonts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

<script>
"use strict";
(function(){
/* ============================================================
   FinNestStudio — Ultimate Budget Planner V3
   Built on the shared FinNest core (_build/core). This file is the
   product's identity: where it saves, its schema, name and version.
   Its own storage key keeps it apart from V2 and the ADHD Planner.
   ============================================================ */

var KEY       = "finnest_ultimate_v3_demo";
var SCHEMA    = 5;
var APP_ID    = "finnest-ultimate-dashboard";
var APP_NAME  = "Ultimate Budget Planner";
var VERSION   = "3.0.0-dev";

/* ---------- storage: never claims success it did not have ---------- */
var memStore = null;
var storageOK = true;
var storage = {
  read:function(){
    try{ return window.localStorage.getItem(KEY); }
    catch(e){ storageOK = false; return memStore; }
  },
  write:function(v){
    try{
      window.localStorage.setItem(KEY, v);
      if(!storageOK){ storageOK = true; flagStorage(); }
      return true;
    }catch(e){
      memStore = v;
      if(storageOK){ storageOK = false; flagStorage(); }
      return false;
    }
  },
  clear:function(){
    try{ window.localStorage.removeItem(KEY); }catch(e){}
    memStore = null;
  }
};
function flagStorage(){
  try{ document.body.classList.toggle("storage-failed", !storageOK); }catch(e){}
}

/* ---------- small helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function round2(n){
  var v = +n;
  if(!isFinite(v)) return 0;
  return Math.round((v + Number.EPSILON) * 100) / 100;
}
function num(n){ var v = parseFloat(n); return isFinite(v) ? v : 0; }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function safeDiv(a,b){ return (b && isFinite(b) && b !== 0) ? (a/b) : 0; }

/* Local calendar dates only. Noon anchor avoids DST day-shifts. */
function parseDate(str){
  if(!str) return startOfToday();
  var p = String(str).split("-");
  var y = +p[0], m = +p[1], d = +p[2];
  if(!isFinite(y) || !isFinite(m) || !isFinite(d)) return startOfToday();
  return new Date(y, m-1, d, 12,0,0,0);
}
/* an ISO date that is actually a date; anything else falls back */
function safeDate(v, fallback){
  var s = String(v==null ? "" : v);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return fallback || fmtISO(startOfToday());
  var p = s.split("-"), y=+p[0], m=+p[1], d=+p[2];
  if(m < 1 || m > 12 || d < 1 || d > daysInMonth(y, m-1)) return fallback || fmtISO(startOfToday());
  return s;
}
/* the local day of a stored moment: stamps are saved in UTC, so just after midnight
   (or anywhere ahead of UTC) the first ten characters name the day before */
function stampDay(stamp){
  var t=String(stamp||"");
  if(t.length<=10)return t.slice(0,10);
  var d=new Date(t);return isNaN(d.getTime())?t.slice(0,10):fmtISO(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
function fmtISO(dt){
  var y=dt.getFullYear(), m=dt.getMonth()+1, d=dt.getDate();
  return y + "-" + (m<10?"0":"") + m + "-" + (d<10?"0":"") + d;
}
function startOfToday(){ var n=NOW(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12,0,0,0); }
/* single clock seam so tests can travel in time deterministically */
var _clock = null;
function NOW(){ return _clock ? new Date(_clock.getTime()) : new Date(); }
function addDays(dt,n){ var d=new Date(dt.getTime()); d.setDate(d.getDate()+n); return d; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function addMonthsClamped(dt,n,dayOfMonth){
  var y=dt.getFullYear(), m=dt.getMonth();
  var total = m + n;
  var ny = y + Math.floor(total/12);
  var nm = ((total%12)+12)%12;
  var dom = dayOfMonth || dt.getDate();
  return new Date(ny, nm, Math.min(dom, daysInMonth(ny,nm)), 12,0,0,0);
}
function dayDiff(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function sameDay(a,b){ return fmtISO(a)===fmtISO(b); }
function escapeHTML(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
/* user-supplied colours are data: validate before they reach the DOM */
function safeColor(c, fallback){
  return /^#[0-9a-fA-F]{6}$/.test(String(c||"")) ? String(c) : (fallback || "#7A8896");
}
/* keep one emoji-ish grapheme, never markup */
function safeGlyph(g, fallback){
  var s = String(g==null?"":g).replace(/[<>&"']/g,"");
  return s.slice(0,4) || (fallback || "✨");
}

/* ---------- money input ----------
   Documented rule. Both separators present: the LAST one is the decimal
   point, the other is grouping. One separator appearing more than once:
   grouping. One separator appearing once: grouping when exactly three
   digits follow it, otherwise the decimal point. Grouping is validated —
   every group after the first must be three digits — so "1,2,3" is
   rejected rather than silently becoming 123.
   Returns a Number, or null when the text cannot be read as one amount. */
function parseAmount(text){
  var raw = String(text == null ? "" : text).trim();
  if(!raw) return 0;
  var neg = /^-/.test(raw);
  var s = raw.replace(/[^0-9.,]/g, "");
  if(!s) return null;
  var dots = (s.match(/\./g) || []).length;
  var commas = (s.match(/,/g) || []).length;
  var dec = null, group = null;
  if(dots && commas){
    dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
    group = dec === "." ? "," : ".";
  } else if(dots || commas){
    var ch = dots ? "." : ",";
    var count = dots || commas;
    if(count > 1){ group = ch; }
    else {
      var after = s.length - s.indexOf(ch) - 1;
       /* A leading-zero integer cannot be a thousands group: 0.001 and
          0,001 are decimal fractions, while 1,234 remains grouping. */
       var before = s.slice(0, s.indexOf(ch));
