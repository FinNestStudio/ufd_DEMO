  var blob=new Blob([rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finance-transactions-'+todayISO()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Transactions CSV exported');
}
function parseCSV(text){
  var rows=[],row=[],cell='',quote=false;
  for(var i=0;i<text.length;i++){var c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quote=false;else cell+=c;}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}
  if(quote)throw Error('Unclosed CSV quotation');if(cell||row.length){row.push(cell);rows.push(row);}return rows;
}
var csvTxKey=t=>[
  String(t.date||''),String(t.type||'expense').toLowerCase(),normName(t.desc),String(t.cat||'Other').toLowerCase(),(+t.amount||0).toFixed(2),
  (t.splits||[]).map(x=>String(x.cat||'').toLowerCase()+':'+(+x.amount||0).toFixed(2)).sort().join('|')
].join('||');
function importCSV(ev){
  var file=ev.target.files[0];if(!file)return;if(file.size>10*1024*1024){toast('CSV is too large (maximum 10 MB).',true);ev.target.value='';return;}var r=new FileReader();
  r.onload=()=>{try{
    var rows=parseCSV(r.result),head=(rows.shift()||[]).map(x=>x.replace(/^\uFEFF/,'').trim().toLowerCase()),idx=n=>head.indexOf(n);if(idx('date')<0||idx('amount')<0||rows.length>50000)throw Error('Invalid CSV headings or too many rows');
    var candidates=[],invalid=0;
    rows.forEach(row=>{
      try{
        var date=String(row[idx('date')]||'').trim(),type=String(row[idx('type')]||'expense').trim().toLowerCase(),amount=+(row[idx('amount')]||0);
        if(!validDate(date)||!Number.isFinite(amount)||!amount||!['income','expense','transfer'].includes(type))throw Error('Invalid date, type or amount');
        var splitText=row[idx('split categories')]||'',splits=splitText.trim().startsWith('[')?JSON.parse(splitText):splitText.split('|').filter(Boolean).map(x=>{var p=x.lastIndexOf(':');if(p<1)throw Error('Invalid split');return{cat:x.slice(0,p),amount:+x.slice(p+1)};});
        const unquote=s=>String(s||'').replace(/^'(?=\s*[=+@-]|[\t\r\n])/,'');
        const transaction={id:uid(),date,type,desc:unquote(row[idx('description')]),cat:unquote(row[idx('category')]||'Other'),amount:Math.abs(amount),splits};
        const candidate=blankState();candidate.tx=[transaction];validatePlanData(candidate);candidates.push(transaction);
      }catch(e){invalid++;}
    });
    var seen=new Set(S.tx.map(csvTxKey)),fresh=[],duplicates=[];
    candidates.forEach(t=>{var key=csvTxKey(t);if(seen.has(key))duplicates.push(t);else{fresh.push(t);seen.add(key);}});
    var examples=duplicates.slice(0,5).map(t=>`<div class="action-item warn"><span class="a-dot"></span><div><b>${esc(t.desc||t.cat||'Transaction')} · ${money2(t.amount)}</b><span>${fmtDate(t.date)} · ${esc(t.type)} · ${esc(t.cat||'Other')}</span></div></div>`).join('');
    openModal('Review CSV import','Nothing is added until you confirm.',
      `<div class="grid g-3" style="margin-bottom:16px">${stat('New','i-green','plus',fresh.length,'ready to import')}${stat('Possible duplicates','i-'+(duplicates.length?'rose':'green'),'warn',duplicates.length,duplicates.length?'skipped by default':'none found')}${stat('Invalid','i-'+(invalid?'gold':'green'),'info',invalid,invalid?'missing date or amount':'none found')}</div>
      ${duplicates.length?`<div class="info-box" style="margin-bottom:12px">${icon('info')}<div><b>Duplicate protection is on.</b> Matching date, type, description, category, amount and split details are skipped.</div></div><div class="action-list">${examples}</div><label class="toggle section-gap"><input id="csvIncludeDuplicates" type="checkbox"> Import possible duplicates anyway</label>`:'<div class="callout"><h4>Ready to import</h4><p>No matching transactions were found in this dashboard or earlier in the same CSV.</p></div>'}`,
      ()=>{var include=document.getElementById('csvIncludeDuplicates')&&document.getElementById('csvIncludeDuplicates').checked,chosen=fresh.concat(include?duplicates:[]);chosen.forEach(t=>S.tx.push(Object.assign({id:uid()},t)));save();closeModal();render();toast(chosen.length+' new transaction'+(chosen.length===1?'':'s')+' imported');},
      'Import '+fresh.length+' new');
  }catch(e){toast('Could not read this CSV. No data was changed.',true);}ev.target.value='';};r.onerror=()=>{toast('Could not read this CSV. No data was changed.',true);ev.target.value='';};r.readAsText(file);
}
importData=function(ev){
  var file=ev.target.files[0];if(!file)return;if(file.size>10*1024*1024){toast('Backup is too large (maximum 10 MB).',true);ev.target.value='';return;}var r=new FileReader();
  r.onload=()=>{try{
    const parsed=JSON.parse(r.result),wrapped=parsed&&typeof parsed==='object'&&Object.hasOwn(parsed,'app');
    if(wrapped&&parsed.app!==APP_ID)throw Error('This backup belongs to a different product');
    const d=wrapped?parsed.data:parsed;validatePlanData(d);
    const candidate=migrateV2(Object.assign(blankState(),d));validatePlanData(candidate);
    confirmAction('Restore this backup?','Current data will be replaced. A checkpoint of your current plan will be kept. Recurring entries can be synced after reviewing the restored plan.',()=>{
      if(!checkpointBeforeReplace())return;
      const previous=S;S=candidate;
      if(!save()){S=previous;render();toast('Restore was not saved. Your current plan is still displayed.',true);return;}
      go('overview');toast('Backup restored');
    },'Restore');
  }catch(e){toast('Backup not imported: '+e.message,true);}ev.target.value='';};r.onerror=()=>{toast('Could not read this backup. Your plan was not changed.',true);ev.target.value='';};r.readAsText(file);
};

      {id:uid(),name:'Second-half salary',date:makeDate(current,15),amount:1895,allocations:{bills:410,savings:445,debt:300,spending:600}}
    ];
    S.netWorthHistory=[];
    for(var h=11;h>=0;h--){var m=shiftYM(current,-h),step=11-h;S.netWorthHistory.push({month:m,assets:35000+step*575,liabilities:18500-step*310,value:16500+step*885});}
    if(!save()){S=previous;render();return;}closeModal();go('overview');toast('Sample plan loaded; checkpoint kept');

function startPlanner(){
  if(!persistence.locked)syncRecurring(true);
  buildSidebarFoot();
  if(persistence.fresh)updateSaveChip('Nothing saved yet',false);
  else if(!persistence.message)storageNotice('Saved plan loaded. Download a full backup regularly and before moving or replacing this file.','ok');
  buildNav();render();
}
if(navigator.locks&&window.isSecureContext){
  // A held browser lock prevents simultaneous read-check-write races between tabs.
  navigator.locks.request('finnest-writer:'+KEY,{ifAvailable:true},async lock=>{
    if(!lock){persistence.locked=true;storageNotice('This planner is already open in another tab. Saving is paused here. Close the other tab, then reopen this file to edit.');startPlanner();return;}
    writerReady=true;startPlanner();
    await new Promise(resolve=>window.addEventListener('pagehide',()=>{writerReady=false;resolve();},{once:true}));
  }).catch(()=>{persistence.locked=true;storageNotice('The browser could not secure this planner for editing. Download a backup and reopen the file in a supported browser.');startPlanner();});
  window.addEventListener('pageshow',e=>{if(e.persisted){persistence.locked=true;writerReady=false;storageNotice('This page was restored from browser history. Download any unsaved work, then reload to resume editing safely.');}});
}else startPlanner();

<script>
/* ============================================================
   Ultimate Personal Finance Dashboard — hosted demo layer.

   Injected as a second script block after the app's own. The app is not
   wrapped in an IIFE, so everything it defines is global and reachable
   from here: upsert, loadDemo, confirmAction, exportData, render, S.

   Nothing here is in the buyer file. build-demo.mjs derives the demo
   from the shipped HTML and asserts the buyer file stays untouched.

   Every row the user adds — transaction, goal, debt, bill, subscription,
   asset, liability — goes through upsert(), which already tells an add
   (no matching id) from an edit. So the cap wraps that one function and
   counts only NEW transactions. Editing what is already there stays
   free, as does deleting: a demo that fights you is not a demo.
   ============================================================ */
(function () {
  var CAP = 40;
  /* the listing itself, not the shop front — one less click to the buy button */
  var BUY_URL = "https://www.etsy.com/listing/4515406663/ultimate-digital-personal-finance?ref=demo";
  var COUNT_KEY = "ufd.demo.logged";   /* kept out of S so backups stay clean */

  /* The first-run storage tip ("before entering your full budget, save one test
     entry and reopen this file") is advice for a buyer setting up their own
     offline copy. Here it costs ~340px of the first thing a visitor sees on a
     phone, to say something that does not apply to example data.

     Setting the product's own "seen" flag suppresses every later tip, but not
     the first one: `let S = load()` runs at module level in the app's script,
     which is before this one, so by now the notice is already in the DOM.
     Set the flag AND clear what is already there. Real storage alerts use a
     different tone and are left alone — they matter. */
  try { localStorage.setItem("ufd.storageTipSeen", "1"); } catch (e) {}
  (function () {
    var n = document.getElementById("storageNotice");
    if (n && n.className === "tip") n.remove();
  })();

  function logged() {
    try { var n = parseInt(localStorage.getItem(COUNT_KEY) || "0", 10);
          return isFinite(n) && n > 0 ? n : 0; } catch (e) { return 0; }
  }
  function setLogged(n) { try { localStorage.setItem(COUNT_KEY, String(n)); } catch (e) {} }
  function left() { return Math.max(0, CAP - logged()); }

  /* ---------------- first visit: fill it with the sample plan ----------------
     The product already builds a realistic twelve-month example in loadDemo(),
     behind a confirm dialog. Rather than duplicate that data here (and let the
     two drift apart), borrow it: stub the confirm for one call so the demo
     opens on a populated dashboard instead of an empty-state screen. */
  function seedIfEmpty() {
    var empty = true;
    try { empty = !localStorage.getItem("ufd.demo"); } catch (e) {}
    if (!empty) return;
    if (typeof loadDemo !== "function" || typeof confirmAction !== "function") return;
    var realConfirm = confirmAction;
    try {
      confirmAction = function (t, m, onYes) { if (typeof onYes === "function") onYes(); };
      loadDemo();
    } catch (e) {
    } finally {
      confirmAction = realConfirm;
    }
  }

  /* ---------------- the cap ---------------- */
  var realUpsert = upsert;
  upsert = function (key, obj) {
    var isNewTx = false;
    try {
      isNewTx = key === "tx" && !S[key].some(function (x) { return x.id === obj.id; });
    } catch (e) {}

    if (isNewTx && left() <= 0) {
      if (typeof closeModal === "function") closeModal();
      setTimeout(capReached, 60);
      return;
    }

    var before = 0;
    try { before = S[key].length; } catch (e) {}
    var out = realUpsert.apply(this, arguments);
    var after = before;
    try { after = S[key].length; } catch (e) {}

    /* count it only if a row actually landed — upsert refuses invalid entries */
    if (isNewTx && after > before) {
      setLogged(logged() + 1);
      paintBar();
      if (left() === 0) setTimeout(capReached, 900);
    }
    return out;
  };

  /* ---------------- what a visitor sees at the cap ---------------- */
  function capReached() {
    if (typeof openModal !== "function") return;
    openModal(
      "That is all " + CAP + " transactions the demo holds",
      "Your work is not lost — take it with you.",
      '<p style="margin:0 0 12px;line-height:1.6">You have logged ' + CAP + " transactions, "
        + "enough to see how this dashboard handles a real month.</p>"
      + '<p style="margin:0 0 12px;line-height:1.6">Download your backup now and the full '
        + "dashboard opens it exactly as it stands — every transaction, bill, goal, debt and "
        + "subscription still in place. The full version has no limit and no subscription.</p>"
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">'
      + '<button type="button" class="btn ghost" id="demoExport">Download my backup</button>'
      + '<button type="button" class="btn ghost" id="demoReset">Reset the demo</button>'
      + "</div>",
      function () { window.open(BUY_URL, "_blank", "noopener"); },
      "Get the full dashboard"
    );
    setTimeout(function () {
      var ex = document.getElementById("demoExport");
      if (ex) ex.addEventListener("click", function () {
        if (typeof exportData === "function") exportData();
      });
      var rs = document.getElementById("demoReset");
      if (rs) rs.addEventListener("click", function () {
        try { localStorage.removeItem("ufd.demo"); localStorage.removeItem(COUNT_KEY); } catch (e) {}
        location.reload();
      });
    }, 40);
  }

  /* ---------------- the banner ---------------- */
  function buildBar() {
    if (document.getElementById("demoBar")) return document.getElementById("demoBar");
    var bar = document.createElement("div");
    bar.id = "demoBar";
    bar.innerHTML =
      '<span class="db-note db-long">Free demo · example data, and nothing leaves your browser</span>'
      + '<span class="db-note db-short">Free demo</span>'
      + '<span class="db-count" id="demoCount"></span>'
      + '<a class="db-buy" id="demoBuy" href="' + BUY_URL + '" target="_blank" rel="noopener">Get the full dashboard</a>'
      + '<button type="button" class="db-reset" id="demoResetTop">reset</button>';
    document.body.insertBefore(bar, document.body.firstChild);
    document.getElementById("demoResetTop").addEventListener("click", function () {
      try { localStorage.removeItem("ufd.demo"); localStorage.removeItem(COUNT_KEY); } catch (e) {}
      location.reload();
    });
    return bar;
  }

  function paintBar() {
    var bar = buildBar();
    var c = document.getElementById("demoCount");
    if (c) {
      var n = left();
      c.textContent = n > 0
        ? logged() + " of " + CAP + " transactions logged"
        : "demo full — " + CAP + " of " + CAP + " logged";
      c.className = "db-count" + (n <= 5 ? " low" : "");
    }
    /* the sidebar is fixed below a 66px topbar on narrow screens, so it has to
       be pushed down by however tall the banner actually renders */
    var h = bar.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--demo-bar-h", Math.round(h) + "px");
  }

  /* repaint after any render, so the count never goes stale */
  if (typeof render === "function") {
    var realRender = render;
    render = function () { var r = realRender.apply(this, arguments); paintBar(); return r; };
  }

  /* ---------------- styling ---------------- */
  var css = ""
    + "#demoBar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;"
    +   "padding:10px 20px;background:#F5EACC;color:#3B3226;"
    +   "border-bottom:1px solid #D9C29A;font-size:14px;font-weight:600;"
    +   "font-family:inherit;position:relative;z-index:60}"
    + "#demoBar .db-note{flex:1 1 auto;min-width:0}"
    + "#demoBar .db-count{padding:3px 11px;border-radius:999px;background:#FFFDF8;"
    +   "border:1px solid #D9C29A;font-variant-numeric:tabular-nums;white-space:nowrap}"
    + "#demoBar .db-count.low{background:#F3E3E7;border-color:#C98A9A}"
    + "#demoBar .db-buy{padding:5px 14px;border-radius:999px;background:#355B46;color:#FCFBF6;"
    +   "text-decoration:none;white-space:nowrap}"
    + "#demoBar .db-buy:hover{background:#2A4838}"
    + "#demoBar .db-reset{background:none;border:0;color:#6A6459;font:inherit;"
    +   "text-decoration:underline;cursor:pointer;padding:0}"
    + "#demoBar .db-short{display:none}"
    + "@media(max-width:900px){"
    +   ".sidebar{top:calc(66px + var(--demo-bar-h,0px)) !important;"
    +   "height:calc(100dvh - 66px - var(--demo-bar-h,0px)) !important}"
    +   "#demoBar{font-size:13px;padding:8px 12px;gap:8px}}"
    + "@media(max-width:640px){"
    +   "#demoBar .db-long{display:none}"
    +   "#demoBar .db-short{display:inline;flex:0 0 auto;font-weight:700}"
    +   "#demoBar{font-size:12px;padding:7px 10px;gap:7px;flex-wrap:nowrap}"
    +   "#demoBar .db-count{padding:2px 8px;font-size:11px}"
    +   "#demoBar .db-buy{padding:4px 10px;font-size:11px}"
    +   "#demoBar .db-reset{display:none}}";
  var st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);

  /* ---------------- go ----------------
     The app acquires a Web Lock before it sets writerReady and calls
     startPlanner(); until then persistPlan() refuses to write. window.load
     fires before that resolves, so seeding there made loadDemo() build the
     sample plan, fail to save it, and correctly roll itself back — leaving an
     empty dashboard. Wait for the app to actually be ready to write. */
  function whenWritable(cb) {
    var tries = 0;
    (function poll() {
      var ready = false;
      try { ready = typeof writerReady !== "undefined" && writerReady === true; } catch (e) {}
      if (ready) { cb(); return; }
      if (++tries > 200) { cb(); return; }   /* ~12s, then try anyway */
      setTimeout(poll, 60);
    })();
  }

  function start() {
    paintBar();                 /* banner first, so the page never looks bare */
    whenWritable(function () {
      seedIfEmpty();
      paintBar();
    });
  }
  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();

</script>
