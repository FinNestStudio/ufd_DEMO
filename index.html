  state.milestoneLog.forEach(function(m){ logged[m.key] = m; });
  var added = false;
  out.forEach(function(m){
    if(m.reached){
      if(!logged[m.key]){
        /* date it from the record that earned it, not from the moment the
           app happened to notice. Falls back to today when the evidence
           is not itself a date. */
        var when = /^\d{4}-\d{2}-\d{2}$/.test(m.evidence) ? m.evidence
                 : (/^\d{4}-\d{2}$/.test(m.evidence) ? m.evidence + "-01" : fmtISO(today));
        state.milestoneLog.push({key:m.key, earnedAt:when, evidence:m.evidence});
        logged[m.key] = state.milestoneLog[state.milestoneLog.length-1];
        added = true;
      }
      m.earnedAt = logged[m.key].earnedAt;
      m.evidence = logged[m.key].evidence || m.evidence;
    } else if(logged[m.key]){
      /* Reached once, reached still. The underlying records changed, but the
         achievement was real when it happened, so the evidence stands. */
      m.reached = true;
      m.earnedAt = logged[m.key].earnedAt;
      m.evidence = logged[m.key].evidence;
      m.historic = true;
    }
  });
  if(added) save();
  return out;
}
function coveredPeriods(){
  /* pay periods that have fully finished, where nothing was left unpaid */
  var covered = [], eligible = false;
  var win = currentWindow();
  for(var i=1;i<=12;i++){
    var w = currentWindow(addDays(win.start, -1));
    win = w;
    var occ = state.billOccs.filter(function(o){
      var d = parseDate(o.dueDate).getTime();
      return !o.skipped && d >= w.start.getTime() && d <= w.end.getTime();
    });
    if(!occ.length) continue;
    eligible = true;
    if(occ.every(function(o){ return o.paid; })) covered.push(fmtISO(w.start));
  }
  return {covered:covered, eligible:eligible};
}

/* ============================================================
   Money formatting
   ============================================================ */
/* how the chosen currency is written: its symbol, before or after, and decimals */
function currencyStyle(){
  var code = state.settings.currencyCode, c = null;
  for(var i=0;i<CURRENCIES.length;i++){ if(CURRENCIES[i].code === code){ c = CURRENCIES[i]; break; } }
  return {sym: state.settings.currency || "$", after: !!(c && c.after), gap: !!(c && (c.after || c.space)),
          decimals: c && c.decimals === 0 ? 0 : 2};
}
/* whole: drop ".00" from a round amount, as the short form does */
function moneyDigits(abs, whole, st){
  return (whole && abs % 1 === 0) || st.decimals === 0
    ? Math.round(abs).toLocaleString('en-US')
    : abs.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function withCurrency(str, st){
  st = st || currencyStyle();
  return st.after ? str + " " + st.sym : st.sym + (st.gap ? " " : "") + str;
}
function money(n){
  var st = currencyStyle(), v = round2(num(n));
  return (v < 0 ? "−" : "") + withCurrency(moneyDigits(Math.abs(v), false, st), st);
}
function moneyShort(n){
  var st = currencyStyle(), v = round2(num(n));
  return (v < 0 ? "−" : "") + withCurrency(moneyDigits(Math.abs(v), true, st), st);
}
function shortDateLabel(dt){ return MONTH_ABBR[dt.getMonth()] + " " + dt.getDate(); }
function longDateLabel(dt){
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()]
    + ", " + MONTH_NAMES[dt.getMonth()] + " " + dt.getDate();
}
function relDay(dateStr){
  var d = parseDate(dateStr), t = startOfToday();
  var n = dayDiff(t,d);
  if(n === 0) return "today";
  if(n === 1) return "tomorrow";
  if(n === -1) return "yesterday";
  if(n < 0) return Math.abs(n) + " days ago";
  return "in " + n + " days";
}

/* ---------------- usuals: learned from this device's own spending ----------------
   Plain counting over the last 90 days, recent weeks weighted a little higher.
   Nothing is sent anywhere, and nothing is ever saved without a tap. */
function usualSpends(){
  var since = fmtISO(addDays(startOfToday(), -90));
  return state.transactions.filter(function(t){
    return t.amount > 0 && t.date >= since && !t.billOccId && !t.cardPaymentFor && !t.recurringSourceId
      && !t.refundOf && !(t.splits && t.splits.length);
  });
}
function usualCat(id){ return state.categories.filter(function(c){ return c.id === id; })[0] || null; }
function usualWeight(t){ return 1 + Math.max(0, 30 - dayDiff(parseDate(t.date), startOfToday())) / 30; }
/* the category chosen at least twice, and most of the time, for this exact amount */
function predictCategory(amount){
  var key = round2(num(amount)).toFixed(2), by = {}, total = 0;
  usualSpends().forEach(function(t){

/* Budget envelopes, distinct from the encrypted sync envelope. No bank transfers. */
function budgetEnvelopeById(id){return state.envelopes.find(function(e){return e.id===id;})||null;}
function budgetEnvelopeBalance(id,through){
 var e=budgetEnvelopeById(id);if(!e)return {balance:0,filled:0,spent:0,rolled:0};
 var date=safeDate(through||fmtISO(startOfToday())),month=date.slice(0,7),first=month+'-01';
 var prior=0,filled=0,spent=0;
 state.envelopeMoves.forEach(function(m){if(m.date>date)return;var delta=(m.envelopeId===id?m.amount:0)-(m.fromEnvelopeId===id?m.amount:0);if(m.date<first)prior+=delta;else filled+=delta;});
 state.transactions.forEach(function(t){if(t.date>date||t.date<e.startDate||t.cardPaymentFor)return;
  var occ=t.billOccId&&state.billOccs.find(function(o){return o.id===t.billOccId;});
  if(occ&&e.billIds.includes(occ.billId)){if(t.date<first)prior-=num(t.amount);else spent+=num(t.amount);return;}
  allocate(t).forEach(function(a){if(e.categoryIds.indexOf(a.categoryId)<0)return;if(t.date<first)prior-=num(a.amount);else spent+=num(a.amount);});
 });
 var rolled=e.rollover?prior:Math.min(0,prior);
 // Non-rollover envelopes reset positive leftovers at each month boundary.
 if(!e.rollover){var months={};state.envelopeMoves.forEach(function(m){if(m.date<first)months[m.date.slice(0,7)]=true;});state.transactions.forEach(function(t){if(t.date<first)months[t.date.slice(0,7)]=true;});var carry=0;
  Object.keys(months).sort().forEach(function(mk){var delta=0;state.envelopeMoves.forEach(function(m){if(m.date.slice(0,7)===mk)delta+=(m.envelopeId===id?m.amount:0)-(m.fromEnvelopeId===id?m.amount:0);});state.transactions.forEach(function(t){if(t.date.slice(0,7)!==mk||t.date<e.startDate||t.cardPaymentFor)return;var occ=t.billOccId&&state.billOccs.find(function(o){return o.id===t.billOccId;});if(occ&&e.billIds.includes(occ.billId)){delta-=num(t.amount);return;}allocate(t).forEach(function(a){if(e.categoryIds.indexOf(a.categoryId)>=0)delta-=num(a.amount);});});carry=Math.min(0,round2(carry+delta));});rolled=carry;}

function budgetEnvelopeReserve(checkedIds,horizon,includeGoals){
 var total=0,byAccount={},goalUsed={},billUsed={};
 state.envelopes.forEach(function(e){if(e.archived||e.kind!=='setAside')return;
  var acct=e.accountId||checkedIds[0];if(checkedIds.indexOf(acct)<0)return;
  var amount=Math.max(0,budgetEnvelopeBalance(e.id,fmtISO(startOfToday())).balance),overlap=0;
  if(e.goalId&&includeGoals!==false){var g=state.goals.find(function(g){return g.id===e.goalId&&g.protect;});if(g){var reserve=goalHoldings(g).reduce(function(n,h){return n+((h.accountId||checkedIds[0])===acct?Math.max(0,num(h.amount)):0);},0);var key=e.goalId+':'+acct;var applied=Math.min(amount,Math.max(0,reserve-(goalUsed[key]||0)));overlap+=applied;goalUsed[key]=(goalUsed[key]||0)+applied;}}
  state.billOccs.forEach(function(o){if(e.billIds.indexOf(o.billId)<0||o.paid||o.skipped||parseDate(o.dueDate)>horizon)return;var b=billById(o.billId);if(!b||(b.accountId||checkedIds[0])!==acct)return;var take=Math.min(Math.max(0,amount-overlap),Math.max(0,num(o.amount)-(billUsed[o.id]||0)));overlap+=take;billUsed[o.id]=(billUsed[o.id]||0)+take;});
  var hold=Math.max(0,round2(amount-overlap));total+=hold;byAccount[acct]=(byAccount[acct]||0)+hold;

}
function budgetEnvelopeMove(from,to,amount,date,note){
 var a=plannerMoney(amount),f=budgetEnvelopeById(from),t=to?budgetEnvelopeById(to):null;
 if(!f||f.archived||from===to||(to&&(!t||t.archived))||a<=0)throw Error('Choose two different active envelopes and a positive amount.');
 if(a>Math.max(0,budgetEnvelopeBalance(from,date).balance))throw Error('There is not that much available in the source envelope.');

function budgetEnvelopeFill(allocations,total,date,incomeId){

 if(incomeId){var inc=state.income.find(function(i){return i.id===incomeId&&i.confirmed;});var used=state.envelopeMoves.filter(function(m){return m.incomeId===incomeId;}).reduce(function(n,m){return n+m.amount;},0);if(!inc||sum>Math.max(0,num(inc.amount)-used)+.001)throw Error('This income has already been assigned. Choose unassigned money instead.');}

}

/* Challenges record an explicit choice. A colored tile alone moves no money. */
function makeChallenge(type,name,options){

 if(type==='hundred')for(var i=1;i<=100;i++)amounts.push(i);
 else if(type==='weekly'||type==='reverse'){for(var j=1;j<=52;j++)amounts.push(round2(j*base));if(type==='reverse')amounts.reverse();}
 else if(type==='penny')for(var k=1;k<=365;k++)amounts.push(round2(k*.01));
 else if(type==='roundup')for(var r=1;r<=365;r++)amounts.push(base);

function challengeComplete(id,tileId,options){

  el.innerHTML = '<span>' + escapeHTML(text) + '</span>' + (action ? '<button type="button" class="btn">' + escapeHTML(action.label) + '</button>' : '');

    + '<header><h2 id="dlgTitle">' + escapeHTML(title) + '</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>'
    + '<div class="body">' + bodyHTML + '</div><footer>' + footHTML + '</footer></div></div>';

}
document.addEventListener("keydown", function(e){
  var dlg = document.querySelector(".dialog"); if(!dlg) return;
  if(e.key === "Escape"){ e.preventDefault(); closeDialog(); return; }
  if(e.key !== "Tab") return;
  var f = dlg.querySelectorAll("button,input,select,textarea,[tabindex]:not([tabindex='-1'])");
  if(!f.length) return;
  var a = f[0], z = f[f.length - 1];
  if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
});

function spendOnDay(iso){
  return round2(state.transactions.reduce(function(n, t){ return t.date === iso && !t.billOccId && !t.cardPaymentFor ? n + Math.max(0, num(t.amount)) : n; }, 0));
}
/* A tracked card's charges are already spending; its bill only settles them. */
function isTrackedCardBillOccurrence(o){
  var b = o && billById(o.billId);
  return !!(b && b.debtId && state.debts.some(function(d){
    return d.id === b.debtId && d.activeCard && d.trackCharges && d.accountId;
  }));
}
function tick(done){ return '<span class="tick' + (done ? ' on' : '') + '" aria-hidden="true">' + (done ? '✓' : '') + '</span>'; }

/* three things worth doing today; any one of them counts */
function smallWinsHTML(c){
  var iso = fmtISO(startOfToday());
  var age = c.checkedAt ? dayDiff(parseDate(stampDay(c.checkedAt.at)), startOfToday()) : null;
  var overdue = state.billOccs.filter(function(o){ return !o.paid && !o.skipped && o.dueDate < iso; });
  var logged = spendOnDay(iso) > 0 || state.dayCloses.indexOf(iso) >= 0;
  var items = [
    {done:age !== null && age < 7, t:"Check your balance", s:age === null ? "Copy it from your banking app." : age === 0 ? "Checked today." : "Last checked " + (age === 1 ? "yesterday." : age + " days ago."), act:'data-act="money-check"', b:"Update"},
    {done:!overdue.length, t:"Tick off bills that went out", s:overdue.length ? overdue.length + " waiting, starting with " + overdue[0].name + "." : "Nothing waiting.", act:'data-go="repeats"', b:"Open"},
    {done:logged, t:"Write down today’s spending", s:logged ? "Done for today." : "Even a coffee keeps the number honest.", act:'data-act="' + (logged ? "add-spend" : "no-spend") + '"', b:logged ? "Add more" : "Nothing today"}
  ];
  var n = items.filter(function(x){ return x.done; }).length;
  return '<div class="card-head"><h2 id="winsTitle">Small wins</h2><span class="muted" style="font-size:13px">' + n + ' of 3</span></div>'
    + '<ul class="wins">' + items.map(function(x){
        return '<li' + (x.done ? ' class="done"' : '') + '>' + tick(x.done) + '<div><div class="t">' + escapeHTML(x.t) + '</div><div class="s">' + escapeHTML(x.s) + '</div></div>'
          + (x.done && x.b !== "Add more" ? '' : '<button type="button" class="btn ghost sm" ' + x.act + '>' + x.b + '</button>') + '</li>';
      }).join("") + '</ul>'
    + '<p class="wins-note">' + (n === 3 ? "All three. That’s a good day." : n === 0 ? "Any one of these counts." : n + " down. That counts.") + '</p>';
}
ACTIONS["no-spend"] = function(){
  var iso = fmtISO(startOfToday());
  if(state.dayCloses.indexOf(iso) >= 0) return;
  pushUndo("No-spend day"); state.dayCloses.push(iso); commit("Nothing spent today. Noted.");
};

/* every day this month, coloured by how much went out; tap a day to see it */
function everyDayHTML(){
  var now = startOfToday(), y = now.getFullYear(), m = now.getMonth(), dim = daysInMonth(y, m), per = [], quiet = 0, sofar = 0;
  for(var d = 1; d <= dim; d++) per.push(spendOnDay(fmtISO(new Date(y, m, d, 12))));
  var max = Math.max.apply(null, per.concat([1]));
  var cells = per.map(function(v, i){
    var day = i + 1, future = day > now.getDate(), today = day === now.getDate(), iso = fmtISO(new Date(y, m, day, 12));
    var level = future ? "" : v > 0 ? Math.max(1, Math.ceil(v / max * 4)) : 0;
    if(!future){ sofar += v; if(!v && !today) quiet++; }
    return '<button type="button" class="dayc' + (today ? ' today' : '') + (future ? ' future' : '') + '" data-level="' + level + '" data-act="day" data-iso="' + iso + '"' + (future ? ' disabled' : '')
      + ' aria-label="' + escapeHTML(MONTH_ABBR[m] + " " + day + (future ? "" : ": " + (v ? money(v) : "nothing spent"))) + '"><span>' + day + '</span></button>';
  }).join("");
  var avg = safeDiv(sofar, now.getDate());
  return '<div class="card-head"><h2 id="daysTitle">Every day this month</h2><span class="muted" style="font-size:13px">' + escapeHTML(moneyShort(round2(avg))) + ' a day so far</span></div>'
    + '<div class="days" style="--first:' + ((new Date(y, m, 1).getDay() + 6) % 7) + '">' + ["M","T","W","T","F","S","S"].map(function(x){ return '<b aria-hidden="true">' + x + '</b>'; }).join("") + cells + '</div>'
    + '<div class="days-foot"><span class="scale" aria-hidden="true"><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i></span>'
    + '<span>🌿 ' + quiet + (quiet === 1 ? ' day' : ' days') + ' with nothing spent</span></div>';
}
/* where the money went: a donut by category, bills as one slice */
function donutHTML(){
  var t = startOfToday(), win = monthWindow(t.getFullYear(), t.getMonth()), by = spendByCategory(win);
  var billsPaid = round2(state.transactions.reduce(function(n, x){ return x.billOccId && inWindow(x.date, win) && !isTrackedCardBillOccurrence(occById(x.billOccId)) ? n + num(x.amount) : n; }, 0))
    + round2(state.billOccs.reduce(function(n, o){ return o.paid && !o.paidTxnId && inWindow(o.dueDate, win) && !isTrackedCardBillOccurrence(o) ? n + num(o.amount) : n; }, 0));
  var slices = state.categories.map(function(c){ return {name:c.name, emoji:c.emoji, v:round2(by[c.id] || 0), color:safeColor(c.color, "#7A8896")}; })
    .concat([{name:"No category", emoji:"❔", v:round2(by.__none || 0), color:"#A9AFB8"}, {name:"Bills", emoji:"🧾", v:round2(billsPaid), color:"var(--herobg)"}])
    .filter(function(s){ return s.v > 0; }).sort(function(a, b){ return b.v - a.v; });
  var total = round2(slices.reduce(function(n, s){ return n + s.v; }, 0));
  var head = '<div class="card-head"><h2 id="donutTitle">Where the money went</h2><button type="button" class="link" data-go="reviews">Month review</button></div>';
  if(!total) return head + '<p class="empty">Nothing out yet this month.</p>';
  var R = 52, C = 2 * Math.PI * R, off = 0;
  var arcs = slices.map(function(s){
    var len = s.v / total * C, a = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="22" stroke-dasharray="' + Math.max(0, len - 1.5).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"><title>' + escapeHTML(s.name + ": " + money(s.v)) + '</title></circle>';
    off += len; return a;
  }).join("");
  return head + '<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="' + escapeHTML("This month: " + slices.slice(0, 4).map(function(s){ return s.name + " " + money(s.v); }).join(", ")) + '">' + arcs
    + '<text x="70" y="66" text-anchor="middle" class="d-big">' + escapeHTML(moneyShort(Math.round(total))) + '</text><text x="70" y="84" text-anchor="middle" class="d-small">this month</text></svg>'
    + '<ul class="legend-list">' + slices.slice(0, 5).map(function(s){
        return '<li><i style="background:' + s.color + '"></i><span>' + escapeHTML(s.emoji + " " + s.name) + '</span><b class="num">' + Math.round(s.v / total * 100) + '%</b></li>'; }).join("") + '</ul></div>';
}

/* run to payday: one dot per day of this pay period */
function runHTML(c){
  var head = '<div class="card-head"><h2 id="runTitle">Run to payday</h2>' + (c.ok ? '<span class="muted" style="font-size:13px">' + c.days + (c.days === 1 ? ' day' : ' days') + ' left</span>' : '') + '</div>';
  if(!c.ok) return head + '<p class="empty">Add a balance and a payday and this fills in.</p>';
  var start = c.h.win.start, total = Math.max(1, Math.min(45, dayDiff(start, c.payday))), today = dayDiff(start, startOfToday()), dots = "";
  for(var i = 0; i < total; i++) dots += '<i class="run' + (i < today ? ' past' : '') + (i === today ? ' now' : '') + '"></i>';
  dots += '<i class="run pay" title="payday"></i>';
  return head + '<div class="runs" role="img" aria-label="' + escapeHTML(c.days + " days until payday on " + shortDateLabel(c.payday)) + '">' + dots + '</div>'
    + '<dl class="facts"><div><dt>Left to last</dt><dd class="num">' + escapeHTML(moneyShort(Math.max(0, c.available))) + '</dd></div><div><dt>Each day</dt><dd class="num">' + escapeHTML(moneyShort(c.dailyGuide)) + '</dd></div></dl>';
}

/* this week: spent, bills, quiet days, the biggest one */
function weekHTML(){
  /* the last seven days, so Monday morning isn't an empty card */
  var now = startOfToday(), start = addDays(now, -6), spent = 0, bills = 0, quiet = 0, big = null;
  for(var i = 0; i < 7; i++){
    var day = addDays(start, i), iso = fmtISO(day), v = spendOnDay(iso); spent += v;
    if(day < now && !v) quiet++;
    state.transactions.forEach(function(t){
      if(t.date !== iso) return;
      if(t.billOccId) bills += num(t.amount);
      else if(!t.cardPaymentFor && (!big || num(t.amount) > num(big.amount))) big = t;
    });
  }
  return '<div class="card-head"><h2 id="weekTitle">Last 7 days</h2><span class="muted" style="font-size:13px">' + escapeHTML(shortDateLabel(start) + " – " + shortDateLabel(addDays(start, 6))) + '</span></div>'
    + '<dl class="facts rows"><div><dt>Spent</dt><dd class="num">' + escapeHTML(money(round2(spent))) + '</dd></div><div><dt>Bills paid</dt><dd class="num">' + escapeHTML(money(round2(bills))) + '</dd></div>'
    + '<div><dt>Days with nothing spent</dt><dd class="num">' + quiet + '</dd></div>'
    + (big ? '<div><dt>Biggest · ' + escapeHTML(big.note || (categoryById(big.categoryId) || {}).name || "purchase") + '</dt><dd class="num">' + escapeHTML(money(big.amount)) + '</dd></div>' : '') + '</dl>';
}

/* milestones: never a streak that breaks, only things you've reached */
function milestonesHTML(){
  var all = deriveMilestones();
  var reached = all.filter(function(m){ return m.reached; }), next = all.filter(function(m){ return !m.reached && !m.unknown; }).slice(0, 3);
  return '<div class="card-head"><h2 id="msTitle">Milestones</h2><button type="button" class="link" data-act="milestones">' + reached.length + ' of ' + all.length + ' · see all</button></div>'
    + (reached.length ? '<div class="badges">' + reached.slice(-6).map(function(m){ return '<span class="badge" title="' + escapeHTML(m.name) + '">🏅 <span>' + escapeHTML(m.name) + '</span></span>'; }).join("") + '</div>' : '')
    + (next.length ? '<ul class="next-ms">' + next.map(function(m){ return '<li><span>' + escapeHTML(m.name) + '</span><small>' + escapeHTML(m.progress || "not yet") + '</small></li>'; }).join("") + '</ul>' : '<p class="empty">Every one reached. 🎉</p>');
}
/* a newly reached milestone gets one small celebration, once */
function celebrateNewMilestones(){
  var seen = Array.isArray(state.settings.v3Seen) ? state.settings.v3Seen : null;
  var reached = deriveMilestones().filter(function(m){ return m.reached; });
  var ids = reached.map(function(m){ return m.key; });
  if(seen === null){ state.settings.v3Seen = ids; return; }          /* first run: everything so far counts as seen */
  var fresh = reached.filter(function(m){ return seen.indexOf(m.key) < 0; });
  if(!fresh.length) return;
  state.settings.v3Seen = seen.concat(fresh.map(function(m){ return m.key; }));
  save();
  confetti();
  setTimeout(function(){ toast("🏅 Milestone: " + fresh[0].name + (fresh.length > 1 ? " (and " + (fresh.length - 1) + " more)" : "")); }, 350);
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  var colors = ["var(--accent)", "var(--good)", "var(--herototal)", "#F2B98C", "#F6C9D5", "#CFC4FF"];
  for(var i = 0; i < 36; i++){
    var p = document.createElement("i");
    p.style.left = (5 + Math.random() * 90) + "%"; p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.25) + "s"; p.style.transform = "rotate(" + Math.round(Math.random() * 360) + "deg)";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 1800);
}

/* Simple view: only the number, small wins and what's coming, for heavy days */
function simpleView(){ return !!state.settings.v3Simple; }
ACTIONS.simple = function(){ pushUndo("View changed"); state.settings.v3Simple = !simpleView(); commit(simpleView() ? "Simple view: just the essentials." : "Full view."); };


/* ============================================================
   SPENDING: this month's plan per category (a slider each) and
   every purchase in one list. Bills live in Repeats, not here.
   ============================================================ */
var spendView = null;      /* {y, m} of the month on screen */
var spendPayOffset = 0;    /* with envelopes per paycheck: 0 this pay, -1 the one before */
var spendQuery = "";
var EMOJIS = ["🛒","🍽️","☕","🚗","🚌","🎉","🏠","🔁","✨","👕","💊","🎁","🐾","📚","💡","✈️","🏋️","💄","🧒","🛠️"];

function viewedSpendMonth(){
  var t = startOfToday();
  if(!spendView) spendView = {y:t.getFullYear(), m:t.getMonth()};
  return spendView;
}
function monthLabel(v){ return MONTH_NAMES[v.m] + " " + v.y; }
function planTotal(){ return round2(state.categories.reduce(function(n, c){ return n + num(c.budget); }, 0)); }
/* Rollover starts when switched on, and each month's unused plan carries on. */
function carryFor(c, y, m){
  if(!c.v3Rollover || !(num(c.budget) > 0)) return 0;
  var start = c.v3RolloverStart;
  if(!/^\d{4}-(0[1-9]|1[0-2])-01$/.test(String(start || ""))){
    /* Older files did not record the switch-on date. Preserve the prior
       one-month carry, then save this anchor so future months accumulate. */
    var now = startOfToday(), prior = new Date(now.getFullYear(), now.getMonth() - 1, 1, 12);
    start = c.v3RolloverStart = fmtISO(prior);
    save();
  }
  var first = num(start.slice(0, 4)) * 12 + num(start.slice(5, 7)) - 1, target = y * 12 + m;
  if(first >= target) return 0;
  var spentByMonth = {};
  state.transactions.forEach(function(t){
    if(t.billOccId || t.cardPaymentFor || !/^\d{4}-\d{2}-\d{2}$/.test(String(t.date || ""))) return;
    var index = num(t.date.slice(0, 4)) * 12 + num(t.date.slice(5, 7)) - 1;
    if(index < first || index >= target) return;
    allocate(t).forEach(function(a){ if(a.categoryId === c.id) spentByMonth[index] = round2((spentByMonth[index] || 0) + num(a.amount)); });
  });
  var carry = 0, budget = num(c.budget);
  for(var month = first; month < target; month++) carry = round2(Math.max(0, carry + budget - (spentByMonth[month] || 0)));
  return carry;
}
function planFor(c, y, m){ return planByPay() ? monthlyPlan(c) : round2(num(c.budget) + carryFor(c, y, m)); }
/* the period on screen: a month, or payday to payday when envelopes are per paycheck */
function spendWindow(){ if(planByPay()) return windowForOffset(spendPayOffset); var v = viewedSpendMonth(); return monthWindow(v.y, v.m); }
function plannedMonth(y, m){ return round2(state.categories.reduce(function(n, c){ return n + planFor(c, y, m); }, 0)); }
function planMax(c, base, pay){ base = base === undefined ? num(c.budget) : base; var u = moneyUnit(); return Math.max((pay ? 250 : 500) * u, Math.ceil(Math.max(base * 2, 1) / (50 * u)) * 50 * u); }

RENDER.spending = function(){
  var v = viewedSpendMonth(), t = startOfToday(), pay = planByPay();
  var isNow = pay ? spendPayOffset === 0 : v.y === t.getFullYear() && v.m === t.getMonth();
  var win = spendWindow(), by = spendByCategory(win);
  var spent = round2(Object.keys(by).reduce(function(n, k){ return n + by[k]; }, 0));
  var carryOf = function(c){ return pay ? payCarry(c, win) : carryFor(c, v.y, v.m); };
  var planned = pay ? round2(state.categories.reduce(function(n, c){ return n + payPlanOf(c) + carryOf(c); }, 0)) : plannedMonth(v.y, v.m), left = round2(planned - spent);

  var nav = '<div class="monthnav"><button type="button" class="iconbtn" data-act="spend-month" data-dir="-1" aria-label="Previous ' + unit + '">‹</button><b>' + escapeHTML(pay ? payWindowLabel(win) : monthLabel(v)) + '</b>'
    + '<button type="button" class="iconbtn" data-act="spend-month" data-dir="1" aria-label="Next ' + unit + '"' + (isNow ? ' disabled' : '') + '>›</button></div>';
  var html = pageTop("Spending", "Everyday money", nav + '<button type="button" class="btn primary" data-act="add-spend">+ Add spending</button>');
  html += '<div class="strip">'
    + '<div class="card"><div class="k">Spent</div><div class="v" id="spSpent" data-v="' + spent + '">' + escapeHTML(moneyShort(spent)) + '</div><div class="s">' + (pay ? 'everyday spending ' + (isNow ? 'this pay' : 'that pay') : 'everyday spending in ' + escapeHTML(MONTH_NAMES[v.m])) + '</div></div>'
    + '<div class="card"><div class="k">Planned</div><div class="v" id="spPlanned">' + escapeHTML(moneyShort(planned)) + '</div><div class="s">' + (pay ? 'in ' + state.categories.length + ' envelopes, per paycheck' : 'across ' + state.categories.length + ' categories') + '</div></div>'
    + '<div class="card"><div class="k">' + (left < 0 ? 'Over plan' : 'Left in the plan') + '</div><div class="v ' + (left < 0 ? 'warn' : 'good') + '" id="spLeft">' + escapeHTML(moneyShort(Math.abs(left))) + '</div><div class="s">' + (pay ? (isNow ? escapeHTML(toPayday + (toPayday === 1 ? " day" : " days") + " to payday") : "pay finished") : isNow ? escapeHTML(daysInMonth(v.y, v.m) - t.getDate() + " days to go") : "month finished") + '</div></div>'
    + '</div>';
  html += '<div class="grid">'
    + '<section class="card span6" aria-labelledby="planTitle"><div class="card-head"><h2 id="planTitle">' + (pay ? 'Your envelopes' : 'Your plan') + '</h2><button type="button" class="link" data-act="cat-add">+ Category</button></div>'
    + planBySegHTML()
    + state.categories.map(function(c){ return planRowHTML(c, round2(by[c.id] || 0), carryOf(c)); }).join("")
    + (by.__none ? '<div class="plan-row"><div class="nm"><span aria-hidden="true">❔</span><span>No category</span></div><div class="am">' + escapeHTML(moneyShort(by.__none)) + '</div></div>' : '')
    + '<p class="hint" style="margin-top:12px">' + (pay ? 'Each envelope fills on payday. Drag one to change it. Your number on Today doesn’t change: envelopes are a guide for each kind of spending.' : 'Drag a plan to change it. Your number on Today doesn’t change: plans are a guide for each kind of spending.') + '</p></section>'
    + '<section class="card span6" aria-labelledby="txTitle"><div class="card-head"><h2 id="txTitle">Every purchase</h2></div>'
    + '<input class="input search" id="spSearch" type="search" placeholder="Search, like “coffee”, “12.50” or “#holiday”" aria-label="Search purchases" value="' + escapeHTML(spendQuery) + '">'
    + '<div id="txList">' + txListHTML(win) + '</div></section>'
    + '</div>';
  $("screen-spending").innerHTML = html;
  $("spSearch").addEventListener("input", function(){ spendQuery = this.value; txShow = 100; $("txList").innerHTML = txListHTML(spendWindow()); });
};
function planRowHTML(c, spent, carry){
  carry = carry || 0;
  var pay = planByPay(), base = pay ? payPlanOf(c) : num(c.budget);
  var plan = round2(base + carry), pct = plan > 0 ? Math.round(clamp(safeDiv(spent, plan) * 100, 0, 100)) : (spent > 0 ? 100 : 0);
  var over = plan > 0 && spent > plan;
  return '<div class="plan-row" data-cat-row="' + escapeHTML(c.id) + '" data-spent="' + spent + '" data-carry="' + carry + '">'
    + '<button type="button" class="nm link" style="color:var(--ink);font-size:15px" data-act="cat-edit" data-id="' + escapeHTML(c.id) + '"><span aria-hidden="true">' + escapeHTML(c.emoji) + '</span><span>' + escapeHTML(c.name) + '</span>'
    + (c.v3Rollover ? '<span class="tag" title="What’s left carries into the next ' + (pay ? 'pay' : 'month') + '">↻ rolls over</span>' : '') + '</button>'
    + '<div class="am"><span data-role="spent">' + escapeHTML(moneyShort(spent)) + '</span> <small>/ <span data-role="plan">' + escapeHTML(moneyShort(plan)) + '</span></small></div>'
    + '<div class="bar" aria-hidden="true"><span' + (over ? ' class="over"' : '') + ' style="width:' + pct + '%"></span></div>'
    + '<div class="ctl"><span>0</span><input type="range" min="0" max="' + planMax(c, base, pay) + '" step="' + 5 * moneyUnit() + '" value="' + base + '" data-plan="' + escapeHTML(c.id) + '" aria-label="' + (pay ? 'Envelope per paycheck for ' : 'Monthly plan for ') + escapeHTML(c.name) + '"><span class="left' + (over ? ' over' : '') + '" data-role="left">' + escapeHTML(planLeftText(plan, spent)) + '</span></div>'
    + (carry > 0 ? '<div class="carry">+' + escapeHTML(moneyShort(carry)) + ' carried over from last ' + (pay ? 'pay' : 'month') + '</div>' : '')
    + '</div>';
}
function planLeftText(plan, spent){
  if(!(plan > 0)) return spent > 0 ? "no plan yet" : "no plan";
  return spent > plan ? moneyShort(spent - plan) + " over" : moneyShort(plan - spent) + " left";
}
function txListHTML(win){
  var q = spendQuery.trim().toLowerCase();
  /* typing searches every month, newest first; empty shows the month you're on */
  var list = state.transactions.filter(function(t){ return q ? true : inWindow(t.date, win); })
    .filter(function(t){
      if(!q) return true;
      var c = categoryById(t.categoryId), tags = tagsOf(t);
      /* "#holiday" looks at tags only; plain words also find tags */
      if(q.charAt(0) === "#") return tags.indexOf(cleanTag(q)) >= 0;
      if(tags.some(function(x){ return x.indexOf(q) >= 0; })) return true;
      return (t.note || "").toLowerCase().indexOf(q) >= 0 || (c && c.name.toLowerCase().indexOf(q) >= 0) || String(t.amount).indexOf(q) >= 0 || money(t.amount).indexOf(q) >= 0;
    })
    .sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.seq || 0) - (a.seq || 0); });
  if(!list.length) return '<p class="empty">' + (q ? 'Nothing matches “' + escapeHTML(spendQuery.trim()) + '” in any month.' : planByPay() ? 'Nothing spent in this pay yet.' : 'Nothing spent this month yet.') + '</p>';
  var found = q ? '<p class="hint" style="margin:4px 0 8px">' + list.length + (list.length === 1 ? ' match' : ' matches') + ' across every month · ' + escapeHTML(money(round2(list.reduce(function(n, t){ return n + num(t.amount); }, 0)))) + ' in all</p>' : '';
  /* the first hundred rows, then more on request: years of history stay quick on an old phone */
  var more = list.length - txShow;
  list = list.slice(0, txShow);

/* ============================================================
   PAYCHECK ENVELOPES: plan everyday spending per pay, not per month.
   With "Per paycheck" on (settings.v3PlanBy === "pay", which needs a
   payday), each category is an envelope that fills on payday
   (c.v3PayPlan), and Spending, Today and the nudges look at payday
   to payday. The monthly plan (c.budget) is kept as the monthly
   equivalent, so switching back loses nothing, and the screens that
   think in months (forecast, safety net, reviews, the year) use it.
   ============================================================ */
function planByPay(){ return !!(state && state.settings && state.settings.v3PlanBy === "pay" && state.settings.payday); }
/* a category never given an envelope (say, added on a device still on an older version) starts
   from its monthly plan instead of reading as empty */
function payPlanOf(c){
  var v = c.v3PayPlan;
  if(v === undefined || v === null || v === "") return Math.round(num(c.budget) * 12 / paysPerYear());
  return num(v) > 0 ? round2(num(v)) : 0;
}
/* what a category plans for a month, in either mode */
function monthlyPlan(c){ return planByPay() ? round2(payPlanOf(c) * paysPerYear() / 12) : num(c.budget); }
/* an envelope amount, kept with its monthly equivalent so switching back to months makes sense */
function setPayPlan(c, amount){
  c.v3PayPlan = amount > 0 ? round2(amount) : 0;
  c.budget = round2(c.v3PayPlan * paysPerYear() / 12);
}
/* the first switch: each envelope starts from its monthly plan, in whole units */
function seedPayPlans(){
  state.categories.forEach(function(c){
    if(c.v3PayPlan === undefined || c.v3PayPlan === null) c.v3PayPlan = Math.round(num(c.budget) * 12 / paysPerYear());
  });
}
function payWindowLabel(win){ return shortDateLabel(win.start) + " – " + shortDateLabel(win.end); }

/* Carry-over per pay: from the pay it was switched on, each pay's unused envelope moves on. */
function payCarry(c, win){
  var plan = payPlanOf(c);
  if(!c.v3Rollover || !(plan > 0)) return 0;
  var start = c.v3PayRolloverStart;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(start || ""))){ start = c.v3PayRolloverStart = fmtISO(currentWindow().start); save(); }
  var periods = [], w = currentWindow(parseDate(start));
  for(var g = 0; g < 400 && w.start.getTime() < win.start.getTime(); g++){ periods.push(w); w = currentWindow(w.next); }
  if(!periods.length) return 0;
  var spent = periods.map(function(){ return 0; }), from = periods[0].start.getTime(), to = win.start.getTime();
  state.transactions.forEach(function(t){
    if(t.billOccId || t.cardPaymentFor || !/^\d{4}-\d{2}-\d{2}$/.test(String(t.date || ""))) return;
    var d = parseDate(t.date).getTime();
    if(d < from || d >= to) return;
    var i = 0;
    while(i < periods.length - 1 && d > periods[i].end.getTime()) i++;
    allocate(t).forEach(function(a){ if(a.categoryId === c.id) spent[i] = round2(spent[i] + num(a.amount)); });
  });
  var carry = 0;
  for(var k = 0; k < periods.length; k++) carry = round2(Math.max(0, carry + plan - spent[k]));
  return carry;
}

/* the plan period right now, for Today and the nudges */
function planWindowNow(){ if(planByPay()) return currentWindow(); var t = startOfToday(); return monthWindow(t.getFullYear(), t.getMonth()); }
function planOfNow(c){
  if(planByPay()) return round2(payPlanOf(c) + payCarry(c, currentWindow()));
  var t = startOfToday();
  return planFor(c, t.getFullYear(), t.getMonth());
}

/* ============================================================
   VIETNAMESE ĐỒNG (asked for by a buyer). Đồng has no cents and
   everyday amounts run to tens of thousands (a coffee is about
   45,000 ₫), so the currency carries a "unit": the planner's
   dollar-sized steps are multiplied by it. The +1 +5 +10 +20 keys
   become +10,000 … +200,000 ₫, sliders move in 50,000s, and a new
   planner's quick chips start in đồng. Boxes for a whole-number
   currency show 25000000, not 25000000.00, and Today's big number
   shrinks to fit.
   ============================================================ */
CURRENCIES.splice(CURRENCIES.length - 1, 0, {code:"VND", sym:"₫", after:true, decimals:0, unit:10000});
function currencyUnitOf(code){ var c = CURRENCIES.filter(function(x){ return x.code === code; })[0]; return c && c.unit || 1; }
function moneyUnit(){ return currencyUnitOf(state && state.settings && state.settings.currencyCode); }

/* amount boxes for a currency without cents: drop ".00" from what's filled in and from the hint */
function tidyWholeAmounts(root){
  if(!root || currencyStyle().decimals !== 0) return;
  Array.prototype.forEach.call(root.querySelectorAll("input.num"), function(i){
    if(/^-?\d+\.00$/.test(i.value)) i.value = i.value.slice(0, -3);
    if(i.getAttribute("placeholder") === "0.00") i.setAttribute("placeholder", "0");
  });
}
var currencyPlainDialog = openDialog;
openDialog = function(){ var r = currencyPlainDialog.apply(this, arguments); tidyWholeAmounts($("modalRoot")); return r; };
/* Today's big number shrinks to fit its column: 3,214,286 ₫ (or a large balance in any currency) at
   full size runs into the panel beside it */
function fitBigNumbers(root){
  if(!root) return;
  Array.prototype.forEach.call(root.querySelectorAll(".hero .big"), function(e){
    e.style.fontSize = "";
    if(!e.offsetParent || e.scrollWidth <= e.clientWidth + 1) return;
    var px = parseFloat(getComputedStyle(e).fontSize);
    e.style.fontSize = Math.max(36, Math.floor(px * e.clientWidth / e.scrollWidth)) + "px";
  });
}
var currencyPlainRender = renderScreen;
renderScreen = function(id){ var r = currencyPlainRender.apply(this, arguments); var el = $("screen-" + id); tidyWholeAmounts(el); fitBigNumbers(el); return r; };
var fitTimer = 0;
window.addEventListener("resize", function(){ clearTimeout(fitTimer); fitTimer = setTimeout(function(){ fitBigNumbers(document); }, 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitBigNumbers(document); });

/* a new planner in đồng: the starter chips (Coffee 4, Lunch 12, Bus 6) in đồng too */
var currencyPlainFinish = finishSetup;
finishSetup = function(){
  var u = setup ? currencyUnitOf(setup.currency) : 1;
  if(u > 1) state.quickChips.forEach(function(ch){ if(num(ch.amount) > 0 && num(ch.amount) < 100) ch.amount = round2(num(ch.amount) * u); });
  return currencyPlainFinish.apply(this, arguments);
};

  comfortApplyPlain();
  var html = document.documentElement;
  html.setAttribute("data-scheme", themeId() === "midnight" || themeId() === "noir" || darkWanted() ? "dark" : "light");
  html.setAttribute("data-numfont", numFontId());
  var t = state && state.settings && state.settings.v3Text;
  html.setAttribute("data-textsize", t === "large" || t === "larger" ? t : "normal");
};
if(window.matchMedia) try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if(state) applyTheme(); }); }catch(e){}
/* the font of the big money numbers; Elegant (Fraunces) is the Ultimate's own */
var NUM_FONTS = [["elegant","Elegant","NumElegantFN"], ["classic","Classic","DisplayFN"], ["modern","Modern","NumModernFN"], ["ledger","Ledger","NumLedgerFN"], ["friendly","Friendly","NumFriendlyFN"]];
function numFontId(){ var f = state && state.settings && state.settings.v3NumFont; return NUM_FONTS.some(function(x){ return x[0] === f; }) ? f : "elegant"; }
ACTIONS.numfont = function(el){
  pushUndo("Number style changed"); state.settings.v3NumFont = el.getAttribute("data-font");
  commit("Numbers now in the " + el.getAttribute("data-name") + " style.");
};
function numFontRow(){
  return setRow("Number style", "The font of the big money numbers. Pick the one you like looking at.",
    '<div class="numfonts" role="group" aria-label="Number style">' + NUM_FONTS.map(function(f){
      return '<button type="button" class="numfont-opt" data-act="numfont" data-font="' + f[0] + '" data-name="' + f[1] + '" aria-pressed="' + (numFontId() === f[0]) + '">'
        + '<span class="nf-sample" style="font-family:&quot;' + f[2] + '&quot;,&quot;CurrencyFN&quot;,system-ui" aria-hidden="true">' + escapeHTML(moneyShort(1234)) + '</span><span class="nf-name">' + f[1] + '</span></button>';
    }).join("") + '</div>');
}
function comfortRows(){
  var s = state.settings;
  var sel = function(id, opts, val){ return '<select class="select" id="' + id + '">' + opts.map(function(o){ return '<option value="' + o[0] + '"' + (val === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join("") + '</select>'; };
  return numFontRow() + setRow("Light or dark", "Every theme has a dark version. “Follow my device” switches with your phone or computer.", sel("setMode", [["auto","Follow my device"],["light","Always light"],["dark","Always dark"]], s.v3Mode || "auto"))
    + setRow("Text size", "Makes every screen easier to read.", sel("setText", [["normal","Normal"],["large","Large"],["larger","Larger"]], s.v3Text || "normal"));
}

/* ---------- one-tap buttons ---------- */

ACTIONS["chip-add"] = function(){ chipDialog(null); };
ACTIONS["chip-edit"] = function(el){ var ch = state.quickChips.filter(function(x){ return x.id === el.getAttribute("data-id"); })[0]; if(ch) chipDialog(ch); };
function chipDialog(ch){
  var isNew = !ch, cat = ch ? ch.categoryId : null;
  openDialog(isNew ? "A new one-tap button" : "Edit " + ch.label,
    '<div class="field"><label for="chLabel">Name</label><input class="input" id="chLabel" maxlength="20" value="' + escapeHTML(ch ? ch.label : "") + '" placeholder="Coffee"><div class="error" id="chpErr" role="alert"></div></div>'
    + '<div class="field"><label for="chEmoji">Emoji</label><input class="input" id="chEmoji" maxlength="4" value="' + escapeHTML(ch ? ch.emoji : "☕") + '" style="width:90px"></div>'
    + '<div class="field"><label for="chAmt">Amount</label><input class="input num" id="chAmt" inputmode="decimal" value="' + (ch ? num(ch.amount).toFixed(2) : "") + '" placeholder="0.00"></div>'
    + '<div class="field"><span style="font-weight:600;font-size:14px" id="chCatL">Category</span><div class="pick" role="group" aria-labelledby="chCatL">' + state.categories.map(function(c){
        return '<button type="button" data-ccat="' + escapeHTML(c.id) + '" aria-pressed="' + (c.id === cat) + '">' + escapeHTML(c.emoji + " " + c.name) + '</button>'; }).join("") + '</div></div>',
    (isNew ? '' : '<button type="button" class="btn ghost" id="chDel" style="margin-right:auto;color:var(--warnink)">Remove</button>')
    + '<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="chSaveBtn">Save</button>',
    function(dlg){
      dlg.querySelector(".pick").addEventListener("click", function(e){
        var b = e.target.closest("[data-ccat]"); if(!b) return; cat = b.getAttribute("data-ccat");
        Array.prototype.forEach.call(dlg.querySelectorAll("[data-ccat]"), function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      });
      $("chSaveBtn").addEventListener("click", function(){
        var label = $("chLabel").value.trim(), amt = parseAmount($("chAmt").value);
        if(!label){ $("chpErr").textContent = "Give it a name."; return; }
        if(amt === null || !(amt > 0)){ $("chpErr").textContent = "Type an amount above zero."; return; }
        pushUndo(isNew ? "Button added" : "Button changed");
        var emoji = safeGlyph($("chEmoji").value.trim(), "⭐");
        if(isNew) state.quickChips.push({id:uid(), label:label.slice(0, 20), emoji:emoji, amount:round2(amt), categoryId:cat, accountId:null});
        else { ch.label = label.slice(0, 20); ch.emoji = emoji; ch.amount = round2(amt); ch.categoryId = cat; }
        closeDialog(); commit("Saved.");
      });
      if(!isNew) $("chDel").addEventListener("click", function(){
        pushUndo("Button removed"); state.quickChips = state.quickChips.filter(function(x){ return x.id !== ch.id; }); closeDialog(); commit("Removed.");
      });
    });
}

/* ---------- a spreadsheet of everything ---------- */
ACTIONS["export-csv"] = function(){
  var rows = [];
  state.transactions.forEach(function(t){
    var c = categoryById(t.categoryId), a = accountById(t.accountId);
    rows.push([t.date, t.kind === "cardcharge" ? "Card charge" : t.billOccId ? "Bill" : "Spending", t.note || "", t.splits && t.splits.length > 1 ? "Split" : c ? c.name : "", a ? a.name : "", "Out", num(t.amount).toFixed(2)]);
  });
  state.income.forEach(function(x){
    if(!x.confirmed) return;
    var a = accountById(x.accountId);
    rows.push([x.date, "Money in", x.label || "", "", a ? a.name : "", "In", num(x.amount).toFixed(2)]);
  });
  state.transfers.forEach(function(t){
    var f = accountById(t.fromAccountId), to = accountById(t.toAccountId);
    rows.push([t.date, "Moved", (f ? f.name : "") + " to " + (to ? to.name : ""), "", "", "Moved", num(t.amount).toFixed(2)]);
  });
  rows.sort(function(a, b){ return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
  downloadFile("ultimate-finance-dashboard-" + fmtISO(startOfToday()) + ".csv", "text/csv", "﻿" + buildCsv(["Date", "Type", "Description", "Category", "Account", "Direction", "Amount (" + (state.settings.currencyCode || "") + ")"], rows));
  toast(rows.length + " rows in the file. It opens in Excel, Numbers or Google Sheets.");
};

/* ---------- the Settings screen gains all of this ---------- */
var moreSettingsPlain = RENDER.settings;
RENDER.settings = function(){
  moreSettingsPlain.apply(this, arguments);
  var host = $("screen-settings"), grid = host.querySelector(".grid"); if(!grid) return;
  /* the accounts card becomes a full manager */
  var old = Array.prototype.filter.call(grid.children, function(c){ var h = c.querySelector("h2"); return h && /Accounts that count/.test(h.textContent); })[0];
  if(old) old.innerHTML = accountsCardHTML();
  var theme = grid.children[0];
  if(theme) theme.insertAdjacentHTML("beforeend", comfortRows());
  var bring = Array.prototype.filter.call(grid.children, function(c){ var h = c.querySelector("h2"); return h && /Bring in and take out/.test(h.textContent); })[0];
  if(bring) bring.querySelector(".card-head").insertAdjacentHTML("afterend", setRow("Spreadsheet (CSV)", "Everything in and out, for Excel, Numbers or Google Sheets.", '<button type="button" class="btn ghost sm" data-act="export-csv">Download</button>'));
  var chips = document.createElement("section"); chips.className = "card span6"; chips.innerHTML = chipsCardHTML();
  /* one-tap buttons belong with your money, before the data tools */
  var dataCard = Array.prototype.filter.call(grid.children, function(c){ var h = c.querySelector("h2"); return h && /Your data/.test(h.textContent); })[0];
  if(dataCard) grid.insertBefore(chips, dataCard); else grid.appendChild(chips);
  var s = state.settings, change = function(id, fn){ var el = $(id); if(el) el.addEventListener("change", function(){ pushUndo("Setting changed"); fn(el.value); commit("Saved."); }); };
  change("setMode", function(v){ s.v3Mode = v === "light" || v === "dark" ? v : "auto"; });
  change("setText", function(v){ s.v3Text = v === "large" || v === "larger" ? v : "normal"; });
  Array.prototype.forEach.call(host.querySelectorAll("[data-include]"), function(box){
    if(box.__wired) return; box.__wired = true;
    box.addEventListener("change", function(){ var a = accountById(box.getAttribute("data-include")); if(!a) return; pushUndo("Account changed"); a.includeInSafe = box.checked; commit("Saved."); });
  });
};


/* ============================================================
   Everyday actions: add spending, one-tap chips, "Can I afford…?",
   and Check my money (update balances, start again from today).
   Each change can be undone from the toast.
   ============================================================ */
function spendingAccount(){
  var inc = includedAccounts();
  var last = accountById(state.settings.lastAccountId);
  return (last && !last.archived ? last : null) || inc[0] || state.accounts.filter(function(a){ return !a.archived; })[0] || null;
}
function incomeAccount(preferredId){
  var preferred = accountById(preferredId), last = spendingAccount();
  if(preferred && !preferred.archived && preferred.kind !== "card") return preferred;
  if(last && last.kind !== "card") return last;
  return includedAccounts()[0] || state.accounts.filter(function(a){ return !a.archived && a.kind !== "card"; })[0] || null;
}
function addExpense(amount, categoryId, note, date, accountId){
  pushUndo("Spending added");
  var acct = accountById(accountId);
  state.transactions.push(normTxn({amount:round2(amount), categoryId:categoryId || null, note:note || "", date:date || fmtISO(startOfToday()),
    accountId:accountId, kind:acct && acct.kind === "card" ? "cardcharge" : "expense"}, {next:nextSeq, defaultAccount:accountId}));
  state.settings.lastAccountId = accountId;
}

/* One Add dialog for both directions. Spending learns your usuals and guesses
   the category as you type; Money in logs pay, extra income, refunds and gifts. */
var IN_KINDS = [["pay","💶","Pay"],["extra","✨","Extra income"],["refund","↩️","Refund"],["gift","🎁","Gift"]];
ACTIONS["add-spend"] = function(el){ addDialog(el && el.getAttribute("data-mode") === "in" ? "in" : "out"); };
ACTIONS["add-in"] = function(){ addDialog("in"); };
function addDialog(mode){
  var acct = spendingAccount();
  if(!acct){ toast("Add an account in Settings first."); go("settings"); return; }
  var st = currencyStyle(), chosen = null, picked = false, kind = "extra";
  /* Spending can use a tracked card; money in needs a non-card account. */
  var accts = state.accounts.filter(function(a){ return !a.archived; });
  var inAccts = accts.filter(function(a){ return a.kind !== "card"; });
  if(mode === "in" && !inAccts.length){ toast("Add a non-card account in Settings before logging money in."); go("settings"); return; }
  var moneyField = function(id){ return '<div class="money-in">' + (st.after ? '' : '<span aria-hidden="true">' + escapeHTML(st.sym) + '</span>')
    + '<input class="input" id="' + id + '" inputmode="decimal" autocomplete="off" placeholder="0">' + (st.after ? '<span aria-hidden="true">' + escapeHTML(st.sym) + '</span>' : '') + '</div>'; };
  var usuals = usualAmounts(4);
  openDialog("Add",
    '<div class="seg" role="group" aria-label="Money out or in"><button type="button" data-mode="out" aria-pressed="' + (mode === "out") + '">− Spending</button><button type="button" data-mode="in" aria-pressed="' + (mode === "in") + '">+ Money in</button></div>'
    + '<div id="addOut"' + (mode === "out" ? '' : ' hidden') + '>'
      + '<div class="field"><label for="spAmount">How much</label>' + moneyField("spAmount") + '<div class="error" id="spErr" role="alert"></div></div>'
      + (usuals.length ? '<div class="field"><span style="font-weight:600;font-size:14px">Your usuals</span><div class="pick usuals">' + usuals.map(function(u){ var c = categoryById(u.categoryId);
          return '<button type="button" data-usual="' + u.amount.toFixed(2) + '" data-ucat="' + escapeHTML(u.categoryId || "") + '">' + escapeHTML((c ? c.emoji + " " : "") + moneyShort(u.amount)) + '</button>'; }).join("") + '</div></div>' : '')
      + '<div class="field"><span id="spCatLabel" style="font-weight:600;font-size:14px">What for <span class="hint" id="spGuess"></span></span><div class="pick" id="spCats" role="group" aria-labelledby="spCatLabel">'
        + state.categories.map(function(c){ return '<button type="button" data-cat="' + escapeHTML(c.id) + '" aria-pressed="false">' + escapeHTML(c.emoji + " " + c.name) + '</button>'; }).join("") + '</div></div>'
      + '<div class="field"><label for="spNote">Note (optional)</label><input class="input" id="spNote" maxlength="80" autocomplete="off"></div>'
    + '</div>'
    + '<div id="addIn"' + (mode === "in" ? '' : ' hidden') + '>'
      + '<div class="field"><label for="inAmount">How much came in</label>' + moneyField("inAmount") + '<div class="error" id="inErr" role="alert"></div></div>'
      + '<div class="field"><span style="font-weight:600;font-size:14px" id="inKindL">What kind</span><div class="pick" id="inKinds" role="group" aria-labelledby="inKindL">' + IN_KINDS.map(function(k){
          return '<button type="button" data-kind="' + k[0] + '" aria-pressed="' + (k[0] === kind) + '">' + k[1] + ' ' + k[2] + '</button>'; }).join("") + '</div></div>'
      + '<div class="field"><label for="inLabel">From (optional)</label><input class="input" id="inLabel" maxlength="40" placeholder="Freelance job, tax refund…" autocomplete="off"></div>'
    + '</div>'
    + '<div class="field"><label for="spDate">Date</label><input class="input" id="spDate" type="date" value="' + fmtISO(startOfToday()) + '"><div class="hint" id="spDateHint"></div></div>'
    + (accts.length > 1 ? '<div class="field"><label for="spAcct">Account</label><select class="select" id="spAcct">' + accts.map(function(a){
        return '<option value="' + escapeHTML(a.id) + '"' + (a.id === acct.id ? ' selected' : '') + '>' + escapeHTML(a.name) + '</option>'; }).join("") + '</select></div>' : ''),
    '<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="spSave">Add it</button>',
    function(dlg){
      var chosenAcct = {out:acct.id, in:(incomeAccount() || {}).id};
      var setMode = function(m){
        if(m === "in" && !inAccts.length){ toast("Add a non-card account in Settings before logging money in."); return; }
        var select = $("spAcct");
        if(select){
          var previous = accountById(select.value);
          if(previous && !previous.archived && (mode === "out" || previous.kind !== "card")) chosenAcct[mode] = previous.id;
          Array.prototype.forEach.call(select.options, function(opt){
            var a = accountById(opt.value), unavailable = m === "in" && a && a.kind === "card";
            opt.disabled = !!unavailable; opt.hidden = !!unavailable;
          });
          var allowed = m === "in" ? inAccts : accts;
          select.value = allowed.some(function(a){ return a.id === chosenAcct[m]; }) ? chosenAcct[m] : allowed[0].id;
        }
        mode = m; $("addOut").hidden = m !== "out"; $("addIn").hidden = m !== "in";
        Array.prototype.forEach.call(dlg.querySelectorAll("[data-mode]"), function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === m)); });
        var f = $(m === "out" ? "spAmount" : "inAmount"); if(f) f.focus();
      };
      var pickCat = function(id, byHand){
        chosen = id; if(byHand) picked = true;
        Array.prototype.forEach.call(dlg.querySelectorAll("[data-cat]"), function(x){ x.setAttribute("aria-pressed", String(x.getAttribute("data-cat") === id)); });
      };
      dlg.addEventListener("click", function(e){
        var m = e.target.closest("[data-mode]"); if(m){ setMode(m.getAttribute("data-mode")); return; }
        var c = e.target.closest("[data-cat]"); if(c){ var id = c.getAttribute("data-cat"); pickCat(chosen === id && picked ? null : id, true); /* tapping the guess confirms it */ $("spGuess").textContent = ""; return; }
        var u = e.target.closest("[data-usual]"); if(u){ $("spAmount").value = u.getAttribute("data-usual"); if(u.getAttribute("data-ucat")) pickCat(u.getAttribute("data-ucat"), true); $("spNote").focus(); return; }
        var k = e.target.closest("[data-kind]"); if(k){ kind = k.getAttribute("data-kind");
          Array.prototype.forEach.call(dlg.querySelectorAll("[data-kind]"), function(x){ x.setAttribute("aria-pressed", String(x === k)); }); }
      });
      /* guess the category from the amount, until one is picked by hand */
      $("spAmount").addEventListener("input", function(){
        if(picked) return;
        var guess = predictCategory(parseAmount(this.value));
        pickCat(guess, false);
        var c = guess && categoryById(guess);
        $("spGuess").textContent = c ? "· looks like " + c.name : "";
      });
      $("spDate").addEventListener("input", function(){
        $("spDateHint").textContent = mode === "in" && this.value > fmtISO(startOfToday()) ? "In the future: it counts once it arrives." : "";
      });
      var saveIt = function(){
        var date = safeDate($("spDate").value) || fmtISO(startOfToday()), acctId = $("spAcct") ? $("spAcct").value : (mode === "in" ? incomeAccount().id : acct.id);
        var chosenAccount = accountById(acctId);
        if(!chosenAccount || chosenAccount.archived || (mode === "in" && chosenAccount.kind === "card")){
          var fallback = mode === "in" ? inAccts[0] : accts[0];
          if(!fallback){ toast("Add an account in Settings first."); return; }
          acctId = fallback.id;
        }
        if(mode === "out"){
          var amt = parseAmount($("spAmount").value);
          if(amt === null || !isFinite(amt) || amt <= 0){ $("spErr").textContent = "Type an amount above zero, like 12.50."; $("spAmount").focus(); return; }
          addExpense(amt, chosen, $("spNote").value.trim(), date, acctId);
          closeDialog(); commit("Added " + money(amt) + ".");
        } else {
          var got = parseAmount($("inAmount").value);
          if(got === null || !isFinite(got) || got <= 0){ $("inErr").textContent = "Type the amount that came in."; $("inAmount").focus(); return; }
          var k = IN_KINDS.filter(function(x){ return x[0] === kind; })[0];
          pushUndo("Money in added");
          state.income.push(normIncome({label:$("inLabel").value.trim() || k[2], amount:round2(got), date:date, accountId:acctId,
            confirmed:date <= fmtISO(startOfToday()), kind:kind === "pay" ? "pay" : "other", v3Kind:kind,
            v3ForPayday:kind === "pay" && date <= fmtISO(startOfToday()) ? earlyPayFor(date) : null}, {next:nextSeq, defaultAccount:acctId}));   /* pay in a few days early is that payday's pay */
          closeDialog(); commit((date <= fmtISO(startOfToday()) ? "Added " : "Expected: ") + money(got) + " in.");
        }
      };
      $("spSave").addEventListener("click", saveIt);
      ["spAmount","inAmount"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if(e.key === "Enter") saveIt(); }); });
      setMode(mode);
    });
}

/* one-tap usuals on Today: the same purchase three times becomes a tile */
ACTIONS.usual = function(el){
  var acct = spendingAccount(); if(!acct) return;
  var amt = num(el.getAttribute("data-amount"));
  addExpense(amt, el.getAttribute("data-ucat") || null, el.getAttribute("data-note") || "", fmtISO(startOfToday()), acct.id);
  commit("Added " + money(amt) + ".");
};

/* move money between your own accounts: not spending, and not income */
ACTIONS.move = function(){
  var accts = state.accounts.filter(function(a){ return !a.archived && a.kind !== "card"; });
  if(accts.length < 2){ toast("Add a second account in Settings to move money between them."); return; }
  var opts = function(sel){ return accts.map(function(a, i){ return '<option value="' + escapeHTML(a.id) + '"' + (i === sel ? ' selected' : '') + '>' + escapeHTML(a.name) + '</option>'; }).join(""); };
  openDialog("Move money",
    '<div class="field"><label for="mvFrom">From</label><select class="select" id="mvFrom">' + opts(0) + '</select></div>'
    + '<div class="field"><label for="mvTo">To</label><select class="select" id="mvTo">' + opts(1) + '</select></div>'
    + '<div class="field"><label for="mvAmt">How much</label><input class="input num" id="mvAmt" inputmode="decimal" placeholder="0.00"><div class="error" id="mvErr" role="alert"></div></div>'
    + '<div class="field"><label for="mvDate">Date</label><input class="input" id="mvDate" type="date" value="' + fmtISO(startOfToday()) + '"></div>'
    + '<p class="hint">Moving money isn’t spending. Safe to spend only changes if it leaves or joins an account that counts.</p>',
    '<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="mvSave">Move it</button>',
    function(){
      $("mvSave").addEventListener("click", function(){
        var amt = parseAmount($("mvAmt").value), from = $("mvFrom").value, to = $("mvTo").value;
        if(from === to){ $("mvErr").textContent = "Pick two different accounts."; return; }
        if(amt === null || !isFinite(amt) || amt <= 0){ $("mvErr").textContent = "Type an amount above zero."; $("mvAmt").focus(); return; }
        pushUndo("Money moved");
        state.transfers.push(normTransfer({amount:round2(amt), fromAccountId:from, toAccountId:to, date:safeDate($("mvDate").value) || fmtISO(startOfToday())}, {next:nextSeq}));
        closeDialog(); commit("Moved " + money(amt) + " to " + accountById(to).name + ".");
      });
    });
};

ACTIONS.chip = function(el){
  var ch = state.quickChips.filter(function(x){ return x.id === el.getAttribute("data-id"); })[0];
  var acct = spendingAccount(); if(!ch || !acct) return;
  addExpense(ch.amount, ch.categoryId, ch.label, fmtISO(startOfToday()), ch.accountId || acct.id);
  commit("Added " + ch.label.toLowerCase() + ", " + money(ch.amount) + ".");
};

ACTIONS.afford = function(){
  var st = currencyStyle();
  openDialog("Can I afford it?",
    '<div class="field"><label for="afAmount">How much is it?</label><div class="money-in">' + (st.after ? '' : '<span aria-hidden="true">' + escapeHTML(st.sym) + '</span>')
      + '<input class="input" id="afAmount" inputmode="decimal" autocomplete="off" placeholder="0">' + (st.after ? '<span aria-hidden="true">' + escapeHTML(st.sym) + '</span>' : '') + '</div></div>'
    + '<div id="afOut" aria-live="polite" class="hint">Type an amount to see what it does to your number.</div>',
    '<button type="button" class="btn ghost" data-close>Done</button>',
    function(){
      $("afAmount").addEventListener("input", function(){
        var p = previewSpend(parseAmount(this.value));

/* reads the step; with check, says what's wrong instead of moving on */
function readSetup(check){
  var s = setup, err = function(t){ if(check){ $("suErr").textContent = t; } return !check; };
  if(s.step === 0){ s.name = $("suName").value.trim().slice(0, 30); s.currency = $("suCur").value; }
  if(s.step === 1){
    s.bank = $("suBank").value.trim(); s.savings = $("suSav").value.trim();
    if(s.bank && parseAmount(s.bank) === null) return err("Type the balance as a number, like 1250.00.");
    if(check && !s.bank) return err("Type what’s in your account, or tap Skip this.");
  }
  if(s.step === 2){
    s.cycle = $("suCycle").value; s.payday = optDate($("suPayday").value); s.pay = $("suPay").value.trim();

    var bad = s.bills.filter(function(b){ return b.amount && (parseAmount(b.amount) === null || !(parseAmount(b.amount) > 0)); })[0];
    if(bad) return err("Check the amount for " + (bad.name || "a bill") + ".");
  }
  return true;
}
function finishSetup(){
  var s = setup, st = state.settings, c = CURRENCIES.filter(function(x){ return x.code === s.currency; })[0];
  st.name = s.name; if(c){ st.currencyCode = c.code; st.currency = c.sym; }
  st.cycle = s.cycle; if(s.payday) st.payday = s.payday;
  var pay = parseAmount(s.pay); if(pay > 0) st.v3PayAmount = round2(pay);
  var main = state.accounts.filter(function(a){ return !a.archived && a.kind !== "card"; })[0];
  if(main){ main.includeInSafe = true; if(s.bank && parseAmount(s.bank) !== null) confirmReviewBalance(main.id, round2(parseAmount(s.bank))); }
  if(s.savings && parseAmount(s.savings) > 0){
    var sav = normAccount({id:uid(), name:"Savings", kind:"savings", includeInSafe:false, color:"#5E83A4"});
    state.accounts.push(sav); confirmReviewBalance(sav.id, round2(parseAmount(s.savings)));
  }
  var today = startOfToday();
  s.bills.forEach(function(b){
    var amt = parseAmount(b.amount); if(!(amt > 0) || !b.name) return;
    var day = Math.max(1, Math.min(31, Math.round(num(b.day)) || today.getDate()));

/* ---------- − and + beside every slider ---------- */
function enhanceRanges(scope){
  Array.prototype.forEach.call(scope.querySelectorAll('input[type="range"]'), function(r){
    if(r.__stepped || r.closest(".dialog")) return; r.__stepped = true;
    var wrap = document.createElement("span"); wrap.className = "rng";
    r.parentNode.insertBefore(wrap, r);
    var label = (r.getAttribute("aria-label") || (r.id && document.querySelector('label[for="' + r.id + '"]') && document.querySelector('label[for="' + r.id + '"]').textContent) || "value").trim();
    var mk = function(dir){
      var b = document.createElement("button"); b.type = "button"; b.className = "step-btn"; b.textContent = dir < 0 ? "−" : "+";
      b.setAttribute("aria-label", (dir < 0 ? "Less: " : "More: ") + label);
      b.addEventListener("click", function(){
        var step = num(r.step) || 1, v = Math.min(num(r.max), Math.max(num(r.min), num(r.value) + dir * step));
        if(v === num(r.value)) return;
        r.value = String(v);
        r.dispatchEvent(new Event("input", {bubbles:true}));
        r.dispatchEvent(new Event("change", {bubbles:true}));
      });
      return b;
    };
    wrap.appendChild(mk(-1)); wrap.appendChild(r); wrap.appendChild(mk(1));
  });
}

/* ============================================================
   THE NUMBER PAD in the Add dialog, like the ADHD Planner's:
   big keys, +1 +5 +10 +20 to build an amount by tapping, and on a
   phone no system keyboard jumping over half the screen. The box
   stays a normal input, so typing on a computer works as before.
   ============================================================ */
var BUMPS = [1, 5, 10, 20];
function coarsePointer(){ return !!(window.matchMedia && matchMedia("(pointer: coarse)").matches); }
function numpadHTML(id){
  var st = currencyStyle(), dec = st.decimals !== 0;
  var keys = ["1","2","3","4","5","6","7","8","9", dec ? "." : "", "0", "back"];
  return '<div class="np" data-for="' + id + '">'
    + '<div class="np-bump" role="group" aria-label="Add to the amount">' + BUMPS.map(function(n){
        /* in đồng the keys add thousands, written the short way people say them (+10k); the box beside shows the ₫ */
        n = n * moneyUnit(); var label = n >= 1000 && n % 1000 === 0 ? (n / 1000) + "k" : withCurrency(moneyDigits(n, true, st), st);
        return '<button type="button" data-bump="' + n + '" aria-label="Add ' + escapeHTML(withCurrency(moneyDigits(n, true, st), st)) + '">+' + escapeHTML(label) + '</button>'; }).join("")
    + '<button type="button" class="np-clear" data-np="clear">Clear</button></div>'
    + '<div class="np-keys">' + keys.map(function(k){
        if(!k) return '<span aria-hidden="true"></span>';
        return '<button type="button" data-np="' + k + '"' + (k === "back" ? ' aria-label="Delete the last digit"' : k === "." ? ' aria-label="Decimal point"' : '') + '>' + (k === "back" ? "⌫" : k) + '</button>';
      }).join("") + '</div></div>';
}
var numpadAddPlain = addDialog;
addDialog = function(){
  numpadAddPlain.apply(this, arguments);
  ["spAmount", "inAmount"].forEach(function(id){
    var inp = $(id); if(!inp || inp.__pad) return; inp.__pad = true;
    var box = inp.closest(".money-in") || inp;
    box.insertAdjacentHTML("afterend", numpadHTML(id));
    /* the pad replaces the phone keyboard; a computer keeps both */
    if(coarsePointer()) inp.setAttribute("inputmode", "none");
  });
};
function numpadPress(inp, k){
  var a = String(inp.value || "").replace(",", ".");
  if(k === "clear") a = "";
  else if(k === "back") a = a.slice(0, -1);
  else if(k === "."){ if(a.indexOf(".") < 0) a = (a || "0") + "."; }
  else {
    var dot = a.indexOf(".");
    if(dot >= 0 && a.length - dot > 2) return;               /* two decimals at most */
    if(a.replace(/[^0-9]/g, "").length >= (currencyStyle().decimals === 0 ? 12 : 9)) return;
    a = (a === "0" ? "" : a) + k;
  }
  inp.value = a;
  inp.dispatchEvent(new Event("input", {bubbles:true}));
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest(".np button"); if(!b) return;
  var inp = $(b.closest(".np").getAttribute("data-for")); if(!inp) return;
  var bump = b.getAttribute("data-bump");
  if(bump){
    var cur = parseAmount(inp.value); if(cur === null || !isFinite(cur)) cur = 0;
    inp.value = round2(cur + num(bump)).toFixed(currencyStyle().decimals === 0 ? 0 : 2);
    inp.dispatchEvent(new Event("input", {bubbles:true}));
  } else numpadPress(inp, b.getAttribute("data-np"));
  if(Motion && Motion.level && Motion.level() !== "off" && b.animate) b.animate([{transform:"scale(.9)"}, {transform:"scale(1)"}], {duration:140, easing:"ease-out"});
});

/* ============================================================
   REPEATS: one list for everything that repeats. Bills,
   subscriptions, debt payments and pay. No "choose one repeat
   system" rule: each is a repeat with a type.
   ============================================================ */
var repFilter = "all";
var HOW_OFTEN = [
  {id:"monthly", label:"Every month", cadence:"monthly", n:1}, {id:"weekly", label:"Every week", cadence:"weekly", n:1},
  {id:"fortnightly", label:"Every 2 weeks", cadence:"fortnightly", n:1}, {id:"q", label:"Every 3 months", cadence:"everyN", n:3},
  {id:"m2", label:"Every 2 months", cadence:"everyN", n:2}, {id:"h", label:"Every 6 months", cadence:"everyN", n:6}, {id:"y", label:"Once a year", cadence:"everyN", n:12},
  {id:"once", label:"Just once", cadence:"once", n:1}
];
function howOftenOf(b){
  for(var i = 0; i < HOW_OFTEN.length; i++){ var h = HOW_OFTEN[i]; if(h.cadence === b.cadence && (b.cadence !== "everyN" || h.n === num(b.everyN))) return h; }
  return b.cadence === "everyN" ? {id:"n", label:"Every " + b.everyN + " months", cadence:"everyN", n:num(b.everyN)} : b.cadence === "semimonthly" ? {id:"semi", label:"Twice a month", cadence:"semimonthly", n:1} : HOW_OFTEN[0];
}
/* what one repeat costs in an average month */
function perMonth(b){
  if(b.active === false) return 0;
  var a = num(b.amount);
  switch(b.cadence){
    case "weekly": return a * 52 / 12;
    case "fortnightly": return a * 26 / 12;
    case "semimonthly": return a * 2;
    case "everyN": return a / Math.max(1, num(b.everyN));
    case "once": return 0;
    default: return a;
  }
}
function repType(b){ return b.debtId ? "debt" : b.v3Type === "subscription" ? "sub" : "bill"; }
function subCountText(n){ return n + (n === 1 ? " subscription" : " subscriptions"); }
var TYPE_WORD = {bill:"Bill", sub:"Subscription", debt:"Debt payment", pay:"Money in"};

function upcomingRepeats(days){
  var today = fmtISO(startOfToday()), until = fmtISO(addDays(startOfToday(), days)), weekAgo = fmtISO(addDays(startOfToday(), -7));
  var out = state.billOccs.filter(function(o){ return !o.skipped && o.dueDate <= until && (!o.paid ? true : (o.paidOn || o.dueDate) >= weekAgo && o.dueDate >= weekAgo); }).map(function(o){
    var b = billById(o.billId);
    return {kind:"occ", id:o.id, date:o.dueDate, name:o.name, amount:num(o.amount), type:b ? repType(b) : "bill", paid:!!o.paid, paidOn:o.paidOn || null, auto:!!(b && b.v3Auto), vary:!!(b && b.v3Vary && !o.paid), overdue:!o.paid && o.dueDate < today};
  });
  state.income.forEach(function(x){ if(!x.confirmed && x.date <= until) out.push({kind:"inc", id:x.id, date:x.date, name:x.label, amount:num(x.amount), type:"pay", paid:false, overdue:x.date < today}); });
  expectedPay(days).forEach(function(p){ if(p.src || !out.some(function(y){ return y.type === "pay" && y.date === p.date; })) out.push({kind:p.src ? "src" : "expected", id:p.src || "", date:p.date, name:p.label, amount:p.amount, type:"pay", paid:false, overdue:false}); });
  return out.sort(function(a, b){ return (b.overdue - a.overdue) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0); });
}

/* ---------- paying: the same rule as the ADHD Planner. If a balance you
   confirmed was taken on or after the due date, the money may already be
   gone from it, so ask instead of taking it off twice. ---------- */
function payOccurrence(o){
  var bill = billById(o.billId);
  var acct = (bill && bill.accountId && accountById(bill.accountId)) || includedAccounts()[0] || state.accounts[0];
  var write = function(included){
    pushUndo("Marked " + o.name + " paid");
    var t = normTxn({amount:o.amount, categoryId:(bill && bill.categoryId) || null, note:o.name, date:fmtISO(startOfToday()), accountId:acct.id, billOccId:o.id, kind:"expense",
      includedInCheck:included === true ? true : included === false ? false : null}, {next:nextSeq, defaultAccount:acct.id});
    if(bill && bill.debtId) t.cardPaymentFor = bill.debtId;
    state.transactions.push(t);
    o.paid = true; o.paidTxnId = t.id; o.paidOn = t.date; o.generated = true;
    if(bill && bill.debtId) applyDebtPlan();
    closeDialog(); commit(o.name + " paid. One less thing.");
  };
  var chk = latestCheck(acct.id);
  if(!(state.settings.basis === "balance" && chk && stampDay(chk.at) >= o.dueDate)){ write(null); return; }
  openDialog("Was it already gone?",
    '<p>You checked your balance on <b>' + escapeHTML(shortDateLabel(parseDate(stampDay(chk.at)))) + '</b>, and ' + escapeHTML(o.name) + ' was due on <b>' + escapeHTML(shortDateLabel(parseDate(o.dueDate))) + '</b>.</p>'
    + '<p class="hint" style="margin-top:8px">If it had already left your account by then, that balance includes it, so it mustn’t come off twice.</p>',
    '<button type="button" class="btn ghost" id="pyAfter">It went out after that</button><button type="button" class="btn primary" id="pyIn">Yes, already gone</button>',
    function(){ $("pyIn").addEventListener("click", function(){ write(true); }); $("pyAfter").addEventListener("click", function(){ write(false); }); });
}
ACTIONS["rep-pay"] = function(el){ var o = occById(el.getAttribute("data-id")); if(o && !o.paid) payOccurrence(o); };
ACTIONS["rep-unpay"] = function(el){

  pushUndo("Marked " + o.name + " not paid");

/* ============================================================
   PAID FROM: which account a repeat comes out of. A buyer keeps
   three accounts: everyday money, a bills account and one for her
   envelopes, and wants safe to spend to be the everyday account
   alone. Before this every bill was held back from the first
   account counted in safe to spend, even when it's paid from an
   account that isn't counted. Now a bill paid from an account left
   out of safe to spend isn't held back from it (balance mode; the
   pay-period mode adds up all money in and out, accounts aside),
   it isn't taken off the forecast either, and marking it paid
   takes it from that account. Debt payments and tracked cards keep
   their own rules. V3 only: the shared core is not changed.
   ============================================================ */
function cashAccounts(){ return state.accounts.filter(function(a){ return !a.archived && a.kind !== "card"; }); }
function defaultBillAccount(){ return includedAccounts()[0] || cashAccounts()[0] || null; }
/* the account a bill is set to come out of, if it's still open */
function billAccount(b){ var a = b && b.accountId ? accountById(b.accountId) : null; return a && !a.archived && a.kind !== "card" ? a : null; }
/* paid from an account that isn't counted in safe to spend */
function paidOutside(b){
  var a = billAccount(b); if(!a || a.includeInSafe) return false;
  if(b.debtId) return false;
  return true;
}
function occPaidOutside(o){ return paidOutside(billById(o.billId)); }
/* spending that comes out of an account counted in safe to spend (or one not chosen) */
function countsInSafe(accountId){ var a = accountId ? accountById(accountId) : null; return !a || (a.includeInSafe && !a.archived && a.kind !== "card"); }

/* safe to spend: hold back only the bills paid from counted accounts */
var paidFromPlainBalance = computeBalance;
computeBalance = function(){
  var all = state.billOccs, keep = all.filter(function(o){ return !occPaidOutside(o); });
  if(keep.length === all.length) return paidFromPlainBalance.apply(this, arguments);
  state.billOccs = keep;
  try { return paidFromPlainBalance.apply(this, arguments); }
  finally { state.billOccs = all; }
};

/* ============================================================
   SPLIT MY PAY (V2's paycheck planner)
   One payday, shared out: bills, debt, savings and goals, everyday
   spending, and what's left for you. Each part starts from what the
   dashboard already knows (your repeats, goals, plans), and you can
   type your own amount instead. It's a plan only: nothing moves.
   Stored as state.v3PaySplit {bills, debt, save, spend} (your amounts,
   or empty to use the suggestion).
   ============================================================ */
var SPLIT_PARTS = [["bills","🧾","Bills and subscriptions"],["debt","💳","Debt payments"],["save","🎯","Savings and goals"],["spend","🛒","Everyday spending"]];
function paysPerYear(){ return {weekly:52, biweekly:26, fortnightly:26, semimonthly:24}[state.settings.cycle] || 12; }
function splitSuggest(){
  var per = 12 / paysPerYear(), bills = 0, debt = 0;
  state.bills.forEach(function(b){ if(b.active === false) return; if(b.debtId) debt += perMonth(b); else bills += perMonth(b); });
  var save = state.goals.reduce(function(n, g){ return n + (num(g.saved) < num(g.target) ? num(g.v3Monthly) : 0); }, 0);
  var spend = state.categories.reduce(function(n, c){ return n + monthlyPlan(c); }, 0);
  var out = {bills:round2(bills * per), debt:round2(debt * per), save:round2(save * per), spend:round2(spend * per)}, pay = usualPay();
  /* envelopes per paycheck: everyday spending is simply the envelopes, to the cent */
  if(planByPay()) out.spend = round2(state.categories.reduce(function(n, c){ return n + payPlanOf(c); }, 0));
  /* everyday spending gets what's left after the fixed parts, never more than your plans: the suggestion shouldn't overspend */

  return out;
}
function splitNow(){
