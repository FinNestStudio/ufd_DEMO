       if(after === 3 && s.indexOf(ch) > 0 && !/^0+$/.test(before)){ group = ch; } else { dec = ch; }
    }
  }
  var intPart = s, fracPart = "";
  if(dec){
    var i = s.lastIndexOf(dec);
    intPart = s.slice(0, i);
    fracPart = s.slice(i + 1);
    if(/[.,]/.test(fracPart)) return null;
  }
  if(group){
    var parts = intPart.split(group);
    if(parts.length > 1){
      if(!parts[0].length || parts[0].length > 3) return null;
      for(var k = 1; k < parts.length; k++){ if(parts[k].length !== 3) return null; }
    }
    intPart = parts.join("");
  }
  if(/[^0-9]/.test(intPart) || /[^0-9]/.test(fracPart)) return null;
  if(!intPart && !fracPart) return null;
  var v = parseFloat((intPart || "0") + (fracPart ? "." + fracPart : ""));
  if(!isFinite(v)) return null;
  return neg ? -v : v;
}

/* ---------- constants ---------- */
var CAT_COLORS = ["#5E8C68","#B4573A","#5E83A4","#A85C82","#9A7020","#75619B","#4E9B91","#7A8896","#8C6A4A","#5F7A8C"];
var EMOJI_CHOICES = ["🛒","🍽️","🚗","🎉","🏠","🔁","✨","☕","💊","🐾","🎁","👕","📚","💡","🎮","✈️","🧴","🍺","💅","🩺","💳","📱","🎵","🌿"];
/* after: the symbol follows the amount (1,234.50 kr). space: a letter symbol
   before the amount keeps a space (CHF 1,234.50). decimals:0 = whole units only. */
var CURRENCIES = [
  {code:"USD", sym:"$"},  {code:"GBP", sym:"£"}, {code:"EUR", sym:"€"},
  {code:"CAD", sym:"$"},  {code:"AUD", sym:"$"},      {code:"PHP", sym:"₱"},
  {code:"JPY", sym:"¥", decimals:0}, {code:"CHF", sym:"CHF", space:true},
  {code:"SEK", sym:"kr", after:true}, {code:"NOK", sym:"kr", after:true}, {code:"DKK", sym:"kr", after:true},
  {code:"PLN", sym:"zł", after:true}, {code:"INR", sym:"₹"}, {code:"BRL", sym:"R$"}, {code:"ZAR", sym:"R"},
  {code:"custom", sym:"$"}
];
var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_ABBR  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ============================================================
   Data model
   ============================================================ */
function defaultCategories(){
  return [
    {id:uid(), name:"Groceries",     color:"#5E8C68", emoji:"🛒", budget:0},
    {id:uid(), name:"Eating out",    color:"#B4573A", emoji:"🍽️", budget:0},
    {id:uid(), name:"Transport",     color:"#5E83A4", emoji:"🚗", budget:0},
    {id:uid(), name:"Fun",           color:"#A85C82", emoji:"🎉", budget:0},
    {id:uid(), name:"Home",          color:"#9A7020", emoji:"🏠", budget:0},
    {id:uid(), name:"Subscriptions", color:"#75619B", emoji:"🔁", budget:0},
    {id:uid(), name:"Misc",          color:"#7A8896", emoji:"✨", budget:0}
  ];
}
function defaultChips(){
  return [
    {id:uid(), label:"Coffee", amount:4,  emoji:"☕", categoryId:null, accountId:null},
    {id:uid(), label:"Lunch",  amount:12, emoji:"🍽️", categoryId:null, accountId:null},
    {id:uid(), label:"Bus",    amount:6,  emoji:"🚗", categoryId:null, accountId:null}
  ];
}
function defaultAccount(){
  return {id:uid(), name:"Checking", kind:"spending", archived:false, includeInSafe:true, color:"#5E8C68", debtId:null};
}

function freshState(opts){
  opts = opts || {};
  var acct = defaultAccount();
  var cats = defaultCategories();
  var chips = defaultChips();
  /* give chips real category homes so one-tap logging is never ambiguous */
  chips[0].categoryId = cats[1].id; chips[1].categoryId = cats[1].id; chips[2].categoryId = cats[2].id;
  return {
    version:SCHEMA,
    appVersion:VERSION,
    seq:1,
    settings:{
      name:"",
      currency: opts.currency || "$",
      currencyCode: opts.currencyCode || "USD",
      cycle: opts.cycle || "monthly",
      payday: opts.payday || fmtISO(startOfToday()),
      semimonthlySchedule:"auto",
      basis:"balance",             /* "balance" (checkpoint-based) | "period" (pay-period totals) */
      buffer:0,
      textSize:"normal",
      theme:"auto",
      plannerPalette:"lavender", plannerFont:"serif", plannerView:"everything", timerSound:true, timerVibration:false,
      reduceMotion:"auto",
      helpMode:false,
      focusDefault:false,
      onboarded:false,
      demo:false,
      lastSeen:null,
      capTimeframe:"month",       /* "month" | "period" — what a category cap means */
      fastCategoryAdd:true,       /* tap a category chip to add the expense */
      presetReview:false,         /* quick-add buttons save straight away */
      lastAccountId:null,
      billHorizonMonths:14,
      /* the payoff plan: which debt gets the extra, and how much extra a month */
      debtPlan:{strategy:"avalanche", extra:0, order:[]}
    },
    review: freshReview(),
    planner: freshPlanner(), envelopes:[], envelopeMoves:[], challenges:[],
    accounts:[acct],
    balanceChecks:[],
    income:[],
    transactions:[],
    transfers:[],
    bills:[],            /* definitions */
    billOccs:[],         /* materialised occurrences, stable ids */
    categories:cats,
    goals:[],
    debts:[],
    quickChips:chips,
    tasks:{},            /* dateISO -> {id:true} subjective task ticks */
    dayCloses:[],        /* dateISO the user explicitly closed */
    milestoneLog:[],     /* {key, earnedAt, evidence} — evidence, not a score */
    notes:"",
    notesHistory:[]
  };
}

/* ---------- normalisers: keep unknown fields, never invent ---------- */
function keepUnknown(target, source, known){
  if(!source || typeof source !== "object") return target;
  for(var k in source){
    if(!Object.prototype.hasOwnProperty.call(source,k)) continue;
    if(known.indexOf(k) === -1 && target[k] === undefined){ target[k] = source[k]; }
  }
  return target;
}
/* Keep the scheduled date separate from an occurrence's editable ledger date.
   Deleted generated rows are remembered on the source so reopening cannot
   silently recreate them. These optional fields also survive older backups. */
function normSkippedDates(dates){
  return Array.isArray(dates) ? dates.filter(function(d,i,a){
    return typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && safeDate(d,"invalid") === d && a.indexOf(d) === i;
  }).sort() : [];
}
var K_TXN = ["id","seq","amount","categoryId","note","date","accountId","recurring","recurrence","recurringSourceId",
  "billOccId","kind","cardPaymentFor","includedInCheck","splits","refundOf","anchorDate","recurrenceDate","skippedDates"];
function normTxn(x,ctx){
  var o = {
    id:x.id||uid(),
    seq: isFinite(+x.seq) ? +x.seq : ctx.next(),
    amount: round2(num(x.amount)),
    categoryId: x.categoryId || null,
    note: typeof x.note === "string" ? x.note : "",
    date: safeDate(x.date),
    accountId: x.accountId || ctx.defaultAccount,
    recurring: !!x.recurring,
    recurrence: x.recurrence || "monthly",
    recurringSourceId: x.recurringSourceId || null,
    billOccId: x.billOccId || null,
    kind: x.kind === "cardcharge" ? "cardcharge" : "expense",
    cardPaymentFor: x.cardPaymentFor || null,
    /* true/false when the buyer has told us whether a balance check already
       included this; null means "fall back to the sequence rule" */
    includedInCheck: (x.includedInCheck === true || x.includedInCheck === false) ? x.includedInCheck : null,
    /* one purchase, several category allocations that sum to its amount */
    splits: Array.isArray(x.splits) ? x.splits.map(function(sp){
      return {categoryId: sp.categoryId || null, amount: round2(num(sp.amount))};
    }).filter(function(sp){ return sp.amount * num(x.amount) > 0; }) : null,
    refundOf: x.refundOf || null,
    anchorDate: x.anchorDate ? safeDate(x.anchorDate) : null,
    recurrenceDate: x.recurringSourceId ? safeDate(x.recurrenceDate || x.date) : null,
    skippedDates: normSkippedDates(x.skippedDates)
  };
  if(o.splits && !o.splits.length) o.splits = null;
  return keepUnknown(o,x,K_TXN);
}
var K_INC = ["id","seq","label","amount","date","accountId","confirmed","recurring","recurringSourceId","kind","includedInCheck","anchorDate","recurrenceDate","skippedDates"];
function normIncome(x,ctx){
  var o = {
    id:x.id||uid(),
    seq: isFinite(+x.seq) ? +x.seq : ctx.next(),
    label: typeof x.label === "string" && x.label ? x.label : "Money in",
    amount: round2(num(x.amount)),
    date: safeDate(x.date),
    accountId: x.accountId || ctx.defaultAccount,
    /* legacy rows are historical fact: they were recorded as received.
       Only forward-dated legacy rows become forecasts. */
    confirmed: (x.confirmed === undefined)
        ? (parseDate(safeDate(x.date)).getTime() <= startOfToday().getTime())
        : !!x.confirmed,
    recurring: !!x.recurring,
    recurringSourceId: x.recurringSourceId || null,
    kind: x.kind || "other",
    includedInCheck: (x.includedInCheck === true || x.includedInCheck === false) ? x.includedInCheck : null,
    anchorDate: x.anchorDate ? safeDate(x.anchorDate) : null,
    recurrenceDate: x.recurringSourceId ? safeDate(x.recurrenceDate || x.date) : null,
    skippedDates: normSkippedDates(x.skippedDates)
  };
  return keepUnknown(o,x,K_INC);
}
var K_BILL = ["id","name","amount","cadence","everyN","anchorDate","accountId","categoryId","sinking","active","debtId","autoFromDebt"];
function normBill(x){
  var o = {
    id:x.id||uid(),
    name: typeof x.name === "string" && x.name ? x.name : "Bill",
    amount: round2(num(x.amount)),
    cadence: ["monthly","semimonthly","fortnightly","weekly","everyN","once"].indexOf(x.cadence)>=0 ? x.cadence : "monthly",
    everyN: Math.max(1, Math.round(num(x.everyN)) || 1),
    anchorDate: safeDate(x.anchorDate),
    accountId: x.accountId || null,
    categoryId: x.categoryId || null,
    sinking: x.sinking && typeof x.sinking === "object" ? {on:!!x.sinking.on, perMonth:round2(num(x.sinking.perMonth))} : {on:false, perMonth:0},
    active: x.active === false ? false : true,
    debtId: x.debtId || null,
    autoFromDebt: !!x.autoFromDebt
  };
  return keepUnknown(o,x,K_BILL);
}
var K_OCC = ["id","billId","name","amount","dueDate","paid","paidTxnId","paidOn","skipped"];
function normOcc(x){
  var o = {
    id: x.id || ((x.billId||"x") + "@" + (x.dueDate||"")),
    billId: x.billId || null,
    name: typeof x.name === "string" && x.name ? x.name : "Bill",
    amount: round2(num(x.amount)),
    dueDate: safeDate(x.dueDate),
    paid: !!x.paid,
    paidTxnId: x.paidTxnId || null,
    paidOn: x.paidOn || null,
    skipped: !!x.skipped
  };
  return keepUnknown(o,x,K_OCC);
}
var K_CAT = ["id","name","color","emoji","budget"];
function normCat(x){
  var o = {
    id:x.id||uid(),
    name: typeof x.name === "string" && x.name ? x.name : "Category",
    color: safeColor(x.color,"#7A8896"),
    emoji: safeGlyph(x.emoji,"✨"),
    budget: round2(num(x.budget))
  };
  return keepUnknown(o,x,K_CAT);
}
var K_GOAL = ["id","name","target","saved","dueDate","color","emoji","protect","heldAccountId","holdings","history"];
function normGoal(x){
  var o = {
    id:x.id||uid(),
    name: typeof x.name === "string" && x.name ? x.name : "Savings goal",
    target: round2(num(x.target)),
    saved: round2(num(x.saved)),
    dueDate: x.dueDate ? safeDate(x.dueDate) : "",
    color: safeColor(x.color,"#5E8C68"),
    emoji: safeGlyph(x.emoji,"🌱"),
    /* legacy goals did not reduce safe-to-spend; keep that true on upgrade */
    protect: x.protect === undefined ? false : !!x.protect,
    heldAccountId: x.heldAccountId || null,
    /* where the saved money actually sits. A contribution moved to savings
       must not relocate everything saved before it. */
    holdings: Array.isArray(x.holdings) ? x.holdings.map(function(h){
      return {accountId:h.accountId || null, amount:round2(num(h.amount))};
    }).filter(function(h){ return h.amount !== 0; }) : null,
    history: Array.isArray(x.history) ? x.history.map(function(h){
      return {id:h.id||uid(), amount:round2(num(h.amount)), date:safeDate(h.date),
              transferId:h.transferId||null, kind:(h.kind === "withdraw" ? "withdraw" : "add"),
              accountId:h.accountId || null, opening:!!h.opening};
    }) : []
  };
  if(!o.holdings || !o.holdings.length){
    o.holdings = o.saved ? [{accountId:o.heldAccountId || null, amount:o.saved}] : [];
  }
  return keepUnknown(o,x,K_GOAL);
}
var K_DEBT = ["id","name","balance","openingBalance","openingDate","openingSeq","apr","payment","cadence","dueDay","activeCard","trackCharges","accountId","color","hold","payDown"];
function normDebt(x){
  var o = {
    id:x.id||uid(),
    name: typeof x.name === "string" && x.name ? x.name : "Debt",
    balance: round2(num(x.balance)),
    openingBalance: x.openingBalance === undefined ? round2(num(x.balance)) : round2(num(x.openingBalance)),
    openingDate: safeDate(x.openingDate),
    /* charges/payments count from this point in the record sequence, so a
       correction made on the same day as a charge cannot count it twice */
    openingSeq: isFinite(+x.openingSeq) ? +x.openingSeq : 0,
    apr: Math.max(0, num(x.apr)),
    payment: round2(num(x.payment)),
    cadence: ["monthly","fortnightly","weekly"].indexOf(x.cadence)>=0 ? x.cadence : "monthly",
    dueDay: x.dueDay === null || x.dueDay === undefined || x.dueDay === "" ? null : clamp(Math.round(num(x.dueDay)),1,31),
    activeCard: !!x.activeCard,
    trackCharges: !!x.trackCharges,
    accountId: x.accountId || null,
    color: safeColor(x.color,"#B4573A"),
    /* how its payment comes off safe to spend: when due, spread out, or held right away */
    hold: ["due","spread","now"].indexOf(x.hold)>=0 ? x.hold : "due",
    /* v2.5: the balance goes down when a payment is marked paid. Debts from
       before keep the balance as typed until they are saved again. */
    payDown: x.payDown === true
  };
  return keepUnknown(o,x,K_DEBT);
}
var DEBT_PLANS = ["snowball","avalanche","custom","minimum"];
function normDebtPlan(p){
  p = p && typeof p === "object" ? p : {};
  return {
    strategy: DEBT_PLANS.indexOf(p.strategy) >= 0 ? p.strategy : "avalanche",
    extra: Math.max(0, round2(num(p.extra))),
    order: Array.isArray(p.order) ? p.order.filter(function(x){ return typeof x === "string"; }).slice(0,200) : []
  };
}
var K_ACCT = ["id","name","kind","includeInSafe","color","debtId","archived"];
function normAccount(x){
  var kind = ["spending","savings","cash","card"].indexOf(x.kind)>=0 ? x.kind : "spending";
  var o = {
    id:x.id||uid(),
    name: typeof x.name === "string" && x.name ? x.name : "Account",
    kind: kind,
    archived: x.archived === true,
    /* a card is never spendable cash */
    includeInSafe: (kind === "card" || x.archived === true) ? false : (x.includeInSafe === undefined ? (kind !== "savings") : !!x.includeInSafe),
    color: safeColor(x.color,"#5E8C68"),
    debtId: x.debtId || null
  };
  return keepUnknown(o,x,K_ACCT);
}
var K_CHECK = ["id","accountId","amount","at","seq","note"];
function normCheck(x,ctx){
  var o = {
    id:x.id||uid(),
    accountId:x.accountId||ctx.defaultAccount,
    amount: round2(num(x.amount)),
    at: x.at || new Date().toISOString(),
    /* the inclusion boundary: entries with seq <= this are already inside the figure */
    seq: isFinite(+x.seq) ? +x.seq : ctx.next(),
    note: typeof x.note === "string" ? x.note : ""
  };
  return keepUnknown(o,x,K_CHECK);
}
var K_XFER = ["id","seq","amount","fromAccountId","toAccountId","date","note","goalId","includedInCheck"];
function normTransfer(x,ctx){
  var o = {
    id:x.id||uid(),
    seq: isFinite(+x.seq) ? +x.seq : ctx.next(),
    amount: round2(num(x.amount)),
    fromAccountId:x.fromAccountId||null,
    toAccountId:x.toAccountId||null,
    date:safeDate(x.date),
    note: typeof x.note === "string" ? x.note : "",
    goalId:x.goalId||null,
    includedInCheck: (x.includedInCheck === true || x.includedInCheck === false) ? x.includedInCheck : null
  };
  return keepUnknown(o,x,K_XFER);
}

/* ============================================================
   migrate(): forward-only, idempotent, keeps what it cannot read.
   Never treats an unrecognised state as corrupt.
   ============================================================ */
var K_STATE = ["review","version","appVersion","seq","settings","accounts","balanceChecks","income","transactions",
  "transfers","bills","billOccs","categories","goals","debts","quickChips","tasks","dayCloses",
  "milestoneLog","notes","notesHistory","billHistory","planner","envelopes","envelopeMoves","challenges"];
var K_SETTINGS = ["name","currency","currencyCode","cycle","payday","semimonthlySchedule","basis","buffer",
  "textSize","theme","reduceMotion","helpMode","focusDefault","onboarded","demo","lastSeen","billHorizonMonths",
  "capTimeframe","fastCategoryAdd","presetReview","lastAccountId","plannerPalette","plannerFont","plannerView","timerSound","timerVibration","debtPlan"];

function migrate(input){
  if(input && Number(input.version) > SCHEMA) throw new Error("This file needs a newer planner. Existing data has not been changed.");
  if(!input || typeof input !== "object" || Array.isArray(input)) return freshState();
  /* work on a copy — never mutate the caller's object */
  var data;
  try{ data = JSON.parse(JSON.stringify(input)); }catch(e){ return freshState(); }

  var s = freshState();
  var seqHigh = 0;
  (["transactions","income","transfers","balanceChecks"]).forEach(function(k){
    if(Array.isArray(data[k])) data[k].forEach(function(r){
      if(r && isFinite(+r.seq)) seqHigh = Math.max(seqHigh, +r.seq);
    });
  });
  var counter = Math.max(1, seqHigh + 1, isFinite(+data.seq) ? +data.seq : 1);
  var ctx = { next:function(){ return counter++; }, defaultAccount:null };

  /* --- settings: merge known, preserve unknown --- */
  if(data.settings && typeof data.settings === "object"){
    for(var k in s.settings){
      if(data.settings[k] !== undefined) s.settings[k] = data.settings[k];
    }
    keepUnknown(s.settings, data.settings, K_SETTINGS);
  }
  /* a file arriving from v1 has no basis: it keeps the period maths it was built on */
  if(!data.settings || data.settings.basis === undefined){
    s.settings.basis = (Array.isArray(data.balanceChecks) && data.balanceChecks.length) ? "balance" : "period";
  }
  if(["period","balance"].indexOf(s.settings.basis) === -1) s.settings.basis = "period";
  s.settings.debtPlan = normDebtPlan(s.settings.debtPlan);
  /* Currency symbols are display data. Keep them short and inert even when
     they arrive from an older or hand-edited backup. Unknown codes are shown
     through the custom-symbol control instead of leaving the selector blank. */
  s.settings.currency = safeGlyph(s.settings.currency,"$").slice(0,4);
  if(!CURRENCIES.some(function(c){ return c.code === s.settings.currencyCode; })) s.settings.currencyCode = "custom";
  /* v1 caps meant "per pay period". Keep that meaning for a file that
     predates the setting rather than silently re-reading them as monthly. */
  if(!data.settings || data.settings.capTimeframe === undefined){
    var looksLegacy = !Array.isArray(data.billOccs) && Array.isArray(data.categories)
      && data.categories.some(function(c){ return c && num(c.budget) > 0; });
    s.settings.capTimeframe = looksLegacy ? "period" : "month";
  }
  if(["period","month"].indexOf(s.settings.capTimeframe) === -1) s.settings.capTimeframe = "month";
  s.settings.buffer = round2(num(s.settings.buffer));

  /* --- accounts --- */
  s.accounts = Array.isArray(data.accounts) && data.accounts.length
    ? data.accounts.map(normAccount)
    : [defaultAccount()];
  var firstSpend = null;
  for(var a=0;a<s.accounts.length;a++){ if(s.accounts[a].includeInSafe){ firstSpend = s.accounts[a].id; break; } }
  ctx.defaultAccount = firstSpend || s.accounts[0].id;

  /* --- ordered records get stable sequence numbers ---
     Legacy rows have no seq. Assign in date order (then original order),
     which is the only defensible reconstruction, and place every one of
     them BEFORE any balance check that may follow. */
  function withSeq(list, norm){
    if(!Array.isArray(list)) return [];
    var idx = list.map(function(r,i){ return {r:r, i:i}; });
    idx.sort(function(x,y){
      var hx = isFinite(+x.r.seq), hy = isFinite(+y.r.seq);
      if(hx && hy) return (+x.r.seq) - (+y.r.seq);
      if(hx !== hy) return hx ? -1 : 1;
      var d = parseDate(x.r.date) - parseDate(y.r.date);
      return d !== 0 ? d : (x.i - y.i);
    });
    return idx.map(function(o){ return norm(o.r, ctx); });
  }
  s.transactions = withSeq(data.transactions, normTxn);
  s.income       = withSeq(data.income, normIncome);
  s.transfers    = withSeq(data.transfers, normTransfer);

  /* --- categories: an empty-but-valid list is a real choice --- */
  s.categories = Array.isArray(data.categories) ? data.categories.map(normCat) : defaultCategories();

  /* --- bills: v1 shape -> definition + occurrence, deterministically --- */
  var occById = {};
  function putOcc(o){
    var n = normOcc(o);
    if(!n.id) return;
    if(occById[n.id]){
      /* idempotent: a repeated import must not duplicate or flip state */
      var prev = occById[n.id];
      prev.paid = prev.paid || n.paid;
      if(!prev.paidTxnId && n.paidTxnId) prev.paidTxnId = n.paidTxnId;
      return;
    }
    occById[n.id] = n;
  }
  if(Array.isArray(data.billOccs)){ data.billOccs.forEach(putOcc); }

  var defs = [];
  if(Array.isArray(data.bills)){
    data.bills.forEach(function(b){
      if(!b || typeof b !== "object") return;
      var isV1 = (b.dueDate !== undefined) && (b.cadence === undefined) && (b.anchorDate === undefined);
      if(isV1){
        var def = normBill({
          id:b.id, name:b.name, amount:b.amount,
          cadence: b.recurring ? "monthly" : "once",
          anchorDate: b.dueDate,
          categoryId: b.categoryId || null,
          sinking: b.sinking
        });
        keepUnknown(def, b, K_BILL.concat(["dueDate","paid","recurring"]));
        defs.push(def);
        putOcc({ id:def.id+"@"+(b.dueDate||""), billId:def.id, name:def.name,
                 amount:def.amount, dueDate:b.dueDate, paid:!!b.paid });
      } else {
        defs.push(normBill(b));
      }
    });
  }
  /* v1 billHistory rows are past occurrences — preserve them as evidence */
  if(Array.isArray(data.billHistory)){
    data.billHistory.forEach(function(h){
      if(!h || typeof h !== "object") return;
      var bid = h.sourceId || h.id;
      putOcc({ id: bid+"@"+(h.dueDate||""), billId:bid, name:h.name,
               amount:h.amount, dueDate:h.dueDate, paid:h.paid!==false });
    });
  }
  s.bills = defs;
  s.billOccs = Object.keys(occById).map(function(k){ return occById[k]; })
                .sort(function(x,y){ return parseDate(x.dueDate)-parseDate(y.dueDate); });

  /* --- the rest --- */
  s.balanceChecks = Array.isArray(data.balanceChecks) ? data.balanceChecks.map(function(c){ return normCheck(c,ctx); }) : [];
  s.goals   = Array.isArray(data.goals)   ? data.goals.map(normGoal)   : [];
  s.debts   = Array.isArray(data.debts)   ? data.debts.map(normDebt)   : [];
  s.quickChips = Array.isArray(data.quickChips) && data.quickChips.length
    ? data.quickChips.map(function(c){
        return {id:c.id||uid(), label:String(c.label||"Quick add").slice(0,24),
                amount:round2(num(c.amount)), emoji:safeGlyph(c.emoji,"➕"),
                categoryId:c.categoryId||null, accountId:c.accountId||null};
      })
    : defaultChips();
  s.tasks = (data.tasks && typeof data.tasks === "object" && !Array.isArray(data.tasks)) ? data.tasks : {};
  s.dayCloses = Array.isArray(data.dayCloses)
    ? data.dayCloses.filter(function(d){ return typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d); })
    : [];
  s.milestoneLog = Array.isArray(data.milestoneLog) ? data.milestoneLog.filter(function(m){
    return m && typeof m === "object" && typeof m.key === "string";
  }).map(function(m){ return {key:m.key, earnedAt:m.earnedAt||fmtISO(startOfToday()), evidence:typeof m.evidence==="string"?m.evidence:""}; }) : [];
  s.notes = typeof data.notes === "string" ? data.notes : "";
  s.notesHistory = Array.isArray(data.notesHistory) ? data.notesHistory.filter(function(n){ return typeof n === "string"; }).slice(-20) : [];

  /* chips must resolve to a real account or one tap is ambiguous */
  var acctIds = s.accounts.map(function(x){ return x.id; });
  s.quickChips.forEach(function(c){
    if(c.accountId && acctIds.indexOf(c.accountId) === -1) c.accountId = null;
  });
  s.transactions.forEach(function(t){ if(acctIds.indexOf(t.accountId) === -1) t.accountId = ctx.defaultAccount; });
  s.income.forEach(function(t){ if(acctIds.indexOf(t.accountId) === -1) t.accountId = ctx.defaultAccount; });

  s.review = normalizeReview(data.review);
  normalizePlannerState(s,data);
  s.seq = counter;
  s.version = SCHEMA;
  s.appVersion = VERSION;
  keepUnknown(s, data, K_STATE);
  return s;
}

/* ============================================================
   Load / save
   ============================================================ */
var state = null;
var loadProblem = null;

function load(){
  var raw = storage.read();
  flagStorage();
  if(!raw){ state = freshState(); importLegacyPlannerOnLoad(); return; }
  var parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    /* Do NOT overwrite: keep the unreadable copy exactly where it is
       so the buyer can still recover or export it. */
    loadProblem = {kind:"unreadable", raw:raw};
    state = freshState();
    state.settings.onboarded = true;
    return;
  }
  try{
    state = migrate(parsed);
    importLegacyPlannerOnLoad();
  }catch(e){
    loadProblem = {kind:"migration", raw:raw, message:String(e && e.message || e)};
    state = freshState();
    state.settings.onboarded = true;
  }
}
function nextSeq(){ state.seq = (state.seq||1) + 1; return state.seq - 1; }

function save(){
  state.version = SCHEMA;
  state.appVersion = VERSION;
  if(loadProblem) return false;      /* never save over data we could not read */
  var json;
  try{ json = JSON.stringify(state); }
  catch(e){ return false; }
  return storage.write(json);
}

/* ============================================================
   Pay-cycle maths — carried forward from v1.1.2 unchanged
   ============================================================ */
function semimonthlyPattern(pay, mode){
  mode = mode || "auto";
  if(mode === "first15") return {first:1, second:15};
  if(mode === "midEnd")  return {first:15, second:"eom"};
  var dom = pay.getDate();
  var isMonthEnd = dom === daysInMonth(pay.getFullYear(), pay.getMonth());
  if(isMonthEnd || dom === 15) return {first:15, second:"eom"};
  if(dom === 1) return {first:1, second:15};
  if(dom < 15) return {first:dom, second:dom+15};
  return {first:Math.max(1,dom-15), second:dom};
}
function semimonthlyDatesForMonth(y,m,pattern){
  var dim = daysInMonth(y,m);
  function makeDate(slot){
    var dom = slot === "eom" ? dim : Math.min(+slot,dim);
    return new Date(y,m,dom,12,0,0,0);
  }
  var dates = [makeDate(pattern.first), makeDate(pattern.second)];
  dates.sort(function(a,b){ return a-b; });
  if(dates[0].getTime() === dates[1].getTime()) dates.pop();
  return dates;
}
function semimonthlyWindow(pay, ref, mode){
  var pattern = semimonthlyPattern(pay,mode);
  var candidates = [];
  for(var offset=-1;offset<=1;offset++){
    var marker = new Date(ref.getFullYear(),ref.getMonth()+offset,1,12,0,0,0);
    candidates = candidates.concat(semimonthlyDatesForMonth(marker.getFullYear(),marker.getMonth(),pattern));
  }
  candidates.sort(function(a,b){ return a-b; });
  var start = candidates[0], next = null;
  for(var i=0;i<candidates.length;i++){
    if(candidates[i].getTime() <= ref.getTime()) start = candidates[i];
    else { next = candidates[i]; break; }
  }
  if(!next){
    var later = new Date(ref.getFullYear(),ref.getMonth()+2,1,12,0,0,0);
    next = semimonthlyDatesForMonth(later.getFullYear(),later.getMonth(),pattern)[0];
  }
  return {start:start, end:addDays(next,-1), next:next};
}
function getCycleWindow(cycle, paydayStr, ref, semi){
  ref = ref || startOfToday();
  var pay = parseDate(paydayStr);
  var start, end, next;
  if(cycle === "weekly" || cycle === "biweekly"){
    var len = (cycle === "weekly") ? 7 : 14;
    var k = Math.floor(dayDiff(pay, ref) / len);
    start = addDays(pay, k*len);
    while(start.getTime() > ref.getTime()){ start = addDays(start, -len); }
    while(dayDiff(start, ref) >= len){ start = addDays(start, len); }
    end = addDays(start, len-1);
    next = addDays(start, len);
  } else if(cycle === "semimonthly"){
    var semiWin = semimonthlyWindow(pay, ref, semi || "auto");
    start = semiWin.start; end = semiWin.end; next = semiWin.next;
  } else {
    var dom = pay.getDate();
    var cy=ref.getFullYear(), cm=ref.getMonth();
    var thisMonthPay = new Date(cy,cm,Math.min(dom,daysInMonth(cy,cm)),12,0,0,0);
    if(ref.getTime() >= thisMonthPay.getTime()){
      start = thisMonthPay;
      next  = addMonthsClamped(thisMonthPay,1,dom);
    } else {
      start = addMonthsClamped(thisMonthPay,-1,dom);
      next  = thisMonthPay;
    }
    end = addDays(next,-1);
  }
  return {start:start, end:end, next:next};
}
function currentWindow(ref){
  return getCycleWindow(state.settings.cycle, state.settings.payday, ref || startOfToday(), state.settings.semimonthlySchedule);
}
function windowForOffset(offset){
  var win = currentWindow();
  for(var i=0;i>offset;i--){ win = currentWindow(addDays(win.start,-1)); }
  for(var j=0;j<offset;j++){ win = currentWindow(addDays(win.next,0)); }
  return win;
}
function inWindow(dateStr, win){
  var d = parseDate(dateStr).getTime();
  return d >= win.start.getTime() && d <= win.end.getTime();
}
function cycleNoun(cycle){
  return cycle==="weekly" ? "week"
       : cycle==="biweekly" ? "fortnight"
       : cycle==="semimonthly" ? "pay period"
       : "month";
}

/* ============================================================
   Bill occurrences: generated once, stable ids, never regenerated
   ============================================================ */
function stepBillDate(dt, bill){
  switch(bill.cadence){
    case "weekly":      return addDays(dt,7);
    case "fortnightly": return addDays(dt,14);
    case "semimonthly": return semimonthlyWindow(parseDate(state.settings.payday), dt, state.settings.semimonthlySchedule).next;
    case "everyN":      return addMonthsClamped(dt, bill.everyN, parseDate(bill.anchorDate).getDate());
    case "once":        return null;
    default:            return addMonthsClamped(dt, 1, parseDate(bill.anchorDate).getDate());
  }
}
function occId(billId, dateISO){ return billId + "@" + dateISO; }

function materialiseBills(){
  var today = startOfToday();
  var horizon = addMonthsClamped(today, Math.max(2, Math.round(num(state.settings.billHorizonMonths)) || 14), today.getDate());
  var have = {};
  state.billOccs.forEach(function(o){ have[o.id] = o; });
  var changed = false;

  state.bills.forEach(function(b){
    if(!b.active) return;
    var d = parseDate(b.anchorDate);
    var guard = 0;
    while(d && d.getTime() <= horizon.getTime() && guard++ < 800){
      var iso = fmtISO(d);
      var id = occId(b.id, iso);
      if(!have[id]){
        var o = normOcc({id:id, billId:b.id, name:b.name, amount:b.amount, dueDate:iso, paid:false});
        have[id] = o; state.billOccs.push(o); changed = true;
      }
      if(b.cadence === "once") break;
      var nd = stepBillDate(d,b);
      if(!nd || nd.getTime() <= d.getTime()) break;
      d = nd;
    }
  });
  if(changed){
    state.billOccs.sort(function(x,y){ return parseDate(x.dueDate)-parseDate(y.dueDate); });
    save();
  }
  return changed;
}

/* ---------- recurring income + expenses (v1.1.2 behaviour) ---------- */
/* anchorISO is the ORIGINAL date of the repeating item. Without it a 31st
   steps to the 28th in February and then stays there. */
function nextRepeatDate(dt, recurrence, anchorISO){
  var anchorDay = anchorISO ? parseDate(anchorISO).getDate() : dt.getDate();
  if(recurrence === "weekly")  return addDays(dt,7);
  if(recurrence === "monthly") return addMonthsClamped(dt,1,anchorDay);
  var cycle = state.settings.cycle;
  if(cycle === "weekly")  return addDays(dt,7);
  if(cycle === "biweekly") return addDays(dt,14);
  if(cycle === "semimonthly"){
    return semimonthlyWindow(parseDate(state.settings.payday), dt, state.settings.semimonthlySchedule).next;
  }
  return addMonthsClamped(dt,1,anchorISO ? anchorDay : parseDate(state.settings.payday).getDate());
}
function skipRecurringOccurrence(entry, collectionName){
  if(!entry || !entry.recurringSourceId) return;
  var rows = collectionName === "income" ? state.income : state.transactions;
  var source = rows.filter(function(x){ return x.id === entry.recurringSourceId; })[0];
  if(!source) return;
  var date = entry.recurrenceDate || entry.date;
  source.skippedDates = normSkippedDates((source.skippedDates || []).concat([date]));
}
function materialiseRecurring(){
  var today = startOfToday(), changed = false;
  state.income.filter(function(x){ return x.recurring && !x.recurringSourceId; }).slice()
    .forEach(function(src){
      var anchor = src.anchorDate || src.date;
      var d = nextRepeatDate(parseDate(src.date),"paycycle",anchor), guard = 0;
      while(d.getTime() <= today.getTime() && guard++ < 120){
        var iso = fmtISO(d);
        var exists = (src.skippedDates || []).indexOf(iso) >= 0 || state.income.some(function(x){
          return x.recurringSourceId===src.id && (x.recurrenceDate || x.date)===iso;
        });
        if(!exists){
          state.income.push(normIncome({
            id:uid(), label:src.label, amount:src.amount, date:iso,
            accountId:src.accountId, recurring:false, recurringSourceId:src.id,
            anchorDate:anchor, recurrenceDate:iso,
            /* scheduling is not evidence that money arrived */
            confirmed:false, kind:src.kind
          }, {next:nextSeq, defaultAccount:src.accountId}));
          changed = true;
        }
        d = nextRepeatDate(d,"paycycle",anchor);
      }
    });
  state.transactions.filter(function(x){ return x.recurring && !x.recurringSourceId; }).slice()
    .forEach(function(src){
      var anchorE = src.anchorDate || src.date;
      var d = nextRepeatDate(parseDate(src.date),src.recurrence,anchorE), guard = 0;
      while(d.getTime() <= today.getTime() && guard++ < 120){
        var iso = fmtISO(d);
        var exists = (src.skippedDates || []).indexOf(iso) >= 0 || state.transactions.some(function(x){
          return x.recurringSourceId===src.id && (x.recurrenceDate || x.date)===iso;
        });
        if(!exists){
          state.transactions.push(normTxn({
            id:uid(), amount:src.amount, categoryId:src.categoryId, note:src.note, date:iso,
            accountId:src.accountId, recurring:false, recurrence:src.recurrence,
            recurringSourceId:src.id, anchorDate:anchorE, recurrenceDate:iso,
            kind:src.kind, splits:src.splits
          }, {next:nextSeq, defaultAccount:src.accountId}));
          changed = true;
        }
        d = nextRepeatDate(d,src.recurrence,anchorE);
      }
    });
  if(changed) save();
  return changed;
}

/* ============================================================
   THE CANONICAL CALCULATION
   One engine. Today, By account, forecasts and the purchase
   preview all read from here, so they cannot disagree.

   Two bases, both explicit:

   "period"  (the v1 pay-period basis, with tracked-card holds)
       money in this pay period
     − spending logged this pay period
     − bills committed in this pay period
     − tracked card purchases not yet covered by a payment
     = available for the rest of the period

   "balance" (the extension)
       included account balances at their checkpoints
     + confirmed inflows recorded after those checkpoints
     − outflows recorded after those checkpoints
     − net money moved out to accounts that are not included
     − unpaid commitments due on or before the horizon
     − protected funds still held in included accounts
     − buffer
     = available until the horizon

   HORIZON: the day before the next payday. Money arriving on
   payday pays for bills dated on payday, so a bill dated exactly
   on the next payday sits in the NEXT period, not this one. The
   UI says this in words wherever the horizon is shown.

   INCLUSION BOUNDARY: every record carries a monotonic `seq`.
   A balance check stores the counter value at the moment it was
   confirmed. An entry counts as "after the checkpoint" when
   entry.seq > check.seq. A timestamp cannot separate a
   late-entered morning expense from a genuinely later one; a
   sequence number can.
   ============================================================ */

function includedAccounts(){
  return state.accounts.filter(function(a){ return !a.archived && a.includeInSafe && a.kind !== "card"; });
}
function accountById(id){
  for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].id===id) return state.accounts[i]; }
  return null;
}
function latestCheck(accountId){
  var best = null;
  for(var i=0;i<state.balanceChecks.length;i++){
    var c = state.balanceChecks[i];
    if(c.accountId !== accountId) continue;
    if(!best || c.seq > best.seq) best = c;
  }
  return best;
}
/* A record counts as "after the checkpoint" when the buyer has told us so,
   and otherwise by sequence. Creation order alone cannot know whether a
   back-dated entry was already inside the bank figure, so the answer is
   asked for and stored when it matters. */
function afterCheck(rec, checkSeq){
  if(rec.includedInCheck === true) return false;
  // A newer checkpoint absorbs older records, including explicit exclusions.
  if(rec.includedInCheck === false) return rec.seq > checkSeq;
  return rec.seq > checkSeq;
}
function cardAccountIds(){
  return state.accounts.filter(function(a){ return a.kind === "card"; }).map(function(a){ return a.id; });
}

/* horizon + day count shared by both bases */
function horizonInfo(ref){
  var today = ref || startOfToday();
  var win = currentWindow(today);
  var horizon = addDays(win.next, -1);
  if(horizon.getTime() < today.getTime()) horizon = today;
  var days = Math.max(1, dayDiff(today, horizon) + 1);
  return {win:win, today:today, horizon:horizon, days:days, payday:win.next};
}

/* ---------- period basis (legacy semantics, preserved) ---------- */
function billsCommittedInWindow(win, includeOverdue){
  var total = 0, count = 0, items = [];
  var today = startOfToday();
  state.billOccs.forEach(function(o){
    if(o.skipped) return;
    var due = parseDate(o.dueDate);
    var isIn = due.getTime() >= win.start.getTime() && due.getTime() <= win.end.getTime();
    var isOverdueUnpaid = !!includeOverdue && !o.paid && due.getTime() < win.start.getTime() && due.getTime() < today.getTime();
    if(!isIn && !isOverdueUnpaid) return;
    total += num(o.amount); count++; items.push(o);
  });
  return {total:round2(total), count:count, items:items};
}

function computePeriod(ref){
  var h = horizonInfo(ref);
  var win = h.win;
  var moneyIn = 0, spent = 0;
  state.income.forEach(function(x){ if(inWindow(x.date,win)) moneyIn += num(x.amount); });
  state.transactions.forEach(function(t){
    if(t.kind === "cardcharge") return;           /* a charge is not cash out */
    if(t.billOccId) return;                        /* the occurrence already counts it */
    if(inWindow(t.date,win)) spent += num(t.amount);
  });
  var bills = billsCommittedInWindow(win, true);
  var cards = trackedCardHolds(h);
  /* Paid card occurrences are cash already spent in this period. Unpaid
     occurrences are part of the card hold, alongside new charges; leaving
     them in bills would take the same planned repayment twice. */
  var unpaidCardBills = bills.items.reduce(function(sum,o){
    return sum + (!o.paid && cards.billDebt[o.billId] ? num(o.amount) : 0);
  },0);
  var billsTotal = round2(bills.total - unpaidCardBills);
  var envelopeReserve=budgetEnvelopeReserve(includedAccounts().map(function(a){return a.id;}),h.horizon,false).total;
  var early = debtEarlyHold(h);
  var available = round2(moneyIn - spent - billsTotal - cards.total - envelopeReserve - early.total);
  return {
    basis:"period", ok:true, h:h,
    available:available,
    lines:[
      {key:"in",    label:"Money in this " + cycleNoun(state.settings.cycle), amount:round2(moneyIn),   sign:1},
      {key:"spent", label:"Spending you have logged",                        amount:round2(-spent),    sign:-1},
      {key:"bills", label:"Bills committed this " + cycleNoun(state.settings.cycle), amount:round2(-billsTotal), sign:-1},
      {key:"card", label:"Set aside for card spending and payments", amount:round2(-cards.total), sign:-1},
      {key:"envelopes", label:"Set aside in envelopes", amount:round2(-envelopeReserve), sign:-1},
      {key:"debtlater", label:"Set aside for debt due later", amount:round2(-early.total), sign:-1}
    ].filter(function(l){return (l.key!=='envelopes'&&l.key!=='debtlater'&&l.key!=='card')||l.amount!==0;}),
    earlyDebt:early.items,
    moneyIn:round2(moneyIn), spent:round2(spent), billsTotal:billsTotal, cardNotes:cards.notes,
    perAccount:[], unchecked:[], shortfalls:[],
    /* which of today's spends actually moved this number — see computeAvailable */
    counts:function(t){ return inWindow(t.date, win); }
  };
}

/* ---------- balance basis (the extension) ---------- */
function computeBalance(ref){
  var h = horizonInfo(ref);
  var inc = includedAccounts();
  var cards = cardAccountIds();
  var checked = [], unchecked = [];
  inc.forEach(function(a){
    var c = latestCheck(a.id);
    if(c) checked.push({account:a, check:c}); else unchecked.push(a);
  });
  if(!checked.length){
    return {basis:"balance", ok:false, reason:"nocheck", h:h, available:0, lines:[],
            perAccount:[], unchecked:unchecked, shortfalls:[]};
  }
  var checkedIds = checked.map(function(x){ return x.account.id; });
  function isChecked(id){ return checkedIds.indexOf(id) >= 0; }
  function boundaryFor(id){
    for(var i=0;i<checked.length;i++){ if(checked[i].account.id===id) return checked[i].check.seq; }
    return Infinity;
  }
  var horizonT = h.horizon.getTime();

  var per = {};
  checked.forEach(function(x){
    per[x.account.id] = {account:x.account, check:x.check, base:num(x.check.amount),
                         inflow:0, outflow:0, xferOut:0, xferIn:0, commit:0, reserve:0};
  });

  /* confirmed inflows recorded after the checkpoint */
  state.income.forEach(function(x){
    if(!isChecked(x.accountId)) return;
    if(!x.confirmed) return;                                  /* a forecast is not money */
    if(!afterCheck(x, boundaryFor(x.accountId))) return;      /* already inside the checkpoint */
    if(parseDate(x.date).getTime() > horizonT) return;
    per[x.accountId].inflow += num(x.amount);
  });
  /* outflows recorded after the checkpoint (card charges move no cash) */
  state.transactions.forEach(function(t){
    if(t.kind === "cardcharge") return;
    if(cards.indexOf(t.accountId) >= 0) return;
    if(!isChecked(t.accountId)) return;
    if(!afterCheck(t, boundaryFor(t.accountId))) return;
    if(parseDate(t.date).getTime() > horizonT) return;
    per[t.accountId].outflow += num(t.amount);
  });
  /* Transfers are neither income nor spending - they move cash between
     accounts. Each LEG is applied independently against its own account's
     checkpoint, because a later checkpoint can absorb one side and not the
     other. A transfer dated beyond the horizon is still only planned. */
  state.transfers.forEach(function(x){
    if(parseDate(x.date).getTime() > horizonT) return;
    var amt = num(x.amount);
    if(isChecked(x.fromAccountId) && afterCheck(x, boundaryFor(x.fromAccountId))){
      per[x.fromAccountId].xferOut += amt;
    }
    if(isChecked(x.toAccountId) && afterCheck(x, boundaryFor(x.toAccountId))){
      per[x.toAccountId].xferIn += amt;
    }
  });

  /* --- commitments: unpaid occurrences due on or before the horizon --- */
  var cardsHeld = trackedCardHolds(h);

  var commitItems = [], debtCommit = 0;
  state.billOccs.forEach(function(o){
    if(o.paid || o.skipped) return;
    var due = parseDate(o.dueDate).getTime();
    if(due > horizonT) return;                                 /* bills on payday belong to next period */
    if(cardsHeld.billDebt[o.billId]) return;                   /* card rule below */
    var bill = billById(o.billId);
    var acct = (bill && bill.accountId && isChecked(bill.accountId)) ? bill.accountId : checkedIds[0];
    per[acct].commit += num(o.amount);
    if(bill && bill.debtId) debtCommit += num(o.amount);
    commitItems.push(o);
  });

  /* Tracked purchases and their repayments share one reserve. */
  var cardReserve = cardsHeld.total, cardNotes = cardsHeld.notes;
  if(cardReserve > 0) per[checkedIds[0]].commit += cardReserve;

  /* debt payments due after payday that the buyer chose to spread out or hold early */
  var early = debtEarlyHold(h);
  if(early.total > 0) per[checkedIds[0]].commit += early.total;

  /* --- protected money still sitting inside included accounts --- */
  /* Hold back protected money only where it actually still sits. Money the
     buyer has already moved to an excluded account was taken once by the
     transfer; reserving it again would deduct it twice. */
  var reserveTotal = 0;
  state.goals.forEach(function(g){
    if(!g.protect) return;
    goalHoldings(g).forEach(function(h){
      var acct = h.accountId || checkedIds[0];
      if(!isChecked(acct)) return;
      var amt = Math.max(0, num(h.amount));
      if(amt <= 0) return;
      per[acct].reserve += amt;
      reserveTotal += amt;
    });
  });

  var envelopeHold=budgetEnvelopeReserve(checkedIds,h.horizon);
  Object.keys(envelopeHold.byAccount).forEach(function(id){per[id].reserve+=envelopeHold.byAccount[id];});
  var buffer = Math.max(0, num(state.settings.buffer));
  var base=0, inflow=0, outflow=0, xferOut=0, xferIn=0, commit=0;
  var perAccount = [], shortfalls = [];
  checkedIds.forEach(function(id){
    var p = per[id];
    base+=p.base; inflow+=p.inflow; outflow+=p.outflow;
    xferOut+=p.xferOut; xferIn+=p.xferIn; commit+=p.commit;
    var avail = round2(p.base + p.inflow - p.outflow - p.xferOut + p.xferIn - p.commit - p.reserve);
    var row = {account:p.account, available:avail, base:round2(p.base), commit:round2(p.commit), reserve:round2(p.reserve)};
    perAccount.push(row);
    if(avail < 0) shortfalls.push(row);
  });

  var available = round2(base + inflow - outflow - xferOut + xferIn - commit - reserveTotal - envelopeHold.total - buffer);

  var lines = [
    {key:"base",    label:"In your accounts when you last checked", amount:round2(base),      sign:1},
    {key:"inflow",  label:"Arrived since then",                     amount:round2(inflow),    sign:1},
    {key:"xferin",  label:"Moved back in",                          amount:round2(xferIn),    sign:1},
    {key:"outflow", label:"Spent and paid since then",              amount:round2(-outflow),  sign:-1},
    {key:"xferout", label:"Moved out to accounts you excluded",     amount:round2(-xferOut),  sign:-1},
    {key:"commit",  label:"Bills still to land before " + shortDateLabel(h.horizon), amount:round2(-(commit - debtCommit - cardReserve - early.total)), sign:-1},
    {key:"debt",    label:"Debt payments before " + shortDateLabel(h.horizon), amount:round2(-(debtCommit + cardReserve)), sign:-1},
    {key:"debtlater", label:"Set aside for debt due later", amount:round2(-early.total), sign:-1},
    {key:"reserve", label:"Already set aside for goals",            amount:round2(-reserveTotal), sign:-1},
    {key:"envelopes",label:"Set aside in envelopes",amount:round2(-envelopeHold.total),sign:-1},
    {key:"buffer",  label:"Your buffer",                            amount:round2(-buffer),   sign:-1}
  ].filter(function(l){ return l.amount !== 0 || l.key === "base"; });

  return {
    basis:"balance", ok:true, h:h, available:available, lines:lines,
    perAccount:perAccount, unchecked:unchecked, shortfalls:shortfalls,
    cardNotes:cardNotes, commitItems:commitItems, unplannedDebts:unplannedDebts(), earlyDebt:early.items,
    /* spending the checkpoint already absorbed is NOT still to come off */
    counts:function(t){
      return isChecked(t.accountId)
        && afterCheck(t, boundaryFor(t.accountId))
        && parseDate(t.date).getTime() <= horizonT;
    },
    checkedAt: checked.map(function(x){ return x.check; }).sort(function(a,b){ return b.seq-a.seq; })[0]
  };
}

/* A debt payment due AFTER payday normally waits for its own pay period.
   "spread": set a little aside every day since the previous payment, so by
   payday the share that belongs to this period is already held.
   "now": hold the whole next payment straight away, if none is due before payday.
   Tracked cards follow their own rule above and are left alone here. */
function debtEarlyHold(h){
  var horizonT = h.horizon.getTime(), total = 0, items = [];
  var CAD = {weekly:7, fortnightly:14};
  state.debts.forEach(function(d){
    if(d.hold !== "spread" && d.hold !== "now") return;
    if(d.activeCard && d.trackCharges && d.accountId) return;
    var bill = state.bills.filter(function(b){ return b.debtId === d.id && b.active !== false; })[0];
    if(!bill) return;
    var occs = state.billOccs.filter(function(o){ return o.billId === bill.id; })
      .sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0; });
    var open = occs.filter(function(o){ return !o.paid && !o.skipped; });
    var next = open.filter(function(o){ return parseDate(o.dueDate).getTime() > horizonT; })[0];
    if(!next) return;
    var amt = 0;
    if(d.hold === "now"){
      if(open.some(function(o){ return parseDate(o.dueDate).getTime() <= horizonT; })) return;
      amt = num(next.amount);
    } else {
      var due = parseDate(next.dueDate), prev = occs.filter(function(o){ return o.dueDate < next.dueDate; }).pop();
      var from = prev ? parseDate(prev.dueDate) : addDays(due, -(CAD[bill.cadence] || 30));
      var span = Math.max(1, dayDiff(from, due));
      amt = num(next.amount) * clamp(dayDiff(from, h.payday) / span, 0, 1);
    }
    amt = round2(amt);
    if(amt > 0){ total += amt; items.push({debt:d, amount:amt, dueDate:next.dueDate, full:round2(num(next.amount)), mode:d.hold}); }
  });
  return {total:round2(total), items:items};
}
/* Debts with money owed but no payment plan: nothing is held back for them,
   so say so instead of letting the number look safer than it is. */
function unplannedDebts(){
  return state.debts.filter(function(d){
    if(d.activeCard && d.trackCharges) return false;
    if(!(currentDebtBalance(d) > 0)) return false;
    return !state.bills.some(function(b){ return b.debtId === d.id && b.active !== false; });
  });
}
function categoryById(id){
  for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; }
  return null;
}
function goalById(id){
  for(var i=0;i<state.goals.length;i++){ if(state.goals[i].id===id) return state.goals[i]; }
  return null;
}
function debtById(id){
  for(var i=0;i<state.debts.length;i++){ if(state.debts[i].id===id) return state.debts[i]; }
  return null;
}
function occById(id){
  for(var i=0;i<state.billOccs.length;i++){ if(state.billOccs[i].id===id) return state.billOccs[i]; }
  return null;
}
function txnById(id){
  for(var i=0;i<state.transactions.length;i++){ if(state.transactions[i].id===id) return state.transactions[i]; }
  return null;
}
function billById(id){
  for(var i=0;i<state.bills.length;i++){ if(state.bills[i].id===id) return state.bills[i]; }
  return null;
}
/* How much of the tracked charges is still outstanding.

   Payments are allocated oldest-liability-first: against the opening
   statement balance, then against charges in the order they happened. A
   partial payment therefore settles part of the oldest charge and leaves
   the rest reserved. "Everything since the last payment" wrongly released
   the lot the moment any payment was recorded. */
function cardLedger(debt, throughDate){
  if(!debt.accountId) return {outstanding:0, openingLeft:0, lots:[], overpaid:0};
  var openingSeq = num(debt.openingSeq);
  var lots = [];
  var pool = 0, refunds = [];
  state.transactions.forEach(function(t){
    if(t.seq <= openingSeq) return;
    if(throughDate && t.date > throughDate) return;
    if(t.kind === "cardcharge" && t.accountId === debt.accountId){
      var a = num(t.amount);
      if(a > 0) lots.push({seq:t.seq, id:t.id, amount:a, left:a, date:t.date});
      else if(t.refundOf) refunds.push({id:t.refundOf, amount:-a});
      else pool += -a;                       /* an unlinked credit to the card */
    }
    if(t.cardPaymentFor === debt.id) pool += num(t.amount);
  });
  lots.sort(function(a,b){ return a.seq - b.seq; });

  /* A refund reverses its purchase first. Applying it to the opening debt
     would keep reserving cash for a purchase that has already been returned. */
  refunds.forEach(function(r){
    var lot = lots.filter(function(l){ return l.id === r.id; })[0];
    var applied = lot ? Math.min(r.amount, lot.left) : 0;
    if(lot) lot.left = round2(lot.left - applied);
    pool += r.amount - applied;
  });

  var openingLeft = Math.max(0, num(debt.openingBalance));
  var take = Math.min(pool, openingLeft);
  openingLeft = round2(openingLeft - take);
  pool = round2(pool - take);
  for(var i=0;i<lots.length && pool > 0;i++){
    var t2 = Math.min(pool, lots[i].left);
    lots[i].left = round2(lots[i].left - t2);
    pool = round2(pool - t2);
  }
  var outstanding = round2(lots.reduce(function(a,l){ return a + l.left; }, 0));
  return {outstanding:outstanding, openingLeft:openingLeft, lots:lots, overpaid:round2(pool)};
}
function unpaidCardCharges(debt, throughDate){ return cardLedger(debt, throughDate).outstanding; }

/* A tracked card has two liabilities: its old statement balance and the new
   purchases in the ledger. The full unpaid new-purchase balance is held now.
   An unpaid scheduled repayment overlaps that hold only to the extent that
   it can pay a still-unpaid purchase already made by its due date. Repayments
   first go to the opening balance, as cardLedger does. Thus an old balance
   plus a new purchase needs both its scheduled payment and the purchase
   held, while two schedules cannot claim the same purchase twice. */
function trackedCardHolds(h){
  var debts = {}, billDebt = {}, total = 0, notes = [];
  state.debts.forEach(function(d){
    if(d.activeCard && d.trackCharges && d.accountId) debts[d.id] = d;
  });
  state.bills.forEach(function(b){ if(debts[b.debtId]) billDebt[b.id] = b.debtId; });
  var through = fmtISO(h.horizon);
  Object.keys(debts).forEach(function(id){
    var d = debts[id], ledger = cardLedger(d, through);
    var lots = ledger.lots.map(function(l){ return {date:l.date, left:l.left}; });
    var opening = ledger.openingLeft, scheduled = 0, covered = 0;
    var occs = state.billOccs.filter(function(o){
      return !o.paid && !o.skipped && billDebt[o.billId] === id && o.dueDate <= through;
    }).sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0; });
    occs.forEach(function(o){
      var due = Math.max(0, num(o.amount)), left = due;
      scheduled += due;
      var old = Math.min(left, opening);
      opening = round2(opening - old);
      left = round2(left - old);
      for(var i=0;i<lots.length && left > 0;i++){
        if(lots[i].date > o.dueDate) continue;  /* this payment cannot settle a later purchase */
        var taken = Math.min(left, lots[i].left);
        lots[i].left = round2(lots[i].left - taken);
        left = round2(left - taken);
        covered += taken;
      }
    });
    var hold = round2(scheduled + ledger.outstanding - covered);
    if(hold > 0){
      total += hold;
      notes.push({name:d.name, charges:round2(ledger.outstanding), scheduled:round2(scheduled), held:hold});
    }
  });
  return {total:round2(total), notes:notes, billDebt:billDebt};
}

/* where a goal's saved money actually sits */
function goalHoldings(g){
  if(Array.isArray(g.holdings) && g.holdings.length) return g.holdings;
  return num(g.saved) ? [{accountId:g.heldAccountId || null, amount:num(g.saved)}] : [];
}

/* ---------- the single entry point ---------- */
function computeAvailable(ref){
  var r;
  if(state.settings.basis === "balance"){
    r = computeBalance(ref);
    /* No balance confirmed yet. Rather than show nothing, fall back to the
       pay-period totals and SAY that is what the number is built on. */
    if(!r.ok){
      var why = r.reason, unchecked = r.unchecked;
      r = computePeriod(ref);
      r.fellBack = true; r.fallbackReason = why; r.unchecked = unchecked;
    }
  } else {
    r = computePeriod(ref);
  }
  var h = r.h;
  var today = h.today;

  /* Today's spending, counted the same way `available` counts it.
     A spend the balance checkpoint already absorbed is not deducted a
     second time here, and a bill payment does not appear as fresh
     discretionary spending because its commitment was already held back.
     This is what keeps hero, pacing bar and ledger in agreement. */
  var iso = fmtISO(today);
  var tracked = {};
  state.debts.forEach(function(d){
    if(d.activeCard && d.trackCharges && d.accountId) tracked[d.accountId] = true;
  });
  var spentToday = 0, spentTodayAll = 0;
  state.transactions.forEach(function(t){
    if(t.date !== iso) return;
    if(t.cardPaymentFor) return;              /* settling a card is not a purchase */
    spentTodayAll += num(t.amount);           /* every purchase made today */
    if(t.billOccId) return;                   /* its commitment was already held back */
    if(t.kind === "cardcharge"){
      /* a charge on a tracked card is held back from available, so it paces
         the day. On a card we do not track it changes nothing, so it does not. */
      if(tracked[t.accountId]) spentToday += num(t.amount);
      return;
    }
    if(r.counts && !r.counts(t)) return;
    spentToday += num(t.amount);
  });
  r.spentToday = round2(spentToday);
  r.spentTodayAll = round2(spentTodayAll);
  r.days = h.days;
  r.horizon = h.horizon;
  r.payday = h.payday;

  /* daily guide: pacing over the remaining local calendar days */
  r.dailyGuide = r.ok ? round2(safeDiv(Math.max(0, r.available), h.days)) : 0;

  /* today's starting allowance, held independent of today's later spending.
     `available` has today's spending already taken out, so adding it back
     recovers the figure the day opened on. Nothing is subtracted twice. */
  var startBase = r.available + r.spentToday;
  r.startAllowance = (r.ok && startBase > 0) ? round2(safeDiv(startBase, h.days)) : 0;
  r.hasStartAllowance = r.ok && r.startAllowance > 0;

  r.short = r.available < 0 ? round2(-r.available) : 0;
  r.displayAvailable = r.available;
  return r;
}

/* preview only — changes nothing until the spend is actually logged */
function previewSpend(amount){
  var now = computeAvailable();
  var amt = round2(num(amount));
  if(!now.ok || !(amt > 0)) return null;
  var after = round2(now.available - amt);
  return {
    amount:amt,
    before:now.available,
    after:after,
    dailyAfter:round2(safeDiv(Math.max(0,after), now.days)),
    days:now.days,
    horizon:now.horizon,
    short: after < 0 ? round2(-after) : 0
  };
}

/* ============================================================
   Period / month summaries (Month screen, history)
   ============================================================ */
/* The stretch of time a category cap describes. Spending, remaining and
   the per-day figure all read from the same one. */
function capWindow(ref){
  if(state.settings.capTimeframe === "period") return currentWindow(ref);
  var t = ref || startOfToday();
  return monthWindow(t.getFullYear(), t.getMonth());
}
function capDaysLeft(){
  var w = capWindow(), today = startOfToday();
  var end = w.end.getTime() < today.getTime() ? today : w.end;
  return Math.max(1, dayDiff(today, end) + 1);
}
function capNoun(){
  return state.settings.capTimeframe === "period" ? cycleNoun(state.settings.cycle) : "month";
}

/* one purchase, one or several category allocations */
function allocate(t){
  if(t.splits && t.splits.length) return t.splits;
  return [{categoryId:t.categoryId || null, amount:num(t.amount)}];
}
function summariseWindow(win){
  var moneyIn=0, confirmedIn=0, spent=0, itemCount=0, byCat={};
  state.income.forEach(function(x){
    if(!inWindow(x.date,win)) return;
    moneyIn += num(x.amount);
    if(x.confirmed) confirmedIn += num(x.amount);
    itemCount++;
  });
  /* A card purchase is a purchase: it belongs in spending and in its
     category on the day it happened. Paying the card off later is a debt
     settlement, not a second purchase, so it is excluded here. */
  state.transactions.forEach(function(t){
    if(t.billOccId || t.cardPaymentFor) return;
    if(!inWindow(t.date,win)) return;
    var a = num(t.amount);
    spent += a;
    allocate(t).forEach(function(al){
      byCat[al.categoryId || "__none"] = (byCat[al.categoryId || "__none"] || 0) + al.amount;
    });
    itemCount++;
  });
  var bills = billsCommittedInWindow(win, false);
  /* Tracked card purchases were counted above. Their repayment schedules
     settle those purchases and must not appear as a second purchase. Loans
     and cards whose charges are not tracked retain their bill spending. */
  bills.items = bills.items.filter(function(o){
    var b = billById(o.billId);
    return !(b && b.debtId && state.debts.some(function(d){
      return d.id === b.debtId && d.activeCard && d.trackCharges && d.accountId;
    }));
  });
  bills.count = bills.items.length;
  bills.total = round2(bills.items.reduce(function(sum,o){ return sum + num(o.amount); },0));
  itemCount += bills.count;
  bills.items.forEach(function(o){
    var b = billById(o.billId);
    var cid = (b && b.categoryId) || "__bills";
    byCat[cid] = (byCat[cid] || 0) + num(o.amount);
  });
  var out = round2(spent + bills.total);
  return {
    win:win, moneyIn:round2(moneyIn), confirmedIn:round2(confirmedIn),
    spent:round2(spent), bills:bills.total, moneyOut:out,
    kept:round2(confirmedIn - out), byCat:byCat, itemCount:itemCount
  };
}
function monthWindow(year, monthIdx){
  return {
    start:new Date(year, monthIdx, 1, 12,0,0,0),
    end:new Date(year, monthIdx, daysInMonth(year,monthIdx), 12,0,0,0),
    next:new Date(year, monthIdx+1, 1, 12,0,0,0)
  };
}

/* ============================================================
   Debt projection
   Explicit about: frequency conversion, interest timing, rounding,
   the shared extra-payment pool, and what happens when a payment
   cannot cover the modelled interest.
   ============================================================ */
var PERIODS_PER_YEAR = {monthly:12, fortnightly:26, weekly:52};
var MAX_PERIODS = 720;

/* strategy: "avalanche" | "snowball" | "custom" | "minimum".
   opts.extra is added to the monthly budget (never for "minimum"); opts.order is the custom order. */
function projectDebts(strategy, opts){
  opts = opts || {};
  var planExtra = strategy === "minimum" ? 0 : Math.max(0, num(opts.extra));
  var debts = state.debts.filter(function(d){ return currentDebtBalance(d) > 0; })
    .map(function(d){
      return {
        id:d.id, name:d.name,
        balance:currentDebtBalance(d),
        apr:Math.max(0, num(d.apr)),
        payment:Math.max(0, num(d.payment)),
        cadence:d.cadence || "monthly"
      };
    });
  if(!debts.length) return {ok:false, reason:"none", debts:[]};

  /* Everything is converted to a monthly budget so the two strategies
     are compared against the SAME amount of available money. */
  debts.forEach(function(d){
    var ppy = PERIODS_PER_YEAR[d.cadence] || 12;
    d.monthlyPayment = round2(d.payment * ppy / 12);
    d.monthlyRate = d.apr / 100 / 12;
    d.minInterest = round2(d.balance * d.monthlyRate);
  });
  var budget = round2(debts.reduce(function(s,d){ return s + d.monthlyPayment; }, 0) + planExtra);
  if(budget <= 0) return {ok:false, reason:"nopayment", debts:debts, budget:0};

  var order = debts.slice();
  if(strategy === "snowball") order.sort(function(a,b){ return a.balance - b.balance; });
  else if(strategy === "custom"){
    var rank = {}; (opts.order || []).forEach(function(id,i){ rank[id] = i; });
    order.sort(function(a,b){ var ra = rank[a.id] === undefined ? 1e6 : rank[a.id], rb = rank[b.id] === undefined ? 1e6 : rank[b.id];
      return ra - rb || b.apr - a.apr || a.balance - b.balance; });
  }
  else order.sort(function(a,b){ return b.apr - a.apr || a.balance - b.balance; });

  var sim = order.map(function(d){ return {ref:d, bal:d.balance, interest:0, clearedAt:null}; });
  var months = 0, totalInterest = 0, stalled = false;
  /* what's owed in total after each month: the payoff line on a chart */
  var series = [round2(sim.reduce(function(n, x){ return n + x.bal; }, 0))];

  while(months < MAX_PERIODS){
    var live = sim.filter(function(x){ return x.bal > 0.005; });
    if(!live.length) break;

    /* interest first, then payment — stated in the UI */
    var interestThisMonth = 0;
    live.forEach(function(x){
      var i = round2(x.bal * x.ref.monthlyRate);
      x.bal = round2(x.bal + i);
      x.interest = round2(x.interest + i);
      interestThisMonth += i;
    });
    totalInterest = round2(totalInterest + interestThisMonth);

    /* minimums to everything still owing, remainder to the target */
    var pool = budget;
    var target = live[0];
    live.forEach(function(x){
      if(x === target) return;
      var pay = Math.min(x.ref.monthlyPayment, x.bal, pool);
      x.bal = round2(x.bal - pay); pool = round2(pool - pay);
    });
    /* "minimum": each debt gets only its own payment, nothing rolls over */
    var pay = strategy === "minimum" ? Math.min(target.ref.monthlyPayment, target.bal, pool) : Math.min(pool, target.bal);
    target.bal = round2(target.bal - pay);
    pool = round2(pool - pay);
    /* money freed by a cleared debt rolls straight to the next one */
    if(pool > 0 && strategy !== "minimum"){
      for(var i=0;i<live.length;i++){
        if(pool <= 0) break;
        if(live[i].bal <= 0) continue;
        var extra = Math.min(pool, live[i].bal);
        live[i].bal = round2(live[i].bal - extra); pool = round2(pool - extra);
      }
    }
    months++;
    sim.forEach(function(x){ if(x.bal <= 0.005 && !x.clearedAt){ x.bal = 0; x.clearedAt = months; } });
    series.push(round2(sim.reduce(function(n, x){ return n + Math.max(0, x.bal); }, 0)));

    if(interestThisMonth >= budget - 0.005){ stalled = true; break; }
    if(strategy === "minimum" && live.every(function(x){ return x.bal > 0.005 && x.ref.monthlyPayment <= round2(x.bal * x.ref.monthlyRate); })){ stalled = true; break; }
  }

  var cleared = sim.every(function(x){ return x.bal <= 0.005; });
  return {
    ok:true, strategy:strategy, budget:budget, extra:planExtra,
    order: order.map(function(d){ return d.id; }),
    cleared:cleared, stalled:stalled || !cleared,
    months: cleared ? months : null,
    payoffDate: cleared ? addMonthsClamped(startOfToday(), months, startOfToday().getDate()) : null,
    totalInterest: round2(totalInterest),
    series: series,
    debts: sim.map(function(x){
      return {id:x.ref.id, name:x.ref.name, start:x.ref.balance, interest:x.interest,
              cleared:x.clearedAt !== null, months:x.clearedAt, remaining:round2(x.bal),
              coversInterest: x.ref.monthlyPayment > x.ref.balance * x.ref.monthlyRate};
    })
  };
}
/* ---------------- the payoff plan ----------------
   The extra goes on the debt the chosen plan is attacking, as part of its
   scheduled payment. So it shows in Bills, comes off safe to spend like any
   payment, and moves to the next debt once this one is cleared. */
function debtPlanProjection(strategy){
  var p = state.settings.debtPlan;
  return projectDebts(strategy || p.strategy, {extra:p.extra, order:p.order});
}
function debtPlanTarget(){
  var p = state.settings.debtPlan;
  if(p.strategy === "minimum" || !(p.extra > 0)) return null;
  var proj = debtPlanProjection();
  return proj.ok && proj.order && proj.order.length ? debtById(proj.order[0]) : null;
}
function planExtraPerPayment(d){
  var t = debtPlanTarget();
  if(!t || t.id !== d.id) return 0;
  return round2(state.settings.debtPlan.extra * 12 / (PERIODS_PER_YEAR[d.cadence] || 12));
}
function debtScheduledAmount(d){
  var pay = round2(num(d.payment)), extra = planExtraPerPayment(d);
  if(!extra) return pay;
  /* never schedule more than is left to clear */
  return round2(Math.max(pay, Math.min(pay + extra, currentDebtBalance(d))));
}
/* Only fills in what is missing or what the plan owns. A payment bill the buyer
   set up themselves is left alone until they save that debt again. */
function applyDebtPlan(){
  state.debts.forEach(function(d){
    var b = state.bills.filter(function(x){ return x.debtId === d.id; })[0];
    if(!b){ if(d.dueDay && num(d.payment) > 0) syncDebtSchedule(d); return; }
    if(b.autoFromDebt && Math.abs(num(b.amount) - debtScheduledAmount(d)) > 0.005) syncDebtSchedule(d);
  });
}

function syncDebtSchedule(d){
  var existing = null;
  state.bills.forEach(function(b){ if(b.debtId === d.id) existing = b; });
  if(!d.dueDay || !(num(d.payment) > 0)){
    /* no schedule any more: drop future unpaid occurrences we generated */
    if(existing && existing.autoFromDebt){
      var today0 = startOfToday().getTime();
      state.billOccs = state.billOccs.filter(function(o){
        return o.billId !== existing.id || o.paid || parseDate(o.dueDate).getTime() < today0;
      });
      state.bills = state.bills.filter(function(b){ return b.id !== existing.id; });
    }
    return;
  }
  var cadence = d.cadence === "weekly" ? "weekly" : (d.cadence === "fortnightly" ? "fortnightly" : "monthly");
  var today = startOfToday();
  var dim = daysInMonth(today.getFullYear(), today.getMonth());
  /* the first payment is the next one to come: a due day already past this month was paid, or is being dealt with */
  var anchorD = new Date(today.getFullYear(), today.getMonth(), Math.min(d.dueDay, dim), 12,0,0,0);
  if(anchorD.getTime() < today.getTime()) anchorD = addMonthsClamped(anchorD, 1, d.dueDay);
  var anchor = fmtISO(anchorD);

  if(existing){
    /* keep the buyer's own bill; only align what the debt owns */
    existing.amount = debtScheduledAmount(d);
    /* payments still to come follow the new amount; paid and skipped ones stay as they were */
    var todayISO = fmtISO(today);
    state.billOccs.forEach(function(o){
      if(o.billId === existing.id && !o.paid && !o.skipped && o.dueDate >= todayISO) o.amount = existing.amount;
    });
    if(existing.autoFromDebt){ existing.cadence = cadence; existing.anchorDate = anchor; existing.name = d.name + " payment"; }
    materialiseBills();
    return;
  }
  var b = normBill({id:uid(), name:d.name + " payment", amount:debtScheduledAmount(d),
                    cadence:cadence, anchorDate:anchor, debtId:d.id});
  b.autoFromDebt = true;
  state.bills.push(b);
  materialiseBills();
}

/* Counted from a point in the record sequence rather than a date, so
   correcting the balance on the same day as a charge cannot add it twice. */
function currentDebtBalance(d){
  var openingSeq = num(d.openingSeq);
  /* a loan, or a card whose charges are not tracked: it goes down by the payments
     marked paid since the balance was last typed in. Interest is not added here,
     so the statement figure stays the one to trust. */
  if(!(d.activeCard && d.trackCharges && d.accountId)){
    if(!d.payDown) return round2(num(d.balance));
    var left = num(d.openingBalance);
    state.transactions.forEach(function(t){ if(t.seq > openingSeq && t.cardPaymentFor === d.id) left -= num(t.amount); });
    return round2(Math.max(0, left));
  }
  var bal = num(d.openingBalance);
  state.transactions.forEach(function(t){
    if(t.seq <= openingSeq) return;
    if(t.kind === "cardcharge" && t.accountId === d.accountId) bal += num(t.amount);
    if(t.cardPaymentFor === d.id) bal -= num(t.amount);
  });
  return round2(Math.max(0, bal));
}

/* ============================================================
   Goals
   ============================================================ */
function goalPace(g){
  /* a completion date needs a real contribution pace — never invented */
  var hist = (g.history || []).slice().sort(function(a,b){ return parseDate(a.date)-parseDate(b.date); });
  if(hist.length < 2) return {ok:false, reason:hist.length ? "one" : "none"};
  var first = parseDate(hist[0].date), last = parseDate(hist[hist.length-1].date);
  var span = Math.max(1, dayDiff(first,last));
  var total = hist.reduce(function(s,h){ return s + num(h.amount); }, 0);
  if(span < 14) return {ok:false, reason:"short"};
  var perMonth = round2(total / span * 30.44);
  if(perMonth <= 0) return {ok:false, reason:"flat"};
  var left = Math.max(0, round2(num(g.target) - num(g.saved)));
  var months = Math.ceil(safeDiv(left, perMonth));
  if(!isFinite(months) || months <= 0) return {ok:true, perMonth:perMonth, months:0, date:startOfToday(), payments:0};
  if(months > 600) return {ok:false, reason:"slow", perMonth:perMonth};
  return {ok:true, perMonth:perMonth, months:months,
          date:addMonthsClamped(startOfToday(), months, startOfToday().getDate()),
          payments:months};
}

/* ============================================================
   Milestones — derived from the file, evidence kept, never a score
   ============================================================ */
function distinctEntryDays(){
  var seen = {};
  state.transactions.forEach(function(t){ seen[t.date] = true; });
  return Object.keys(seen);
}
function completedMonths(){
  var today = startOfToday();
  var months = {};
  state.transactions.forEach(function(t){ months[t.date.slice(0,7)] = true; });
  state.income.forEach(function(x){ months[x.date.slice(0,7)] = true; });
  state.billOccs.forEach(function(o){ months[o.dueDate.slice(0,7)] = true; });
  var cur = fmtISO(today).slice(0,7);
  return Object.keys(months).filter(function(m){ return m < cur; }).sort();
}
function monthIdxFromKey(key){
  var p = key.split("-");
  return {y:+p[0], m:(+p[1])-1};
}

function deriveMilestones(){
  var out = [];
  var today = startOfToday();

  function add(key, name, desc, art, reached, progress, evidence, unknownReason){
    out.push({key:key, name:name, desc:desc, art:art,
              reached:!!reached, progress:progress||"", evidence:evidence||"",
              unknown: !reached && !!unknownReason, unknownReason:unknownReason||""});
  }

  /* 1 — first spend written down */
  var firstTxn = state.transactions.slice().sort(function(a,b){ return parseDate(a.date)-parseDate(b.date); })[0];
  add("first-spend","First spend written down",
      "the hardest one. everything else is just this again.","sprout",
      !!firstTxn, firstTxn ? "" : "nothing added yet",
      firstTxn ? firstTxn.date : "");

  /* 2 — seven days written down, never has to be in a row */
  var days = distinctEntryDays();
  add("seven-days","Seven days written down",
      "seven separate days with something on them. they never had to be in a row.","sun",
      days.length >= 7, days.length + " of 7",
      days.length >= 7 ? days.sort()[6] : "");

  /* 3 — every bill covered before a payday */
  var per = coveredPeriods();
  add("bills-covered","Every bill covered before payday",
      "one whole pay period where nothing was left outstanding.","envelope",
      per.covered.length > 0, per.covered.length ? (per.covered.length + " so far") : (per.eligible ? "not yet" : ""),
      per.covered.length ? per.covered[0] : "",
      per.eligible ? "" : "not counted yet — no pay period has finished in this file");

  /* 4 — a day without spending (needs a closed day: no entry is not evidence) */
  var noSpend = state.dayCloses.filter(function(d){
    if(hasReportingGap({start:parseDate(d),end:parseDate(d)})) return false;
    return !state.transactions.some(function(t){ return t.date === d && !t.cardPaymentFor && num(t.amount) > 0; });
  }).sort();
  add("no-spend-day","A day without spending",
      "a day you closed with nothing spent. you told the planner — it did not guess.","jar",
      noSpend.length > 0, noSpend.length ? (noSpend.length + " so far") : "",
      noSpend.length ? noSpend[0] : "",
      noSpend.length ? "" : (state.dayCloses.length ? "" : "not counted yet — an empty day is not proof. close a day to record one"));

  /* 5 — a month with every bill ticked off */
  var monthsDone = completedMonths();
  var allBillMonths = monthsDone.filter(function(mk){
    var occ = state.billOccs.filter(function(o){ return o.dueDate.slice(0,7) === mk && !o.skipped; });
    return occ.length > 0 && occ.every(function(o){ return o.paid; });
  });
  add("month-all-bills","A month with every bill ticked off",
      "every bill that fell due that month, marked paid.","envelope",
      allBillMonths.length > 0, allBillMonths.length ? (allBillMonths.length + " so far") : "",
      allBillMonths.length ? allBillMonths[0] : "",
      monthsDone.length ? "" : "not counted yet — no month has finished in this file");

  /* 6 + 7 — need real income evidence, never awarded from missing data */
  var blackMonths = [], fifthMonths = [], evidenceMonths = 0;
  monthsDone.forEach(function(mk){
    var coverage = monthIdxFromKey(mk);
    if(hasReportingGap(monthWindow(coverage.y,coverage.m))) return;
    var mi = monthIdxFromKey(mk);
    var sum = summariseWindow(monthWindow(mi.y, mi.m));
    if(sum.confirmedIn <= 0) return;            /* no income recorded: prove nothing */
    evidenceMonths++;
    if(sum.kept > 0) blackMonths.push(mk);
    if(sum.kept >= sum.confirmedIn * 0.2) fifthMonths.push(mk);
  });
  add("month-in-black","A month that ended in the black",
      "more came in than went out, across a whole month.","sun",
      blackMonths.length > 0, blackMonths.length ? (blackMonths.length + " so far") : "",
      blackMonths.length ? blackMonths[0] : "",
      evidenceMonths ? "" : "not counted yet — no finished month has income recorded in it");
  add("month-fifth-kept","A month where a fifth stayed",
      "you kept at least a fifth of what came in.","jar",
      fifthMonths.length > 0, fifthMonths.length ? (fifthMonths.length + " so far") : "",
      fifthMonths.length ? fifthMonths[0] : "",
      evidenceMonths ? "" : "not counted yet — no finished month has income recorded in it");

  /* 8 — a savings goal reached in full */
  var doneGoal = state.goals.filter(function(g){ return num(g.target) > 0 && num(g.saved) >= num(g.target); });
  var nearest = state.goals.filter(function(g){ return num(g.target) > 0; })
    .sort(function(a,b){ return (num(a.target)-num(a.saved)) - (num(b.target)-num(b.saved)); })[0];
  add("goal-reached","A savings goal reached in full",
      "all the way to the number you picked.","jar",
      doneGoal.length > 0,
      doneGoal.length ? (doneGoal.length + " reached") : (nearest ? (money(Math.max(0,num(nearest.target)-num(nearest.saved))) + " to go") : ""),
      doneGoal.length ? doneGoal[0].name : "",
      state.goals.length ? "" : "not counted yet — no goal set");

  /* auto money milestones across goals */
  var saved = round2(state.goals.reduce(function(s,g){ return s + num(g.saved); }, 0));
  [1000,2500,5000].forEach(function(step){
    add("saved-"+step, money(step) + " set aside",
        "across every goal in this file.","sprout",
        saved >= step,
        saved >= step ? "" : (money(round2(step - saved)) + " to go"),
        saved >= step ? fmtISO(today) : "");
  });

  out=out.concat(challengeMilestones());
  /* attach earned dates from the evidence log; log anything newly reached */
  var logged = {};
