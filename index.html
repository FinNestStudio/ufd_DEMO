  return out;
}
function paySplitHTML(){
  var pay = usualPay(), s = splitNow();
  var used = round2(SPLIT_PARTS.reduce(function(n, p){ return n + s[p[0]]; }, 0)), left = round2(pay - used);
  var when = {weekly:"week", biweekly:"two weeks", fortnightly:"two weeks", semimonthly:"half month"}[state.settings.cycle] || "month";
  var bar = pay > 0 ? SPLIT_PARTS.map(function(p, i){ var w = Math.max(0, s[p[0]] / Math.max(pay, used) * 100); return w > 0 ? '<span class="ps-' + p[0] + '" style="width:' + w.toFixed(2) + '%" title="' + escapeHTML(p[2] + ": " + money(s[p[0]])) + '"></span>' : ''; }).join("")
    + (left > 0 ? '<span class="ps-left" style="width:' + (left / pay * 100).toFixed(2) + '%" title="Left for you"></span>' : '') : '';
  return '<section class="card span12" id="paySplit" aria-labelledby="psTitle"><div class="card-head"><h2 id="psTitle">Split my pay</h2><span class="muted num">' + (pay > 0 ? escapeHTML(money(pay)) + ' each ' + when : 'Set your usual pay in Settings') + '</span></div>'
    + (pay > 0 ? '<div class="ps-bar" aria-hidden="true">' + bar + '</div>' : '')
    + '<div class="ps-parts">' + SPLIT_PARTS.map(function(p){
        return '<label class="ps-part"><span class="ps-dot ps-' + p[0] + '" aria-hidden="true"></span><span class="ps-n">' + p[1] + ' ' + escapeHTML(p[2]) + (s[p[0] + "Own"] ? '' : ' <span class="hint">suggested</span>') + '</span>'
          + '<input class="input num sm" data-split="' + p[0] + '" inputmode="decimal" value="' + s[p[0]].toFixed(2) + '" aria-label="' + escapeHTML(p[2]) + ' each ' + when + '"></label>';
      }).join("") + '</div>'
    + '<div class="ps-left-line ' + (left < 0 ? 'warn' : '') + '">' + (pay > 0 ? (left >= 0 ? '<b class="num">' + escapeHTML(money(left)) + '</b> left for you, or to give a job' : 'That’s <b class="num">' + escapeHTML(money(-left)) + '</b> more than your pay. Something has to give.') : '') + '</div>'
    + (!s.spendOwn && splitSuggest().spendPlans > s.spend + 0.5 ? '<p class="hint">Your category plans add up to ' + escapeHTML(money(splitSuggest().spendPlans)) + ' a ' + when + '; after the fixed parts, ' + escapeHTML(money(s.spend)) + ' is what this pay leaves for them.</p>' : '')
    + '<p class="hint">A plan for each payday, like envelopes. It doesn’t move money or change safe to spend. <button type="button" class="link" data-act="split-reset">Use the suggestions</button></p></section>';

/* ============================================================
   MORE MONEY IN AND OUT, from V2 and the ADHD Planner:
     - money coming in on its own schedule (a second job, a partner's
       pay, benefits): it shows in Repeats, the calendar and the
       forecast, and one tap says it's in;
     - bills that go out by themselves: marked paid on the due date;
     - cancelling a subscription, and what it saves a year;

   ============================================================ */
function incomeSources(){ if(!Array.isArray(state.v3Incomes)) state.v3Incomes = []; return state.v3Incomes; }

function srcDates(src, fromISO, untilISO){
  var out = [], d = parseDate(src.anchorDate), guard = 0;

    var iso = fmtISO(d);
    if(iso >= fromISO) out.push(iso);
    d = src.how === "weekly" ? addDays(d, 7) : src.how === "fortnightly" ? addDays(d, 14) : src.how === "semimonthly" ? semimonthlyAfter(d, parseDate(src.anchorDate))
      : addMonthsClamped(d, src.how === "q" ? 3 : src.how === "y" ? 12 : 1, day);

  return out;
}
/* twice a month on the pattern of its first date: the 15th and the last day, the 1st and the 15th, or the day and 15 later */
function semimonthlyAfter(d, anchor){
  var pattern = semimonthlyPattern(anchor, "auto"), dates = [];
  for(var k = 0; k < 3; k++){ var m = new Date(d.getFullYear(), d.getMonth() + k, 1, 12); dates = dates.concat(semimonthlyDatesForMonth(m.getFullYear(), m.getMonth(), pattern)); }

}

};

  state.bills.forEach(function(b){

    state.billOccs.forEach(function(o){

      var acct = accountById(b.accountId) || includedAccounts()[0] || state.accounts[0]; if(!acct) return;
      var chk = latestCheck(acct.id), inCheck = chk && stampDay(chk.at) >= o.dueDate ? true : null;
      var t = normTxn({amount:o.amount, categoryId:b.categoryId || null, note:o.name, date:o.dueDate, accountId:acct.id, billOccId:o.id, kind:"expense", includedInCheck:inCheck, v3Auto:true}, {next:nextSeq, defaultAccount:acct.id});
      if(b.debtId) t.cardPaymentFor = b.debtId;

      o.paid = true; o.paidTxnId = t.id; o.paidOn = o.dueDate; o.generated = true; done++;

var GOAL_EMOJIS = ["🌱","🛟","🌴","🏠","🚗","🎓","💍","👶","🎁","✈️","💻","🐾","🎸","🏖️","🩺","💶"];

function goalLeft(g){ return round2(Math.max(0, num(g.target) - num(g.saved))); }
function goalMonths(g, monthly){ var left = goalLeft(g); return left <= 0 ? 0 : monthly > 0 ? Math.ceil(left / monthly - 1e-9) : null; }
/* up to the whole remainder in one month, so any real plan fits on the slider */
function goalSliderMax(g){ var left = goalLeft(g), u = moneyUnit(); return Math.max(200 * u, Math.ceil(Math.max(left, num(g.v3Monthly), 1) / (50 * u)) * 50 * u); }
function finishText(g, monthly){
  var m = goalMonths(g, monthly);
  if(m === 0) return {when:"Done", sub:"You’ve reached it."};
  if(m === null) return {when:"—", sub:"Drag to see when you’ll get there."};
  var d = addMonthsClamped(startOfToday(), m, startOfToday().getDate());
  return {when:MONTH_ABBR[d.getMonth()] + " " + d.getFullYear(), sub:"in " + monthsText(m)};
}
function monthsText(m){ return m >= 24 ? (Math.round(m / 12 * 10) / 10) + " years" : m + (m === 1 ? " month" : " months"); }
/* what a date-bound goal needs each month to make it */
function neededMonthly(g){
  if(!g.dueDate || goalLeft(g) <= 0) return null;
  var months = Math.max(1, (parseDate(g.dueDate).getFullYear() - startOfToday().getFullYear()) * 12 + parseDate(g.dueDate).getMonth() - startOfToday().getMonth());
  return round2(goalLeft(g) / months);
}

function moveGoalMoney(g, delta){

/* ============================================================
   GOALS, THE REST OF V2
     - The safety net (V2's emergency-fund check): your average month
       of spending, times the months you pick, against what your
       emergency goal holds. One tap makes or updates the goal.
     - A top-priority goal: it's listed first and marked with a star.
   ============================================================ */
function avgMonthOut(){
  /* the last six full months that have anything in them; none yet: this month's plans */
  var t = startOfToday(), outs = [];
  for(var i = 1; i <= 6; i++){
    var d = new Date(t.getFullYear(), t.getMonth() - i, 1, 12), v = {y:d.getFullYear(), m:d.getMonth()};
    var f = monthFlow(v, monthNumbers(v.y, v.m)); if(f.out > 0) outs.push(f.out);
  }
  if(outs.length) return {v:round2(outs.reduce(function(a, b){ return a + b; }, 0) / outs.length), from:outs.length + (outs.length === 1 ? " month" : " months")};
  var planned = state.categories.reduce(function(n, c){ return n + monthlyPlan(c); }, 0) + state.bills.reduce(function(n, b){ return n + perMonth(b); }, 0);
  return {v:round2(planned), from:"your plans"};
}
function netGoal(){
  return state.goals.filter(function(g){ return g.v3Emergency; })[0] || state.goals.filter(function(g){ return /emergenc|safety|rainy|buffer|noodfonds|notgroschen/i.test(g.name); })[0] || null;
}

  if(!(avg.v > 0)) return "";
  var saved = g ? num(g.saved) : 0, pct = target > 0 ? Math.round(clamp(saved / target * 100, 0, 100)) : 0, cover = avg.v > 0 ? saved / avg.v : 0;

  return '<section class="card span12 safety-net" id="safetyNet" aria-labelledby="snTitle"><div class="card-head"><h2 id="snTitle">Safety net</h2>'
    + '<label class="sn-months">Cover <select class="select sm" id="efMonths" aria-label="Months to cover">' + [1,2,3,4,6,9,12].map(function(n){ return '<option value="' + n + '"' + (n === months ? ' selected' : '') + '>' + n + (n === 1 ? ' month' : ' months') + '</option>'; }).join("") + '</select></label></div>'

function planStrategy(){ var s = state.settings.debtPlan.strategy; return PLAN_INFO[s] ? s : "avalanche"; }

function debtSliderMax(extra){ var budget = projectDebts("minimum").budget || 0, u = moneyUnit(); return Math.max(250 * u, Math.ceil(Math.max(extra * 1.5, budget) / (50 * u)) * 50 * u); }

/* ============================================================

     - Snowball and Avalanche side by side: the date and the interest

}
function compareHTMLDebt(){

  var ok = opts.filter(function(o){ return o.p.ok && o.p.cleared; });

/* ============================================================

var OWN_TYPES = [["home","🏠","Home"],["car","🚗","Car"],["invest","📈","Investments"],["pension","🧓","Pension"],["cash","💶","Cash"],["other","✨","Something else"]];

/* V3's own data, checked every time it is read: it arrives from saved files and backups */
function worthData(){
  var w = state.v3Worth && typeof state.v3Worth === "object" ? state.v3Worth : {};
  var items = Array.isArray(w.items) ? w.items.filter(function(x){ return x && typeof x === "object"; }).map(function(x){
    var own = x.side !== "owe";
    var types = own ? OWN_TYPES : OWE_TYPES;
    return {id:typeof x.id === "string" ? x.id : uid(), side:own ? "own" : "owe", type:types.some(function(t){ return t[0] === x.type; }) ? x.type : "other",
      name:typeof x.name === "string" && x.name.trim() ? x.name.trim().slice(0, 40) : (own ? "Something I own" : "Something I owe"), value:Math.max(0, round2(num(x.value)))};
  }) : [];
  var history = Array.isArray(w.history) ? w.history.filter(function(h){ return h && /^\d{4}-\d{2}$/.test(h.month); }).map(function(h){
    return {month:h.month, own:round2(num(h.own)), owe:round2(num(h.owe))};
  }) : [];
  state.v3Worth = {items:items, history:history};

}

function worthTotals(){
  var w = worthData(), own = 0, owe = 0;
  state.accounts.forEach(function(a){ if(a.archived || a.kind === "card") return; var v = cashAtToday(a.id); if(v !== null) own += v; });
  state.debts.forEach(function(d){ owe += currentDebtBalance(d); });
  w.items.forEach(function(x){ if(x.side === "own") own += x.value; else owe += x.value; });
  return {own:round2(own), owe:round2(owe), net:round2(own - owe)};
}

function snapshotWorth(){

  w.history.sort(function(a, b){ return a.month < b.month ? -1 : 1; });
  if(w.history.length > 120) w.history = w.history.slice(-120);
}

/* The protected floor: what Today keeps out of safe to spend besides bills (your buffer, goal
   money, pots and debt money due after payday). Today and Forecast measure against the same euros. */
function protectedFloor(c){
  if(!c || !c.ok) return {total:round2(num(state.settings.buffer)), buffer:round2(num(state.settings.buffer)), aside:0};
  var get = function(k){ var l = c.lines.filter(function(x){ return x.key === k; })[0]; return l ? Math.max(0, -num(l.amount)) : 0; };
  var buffer = get("buffer"), aside = round2(get("reserve") + get("envelopes") + get("debtlater"));
  return {total:round2(buffer + aside), buffer:buffer, aside:aside};
}
function floorWords(f){ return f.aside > 0 ? moneyShort(f.buffer) + " buffer + " + moneyShort(f.aside) + " set aside" : "your " + moneyShort(f.buffer) + " buffer"; }

/* the model behind both Today's card and this screen */
function forecastModel(days, c){
  var start = 0, any = false, today = fmtISO(startOfToday());
  includedAccounts().forEach(function(a){ var v = cashAtToday(a.id); if(v !== null){ start += v; any = true; } });
  if(!any) return null;
  var events = [];
  state.billOccs.forEach(function(o){
    if(o.paid || o.skipped || occPaidOutside(o)) return;   /* paid from an account outside safe to spend */
    var b = billById(o.billId);
    events.push({iso:o.dueDate < today ? today : o.dueDate, name:o.name, amount:-num(o.amount), kind:b && b.debtId ? "debt" : b && b.v3Type === "subscription" ? "sub" : "bill", overdue:o.dueDate < today});
  });
  expectedPay(days).forEach(function(p){ events.push({iso:p.date < today ? today : p.date, name:p.label, amount:p.amount, kind:"pay"}); });
  /* everyday spending: today's safe pace until payday, then your usual pace from the last 60 days */
  /* Your usual pace, from days you actually tracked: a day you didn't write anything down
     isn't a day you spent nothing. Too little history: your category plans instead. */
  var usual = 0, tracked = {}, from = fmtISO(addDays(startOfToday(), -60));
  state.transactions.forEach(function(t){ if(t.date >= from && t.date < today){ tracked[t.date] = 1; if(!t.billOccId && !t.cardPaymentFor && t.kind !== "cardcharge" && countsInSafe(t.accountId)) usual += Math.max(0, num(t.amount)); } });
  state.dayCloses.forEach(function(d){ if(d >= from && d < today) tracked[d] = 1; });
  var trackedDays = Object.keys(tracked).length, planned = state.categories.reduce(function(n, x){ return n + monthlyPlan(x); }, 0);
  var usualFrom = trackedDays >= 14 ? "tracked" : planned > 0 ? "plan" : "tracked";
  usual = usualFrom === "plan" ? round2(planned * 12 / 365) : round2(usual / Math.max(1, trackedDays));
  /* the exact pace (not rounded to cents), so following the plan lands exactly on the floor */
  var payISO = c && c.ok ? fmtISO(c.payday) : null, pace = c && c.ok ? Math.max(0, c.available) / Math.max(1, c.days) : usual;
  var pts = [], bal = start, byDay = {};
  events.forEach(function(e){ (byDay[e.iso] = byDay[e.iso] || []).push(e); });
  for(var i = 0; i <= days; i++){
    var iso = fmtISO(addDays(startOfToday(), i)), dayEvents = byDay[iso] || [];
    dayEvents.forEach(function(e){ bal = round2(bal + e.amount); e.after = bal; });
    /* each point is the end of that day, after spending at the planned pace (today included),
       so following Today's plan lands exactly on the protected floor the day before payday */
    bal = round2(bal - (payISO && iso < payISO ? pace : usual));
    pts.push({iso:iso, v:bal, events:dayEvents});
  }
  events = events.filter(function(e){ return e.iso <= fmtISO(addDays(startOfToday(), days)); }).sort(function(a, b){ return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : a.amount - b.amount; });
  return {pts:pts, events:events, start:round2(start), pace:pace, usual:usual, usualFrom:usualFrom, trackedDays:trackedDays, floor:protectedFloor(c), payISO:payISO};
}

function monthNumbers(y, m){
  var win = monthWindow(y, m), s = summariseWindow(win), by = spendByCategory(win);
  var everyday = round2(Object.keys(by).reduce(function(n, k){ return n + by[k]; }, 0));
  var bills = round2(state.transactions.reduce(function(n, t){ return t.billOccId && inWindow(t.date, win) && !isTrackedCardBillOccurrence(occById(t.billOccId)) ? n + num(t.amount) : n; }, 0)
    + state.billOccs.reduce(function(n, o){ return o.paid && !o.paidTxnId && inWindow(o.dueDate, win) && !isTrackedCardBillOccurrence(o) ? n + num(o.amount) : n; }, 0));
  return {win:win, moneyIn:s.confirmedIn, everyday:everyday, bills:bills, out:round2(everyday + bills), kept:round2(s.confirmedIn - everyday - bills), by:by, gap:hasReportingGap(win)};
}

/* The Financial Health score: five parts of 20. Each says what it rewards, in plain words.
   "Kept up" rewards coming back, not perfect streaks. */
function healthScore(){
  var t = startOfToday(), now = monthNumbers(t.getFullYear(), t.getMonth()), last = monthNumbers(t.getMonth() ? t.getFullYear() : t.getFullYear() - 1, (t.getMonth() + 11) % 12);
  var base = last.moneyIn > 0 ? last : now;                         /* a full month when there is one */
  var lm = (t.getMonth() + 11) % 12, basedOn = base === last ? MONTH_NAMES[lm] + ", your last full month" : "this month so far";
  var parts = [];
  var rate = base.moneyIn > 0 ? (base.moneyIn - base.out) / base.moneyIn : null;
  parts.push({k:"Cash flow", v:rate === null ? 10 : 20 * clamp(rate / 0.2, 0, 1), tip:rate === null ? "Log your pay to see this." : "You kept " + Math.round(rate * 100) + "% of what came in. 20% or more scores full."});
  var cushion = 0; state.accounts.forEach(function(a){ if(a.kind === "savings" && !a.archived){ var v = cashAtToday(a.id); if(v) cushion += v; } });
  var monthlyOut = Math.max(1, base.out || now.out), months = cushion / monthlyOut;
  parts.push({k:"Savings cushion", v:20 * clamp(months / 3, 0, 1), tip:"Savings would cover about " + (Math.round(months * 10) / 10) + " months of spending. 3 months scores full."});
  var owed = state.debts.reduce(function(n, d){ return n + currentDebtBalance(d); }, 0);
  var pay = state.debts.reduce(function(n, d){ return n + num(d.payment) * ({weekly:52, fortnightly:26}[d.cadence] || 12) / 12; }, 0);
  var dti = base.moneyIn > 0 ? pay / base.moneyIn : (owed > 0 ? 1 : 0);
  parts.push({k:"Debt", v:owed > 0 ? 20 * clamp(1 - dti / 0.4, 0, 1) : 20, tip:owed > 0 ? "Debt payments take " + Math.round(dti * 100) + "% of your pay. Under 10% scores near full." : "Nothing owed. Full marks."});
  var from = fmtISO(addDays(t, -60)), today = fmtISO(t), due = state.billOccs.filter(function(o){ return !o.skipped && o.dueDate >= from && o.dueDate < today; });
  var onTime = due.filter(function(o){ return o.paid; }).length, late = due.filter(function(o){ return o.paid && o.paidOn && o.paidOn > o.dueDate; }).length;
  parts.push({k:"Bills ticked off", v:due.length ? 20 * onTime / due.length : 20, tip:due.length ? onTime + " of " + due.length + " bills from the last 60 days are ticked off" + (late ? ", " + late + " after the due date." : ".") : "No bills were due yet."});
  var days = {};
  state.transactions.forEach(function(x){ if(dayDiff(parseDate(x.date), t) < 30 && x.date <= today) days[x.date] = 1; });
  state.balanceChecks.forEach(function(c){ var d = stampDay(c.at); if(dayDiff(parseDate(d), t) < 30) days[d] = 1; });
  state.dayCloses.forEach(function(d){ if(dayDiff(parseDate(d), t) < 30) days[d] = 1; });
  var active = Object.keys(days).length;
  parts.push({k:"Kept up", v:20 * clamp(active / 12, 0, 1), tip:"You showed up on " + active + " of the last 30 days. 12 scores full, and coming back always counts."});
  parts.forEach(function(p){ p.v = Math.round(p.v); });
  var score = parts.reduce(function(n, p){ return n + p.v; }, 0);
  return {score:score, parts:parts, basedOn:basedOn, label:score >= 80 ? "Strong" : score >= 60 ? "Healthy" : score >= 40 ? "Getting there" : "Needs some care"};
}
function ringSVG(score, size){
  var R = 46, C = 2 * Math.PI * R;
  return '<svg viewBox="0 0 110 110" width="' + size + '" height="' + size + '" aria-hidden="true"><circle cx="55" cy="55" r="' + R + '" fill="none" stroke="var(--track)" stroke-width="10"/>'
    + '<circle cx="55" cy="55" r="' + R + '" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - score / 100)).toFixed(1) + '" transform="rotate(-90 55 55)"/>'
    + '<text x="55" y="61" text-anchor="middle" class="ring-num">' + score + '</text></svg>';
}

RENDER.reviews = function(){
  var v = viewedRevMonth(), t = startOfToday(), isNow = v.y === t.getFullYear() && v.m === t.getMonth();

/* mid-month, pay often hasn't landed yet: say so instead of looking "short" */
function expectedInNote(v){
  var end = fmtISO(new Date(v.y, v.m, daysInMonth(v.y, v.m), 12)), due = expectedPay(dayDiff(startOfToday(), parseDate(end))).filter(function(p){ return p.date <= end; });
  if(!due.length) return '';
  var sum = round2(due.reduce(function(n, p){ return n + p.amount; }, 0));
  return '<p class="hint" style="margin-top:10px">Still to come this month: ' + escapeHTML(moneyShort(sum)) + ' pay on ' + escapeHTML(due.map(function(p){ return shortDateLabel(parseDate(p.date)); }).join(", ")) + '.</p>';
}
function barPct(v, max){ return max > 0 ? Math.round(clamp(v / max * 100, 0, 100)) : 0; }
function highlightsHTML(v, cur){
  var list = [], cats = Object.keys(cur.by).filter(function(k){ return k !== "__none"; }).sort(function(a, b){ return cur.by[b] - cur.by[a]; });
  if(cats.length){ var c = categoryById(cats[0]); if(c) list.push(["🏆", "Most went on " + c.name, moneyShort(cur.by[cats[0]])]); }
  var big = null;
  state.transactions.forEach(function(t){ if(!t.billOccId && !t.cardPaymentFor && inWindow(t.date, cur.win) && (!big || num(t.amount) > num(big.amount))) big = t; });
  if(big) list.push(["🧾", "Biggest purchase: " + (big.note || (categoryById(big.categoryId) || {}).name || "spending"), moneyShort(big.amount)]);
  var dim = daysInMonth(v.y, v.m), last = (v.y === startOfToday().getFullYear() && v.m === startOfToday().getMonth()) ? startOfToday().getDate() - 1 : dim, quiet = 0;
  for(var d = 1; d <= last; d++){ if(!spendOnDay(fmtISO(new Date(v.y, v.m, d, 12)))) quiet++; }
  list.push(["🌿", "Days with nothing spent", String(quiet)]);
  var planned = plannedMonth(v.y, v.m);
  if(planned > 0) list.push([cur.everyday <= planned ? "✅" : "⚠️", cur.everyday <= planned ? "Everyday spending within the plan" : "Everyday spending over the plan", moneyShort(cur.everyday) + " / " + moneyShort(planned)]);
  return '<ul class="highlights">' + list.map(function(x){ return '<li><span aria-hidden="true">' + x[0] + '</span><span>' + escapeHTML(x[1]) + '</span><b class="num">' + escapeHTML(x[2]) + '</b></li>'; }).join("") + '</ul>';
}
function compareHTML(cur, prev){
  var rows = state.categories.map(function(c){ return {c:c, a:round2(cur.by[c.id] || 0), b:round2(prev.by[c.id] || 0)}; }).filter(function(r){ return r.a || r.b; }).sort(function(x, y){ return (y.a + y.b) - (x.a + x.b); });
  if(!rows.length) return '<p class="empty">Nothing to compare yet.</p>';
  var max = Math.max.apply(null, rows.map(function(r){ return Math.max(r.a, r.b); }));
  return '<div class="compare">' + rows.map(function(r){
    var diff = round2(r.a - r.b);
    return '<div class="cmp"><div class="cmp-top"><span>' + escapeHTML(r.c.emoji + " " + r.c.name) + '</span><span class="num ' + (diff > 0 ? 'more' : 'less') + '">' + (diff === 0 ? "same" : (diff > 0 ? "+" : "−") + escapeHTML(moneyShort(Math.abs(diff)))) + '</span></div>'
      + '<i style="width:' + barPct(r.a, max) + '%;background:var(--accent)"></i><i style="width:' + barPct(r.b, max) + '%;background:var(--line2)"></i></div>';
  }).join("") + '</div>';
}
function yearHTML(){
  var t = startOfToday(), months = [];
  for(var i = 11; i >= 0; i--){ var d = new Date(t.getFullYear(), t.getMonth() - i, 1, 12); var n = monthNumbers(d.getFullYear(), d.getMonth()); months.push({d:d, i:n.moneyIn, o:n.out}); }
  var max = Math.max.apply(null, months.map(function(x){ return Math.max(x.i, x.o); }).concat([1]));
  return '<div class="year" role="img" aria-label="Money in and out for the last 12 months">' + months.map(function(x){
    return '<div class="ym" title="' + escapeHTML(MONTH_NAMES[x.d.getMonth()] + ": in " + moneyShort(x.i) + ", out " + moneyShort(x.o)) + '"><div class="ybars"><i style="height:' + barPct(x.i, max) + '%;background:var(--good)"></i><i style="height:' + barPct(x.o, max) + '%;background:var(--outc)"></i></div><small>' + MONTH_ABBR[x.d.getMonth()].slice(0, 1) + '</small></div>';
  }).join("") + '</div>';
}

/* ============================================================
   CHARTS THAT TELL THE STORY
     - scrubbing: drag a finger (or the mouse, or the arrow keys)
       along any line chart and it reads out the date and amount;
     - where the money went: a flow from money in to bills, debt,
       everyday spending and what was left, then on to categories;
     - how the month added up: a waterfall from money in to left over;
     - the debt payoff line, which bends as you drag the slider;
     - goal jars that fill up and settle.
   Every chart has a sentence for screen readers and a table to open.
   ============================================================ */
var SCRUB = {}, scrubSeq = 0;
/* a line chart registers its points; the page wires the finger to it */
function scrubAttr(o){
  var id = "s" + (++scrubSeq); SCRUB[id] = o;
  var keys = Object.keys(SCRUB); if(keys.length > 40) delete SCRUB[keys[0]];
  return ' data-scrub="' + id + '" tabindex="0"';
}
function wireScrubs(scope){
  Array.prototype.forEach.call(scope.querySelectorAll("svg[data-scrub]"), function(svg){
    if(svg.__wired) return; svg.__wired = true;
    var o = SCRUB[svg.getAttribute("data-scrub")]; if(!o) return;
    var box = svg.parentNode; if(getComputedStyle(box).position === "static") box.style.position = "relative";
    var line = document.createElement("i"), dot = document.createElement("i"), tip = document.createElement("div");
    line.className = "scrub-line"; dot.className = "scrub-dot"; tip.className = "scrub-tip"; tip.setAttribute("aria-live", "polite");
    [line, dot, tip].forEach(function(x){ x.hidden = true; box.appendChild(x); });
    var idx = null;
    var show = function(i){
      i = Math.max(0, Math.min(o.values.length - 1, i)); idx = i;
      var sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect(), n = o.values.length - 1;
      var x = sr.left - br.left + (n ? i / n : 0) * sr.width * (o.W / o.VW);
      var y = sr.top - br.top + (o.max - o.values[i]) / (o.max - o.min || 1) * o.H / o.VH * sr.height;
      line.style.left = x + "px"; line.style.top = (sr.top - br.top) + "px"; line.style.height = (o.H / o.VH * sr.height) + "px";
      dot.style.left = x + "px"; dot.style.top = y + "px";
      tip.innerHTML = '<span>' + escapeHTML(o.labels[i]) + '</span><b class="num">' + escapeHTML((o.fmt || moneyShort)(o.values[i])) + '</b>'
        + (o.alt && o.alt[i] !== undefined && o.alt[i] !== o.values[i] ? '<small>' + escapeHTML(o.altName || "If you did") + ' ' + escapeHTML(moneyShort(o.alt[i])) + '</small>' : '');
      [line, dot, tip].forEach(function(x){ x.hidden = false; });
      var tw = tip.offsetWidth, bw = box.clientWidth;
      tip.style.left = Math.max(0, Math.min(bw - tw, x - tw / 2)) + "px"; tip.style.top = Math.max(0, y - 58) + "px";
    };
    var hide = function(){ [line, dot, tip].forEach(function(x){ x.hidden = true; }); idx = null; };
    var at = function(e){ var sr = svg.getBoundingClientRect(), n = o.values.length - 1; return Math.round(Math.max(0, Math.min(1, (e.clientX - sr.left) / (sr.width * (o.W / o.VW)))) * n); };
    svg.addEventListener("pointermove", function(e){ if(e.pointerType === "mouse" || e.buttons || e.pressure > 0) show(at(e)); });
    svg.addEventListener("pointerdown", function(e){ show(at(e)); });
    svg.addEventListener("pointerleave", function(e){ if(e.pointerType === "mouse") hide(); });
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", function(e){
      if(e.key === "ArrowRight" || e.key === "ArrowLeft"){ e.preventDefault(); show((idx === null ? 0 : idx) + (e.key === "ArrowRight" ? 1 : -1)); }
      else if(e.key === "Home"){ e.preventDefault(); show(0); } else if(e.key === "End"){ e.preventDefault(); show(o.values.length - 1); }
    });
    document.addEventListener("pointerdown", function(e){ if(idx !== null && !svg.contains(e.target)) hide(); });
  });
  wireJars(scope); wireSankeys(scope);
}

/* ---------- where the money went: a flow chart ---------- */
function monthFlow(v, cur){
  var win = cur.win, inBy = {}, KIND = {pay:"Pay", extra:"Extra income", refund:"Refunds", gift:"Gifts"};
  state.income.forEach(function(x){ if(x.confirmed && inWindow(x.date, win)){ var k = KIND[x.v3Kind] || (x.kind === "pay" ? "Pay" : "Money in"); inBy[k] = round2((inBy[k] || 0) + num(x.amount)); } });
  var billBy = {}, debt = 0;
  state.transactions.forEach(function(t){
    if(!t.billOccId || !inWindow(t.date, win)) return;
    var o = occById(t.billOccId); if(isTrackedCardBillOccurrence(o)) return;
    var b = o && billById(o.billId);
    if(b && b.debtId) debt += num(t.amount); else { var n = o ? o.name : "Bills"; billBy[n] = round2((billBy[n] || 0) + num(t.amount)); }
  });
  state.billOccs.forEach(function(o){ if(o.paid && !o.paidTxnId && inWindow(o.dueDate, win) && !isTrackedCardBillOccurrence(o)){ var b = billById(o.billId); if(b && b.debtId) debt += num(o.amount); else billBy[o.name] = round2((billBy[o.name] || 0) + num(o.amount)); } });
  var bills = round2(Object.keys(billBy).reduce(function(n, k){ return n + billBy[k]; }, 0));
  debt = round2(debt);
  var totalIn = round2(Object.keys(inBy).reduce(function(n, k){ return n + inBy[k]; }, 0));
  var out = round2(bills + debt + cur.everyday), left = round2(totalIn - out);
  var L = Object.keys(inBy).sort(function(a, b){ return inBy[b] - inBy[a]; }).map(function(k){ return {id:"in:" + k, label:k, v:inBy[k], color:"var(--good)"}; });
  if(left < 0) L.push({id:"in:balance", label:"From your balance", v:-left, color:"var(--soft)"});
  var M = [];
  if(bills > 0) M.push({id:"m:bills", label:"Bills", v:bills, color:"var(--brandink)"});
  if(debt > 0) M.push({id:"m:debt", label:"Debt payments", v:debt, color:"var(--warn)"});
  if(cur.everyday > 0) M.push({id:"m:everyday", label:"Everyday", v:cur.everyday, color:"var(--accent)"});
  if(left > 0) M.push({id:"m:left", label:"Left over", v:left, color:"var(--good)"});
  var R = [];
  var top = function(by, n, parent, color, otherLabel){
    var ks = Object.keys(by).filter(function(k){ return by[k] > 0; }).sort(function(a, b){ return by[b] - by[a]; }), shown = ks.slice(0, n), rest = round2(ks.slice(n).reduce(function(s, k){ return s + by[k]; }, 0));
    shown.forEach(function(k){ var c = parent === "m:everyday" ? categoryById(k) : null;
      R.push({id:"r:" + parent + ":" + k, parent:parent, label:c ? c.emoji + " " + c.name : k === "__none" ? "No category" : k, v:round2(by[k]), color:c ? safeColor(c.color, color) : color}); });
    if(rest > 0) R.push({id:"r:" + parent + ":other", parent:parent, label:otherLabel, v:rest, color:color});
  };
  top(billBy, 4, "m:bills", "var(--brandink)", "Other bills");
  top(cur.by, 5, "m:everyday", "var(--accent)", "Other spending");
  return {L:L, M:M, R:R, totalIn:totalIn, out:out, left:left};
}
function sankeyHTML(v, cur){
  var f = monthFlow(v, cur);
  if(!f.L.length || !f.M.length) return '<p class="empty">Once money comes in and goes out this month, you’ll see where it all went.</p>';
  var phone = window.innerWidth < 700, cols = phone ? [f.L, f.M] : [f.L, f.M, f.R];
  var W = phone ? 620 : 1000, H = phone ? 340 : 380, NW = 14, GAP = 12;
  var X = phone ? [150, 420] : [150, 480, 770];
  var k = Math.min.apply(null, cols.map(function(c){ var t = c.reduce(function(n, x){ return n + x.v; }, 0); return t > 0 ? (H - GAP * (c.length - 1)) / t : 1e9; }));
  cols.forEach(function(c, ci){
    var hsum = c.reduce(function(n, x){ return n + Math.max(2, x.v * k); }, 0) + GAP * (c.length - 1), y = (H - hsum) / 2;
    c.forEach(function(x){ x.x = X[ci]; x.y = y; x.h = Math.max(2, x.v * k); x.out = y; x.in = y; y += x.h + GAP; });
  });
  var links = [], total = f.L.reduce(function(n, x){ return n + x.v; }, 0);
  f.L.forEach(function(s){ f.M.forEach(function(m){ links.push({s:s, t:m, v:s.v * m.v / total}); }); });
  if(!phone) f.R.forEach(function(r){ var m = f.M.filter(function(x){ return x.id === r.parent; })[0]; if(m) links.push({s:m, t:r, v:r.v}); });
  var grads = "", paths = links.map(function(l, i){
    var h = l.v * k, x0 = l.s.x + NW, x1 = l.t.x, y0 = l.s.out, y1 = l.t.in, xm = (x0 + x1) / 2;

/* ---------- how the month added up: a waterfall ---------- */
function waterfallHTML(v, cur){
  /* mid-month before payday, "money in" is still 0 and the chart would only say "short": read last month instead, and say so */
  var t = startOfToday(), note = "", f = monthFlow(v, cur);
  if(v.y === t.getFullYear() && v.m === t.getMonth() && !(f.totalIn > 0)){
    var pv = {y:v.m ? v.y : v.y - 1, m:(v.m + 11) % 12}, pf = monthFlow(pv, monthNumbers(pv.y, pv.m));
    if(pf.totalIn > 0){ note = MONTH_NAMES[v.m] + "’s pay isn’t in yet, so this shows " + MONTH_NAMES[pv.m] + ", your last full month."; f = pf; v = pv; }
  }
  if(!(f.totalIn > 0) && !(f.out > 0)) return '<p class="empty">Nothing in or out yet this month.</p>';
  var steps = [{label:"Money in", v:f.totalIn, total:true}];
  f.M.forEach(function(m){ if(m.id !== "m:left") steps.push({label:m.label, v:-m.v}); });
  steps.push({label:f.left >= 0 ? "Left over" : "Over by", v:f.left, total:true, end:true});
  var run = 0, pts = [0];
  steps.forEach(function(s){ if(s.total){ s.from = 0; s.to = s.v; if(!s.end) run = s.v; } else { s.from = run; s.to = run + s.v; run = s.to; } pts.push(s.from, s.to); });
  var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts), W = 640, H = 250, top = 34, bot = 40, n = steps.length;
  var y = function(val){ return top + (max - val) / (max - min || 1) * (H - top - bot); };
  var gap = (W - 40) / n, bw = Math.min(96, gap * 0.64);
  var out = steps.map(function(s, i){
    var x = 20 + gap * i + (gap - bw) / 2, y0 = y(Math.max(s.from, s.to)), h = Math.max(2, Math.abs(y(s.from) - y(s.to)));
    var col = s.total ? (s.end && s.v < 0 ? "var(--warn)" : s.end ? "var(--good)" : "var(--accent)") : "var(--outc)";
    var down = !s.total && s.v < 0, sign = s.v < 0 ? "−" : s.total ? "" : "+";
    /* every amount sits just above its own bar, so nothing lands on a label underneath */
    var conn = i < n - 1 ? '<line x1="' + (x + bw).toFixed(1) + '" x2="' + (x + gap).toFixed(1) + '" y1="' + y(s.to).toFixed(1) + '" y2="' + y(s.to).toFixed(1) + '" class="wf-conn"/>' : '';
    return '<rect class="wf-bar ' + (down ? 'wf-down' : 'wf-up') + '" x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="6" fill="' + col + '"><title>' + escapeHTML(s.label + ": " + sign + money(Math.abs(s.v))) + '</title></rect>'
      + '<text class="wf-val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y0 - 9).toFixed(1) + '" text-anchor="middle">' + escapeHTML(sign + moneyShort(Math.abs(s.v))) + '</text>'
      + '<text class="wf-lab" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle">' + escapeHTML(s.label) + '</text>' + conn;
  }).join("");
  var zero = min < 0 ? '<line x1="10" x2="' + (W - 10) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" class="wf-zero"/>' : '';
  var said = moneyShort(f.totalIn) + " came in and " + moneyShort(f.out) + " went out, so " + (f.left >= 0 ? moneyShort(f.left) + " was left over." : "you spent " + moneyShort(-f.left) + " more than came in, from your balance.");
  return '<p class="wf-said">' + escapeHTML(said) + (note ? ' <span class="muted">' + escapeHTML(note) + '</span>' : '') + '</p>'
    + '<p class="wf-key">Start with what came in; each bar after it is money going out. The last bar is what’s left.</p>'
    + '<svg class="wf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + escapeHTML(said) + '">' + zero + out + '</svg>'
    + '<details class="chart-data"><summary>View as a table</summary><table><tbody>' + steps.map(function(s){ return '<tr><th scope="row">' + escapeHTML(s.label) + '</th><td class="num">' + (s.v < 0 ? "−" : s.total ? "" : "+") + escapeHTML(money(Math.abs(s.v))) + '</td></tr>'; }).join("") + '</tbody></table></details>';
}

/* ============================================================
   THIS YEAR (V2's annual review), on Reviews
   The year of the month you're looking at: money in, money out, what
   was left, an average month, the months that went best and hardest,
   and where the everyday money went. Prints with the rest of Reviews.
   ============================================================ */
function annualTotals(y){
  var t = startOfToday(), last = y < t.getFullYear() ? 11 : y === t.getFullYear() ? t.getMonth() : -1, months = [];
  for(var m = 0; m <= last; m++){ var f = monthFlow({y:y, m:m}, monthNumbers(y, m)); months.push({m:m, inn:f.totalIn, out:f.out, left:f.left}); }
  var sum = function(k){ return round2(months.reduce(function(n, x){ return n + x[k]; }, 0)); };
  var cats = {}, win = {start:y + "-01-01", end:y + "-12-31"};
  state.transactions.forEach(function(x){
    if(x.billOccId || x.cardPaymentFor || x.date < win.start || x.date > win.end) return;
    allocate(x).forEach(function(a){ var k = a.categoryId || "__none"; cats[k] = round2((cats[k] || 0) + a.amount); });
  });
  var top = Object.keys(cats).map(function(k){ var c = categoryById(k); return {name:c ? c.emoji + " " + c.name : "❔ No category", v:cats[k]}; }).sort(function(a, b){ return b.v - a.v; }).slice(0, 5);
  var withData = months.filter(function(x){ return x.inn > 0 || x.out > 0; });
  /* the month still running isn't finished, so it can't be the best or the hardest yet */
  var done = withData.filter(function(x){ return !(y === t.getFullYear() && x.m === t.getMonth()); });
  var best = done.slice().sort(function(a, b){ return b.left - a.left; })[0], hard = done.slice().sort(function(a, b){ return a.left - b.left; })[0];
  return {months:months, inn:sum("inn"), out:sum("out"), left:sum("left"), avg:withData.length ? round2(sum("out") / withData.length) : 0, n:withData.length, top:top, best:best, hard:hard};
}
function annualHTML(y){
  var a = annualTotals(y), isNow = y === startOfToday().getFullYear();
  /* New Year's Day: nothing in or out yet, but the card stays, so the "This year" subtab still lands somewhere */
  if(!a.n) return '<section class="card span12 annual" id="annualCard" aria-labelledby="anTitle"><div class="card-head"><h2 id="anTitle">' + y + (isNow ? ' so far' : '') + '</h2></div>'
    + '<p class="empty">' + (isNow ? 'Nothing in or out yet this year. It fills in as the months go by.' : 'Nothing was logged in ' + y + '.') + '</p></section>';
  var maxTop = a.top.length ? a.top[0].v : 1;
  return '<section class="card span12 annual" id="annualCard" aria-labelledby="anTitle"><div class="card-head"><h2 id="anTitle">' + y + (isNow ? ' so far' : '') + '</h2><span class="muted" style="font-size:13px">' + a.n + (a.n === 1 ? ' month' : ' months') + ' with money in or out</span></div>'
    + '<div class="an-strip">'
    + '<div><div class="k">Came in</div><div class="v num" style="color:var(--good)">' + escapeHTML(moneyShort(Math.round(a.inn))) + '</div></div>'
    + '<div><div class="k">Went out</div><div class="v num">' + escapeHTML(moneyShort(Math.round(a.out))) + '</div></div>'
    + '<div><div class="k">' + (a.left >= 0 ? 'Left over' : 'Short') + '</div><div class="v num' + (a.left < 0 ? ' warn' : '') + '">' + escapeHTML(moneyShort(Math.round(Math.abs(a.left)))) + '</div></div>'
    + '<div><div class="k">An average month</div><div class="v num">' + escapeHTML(moneyShort(Math.round(a.avg))) + '</div><div class="s">going out</div></div></div>'

      + (a.hard && a.hard !== a.best ? '<p class="an-month">🌧️ <b>' + escapeHTML(MONTH_NAMES[a.hard.m]) + '</b> was the hardest: ' + escapeHTML(moneyShort(Math.round(Math.abs(a.hard.left)))) + (a.hard.left >= 0 ? ' left over.' : ' short.') + '</p>' : '')

/* ============================================================
   PAY THAT ARRIVES: "Mark arrived" on the pay itself, the real
   amount to the cent, and pay that lands a few days early.
   A buyer paid on the 15th and the last day of the month said her
   pay sometimes hits the bank early and varies by cents. Logged
   early, it used to count as extra money for the days before the
   official payday, so safe to spend jumped to the whole paycheck
   spread over a day or two. Now pay logged up to a few days before
   a payday is that payday's pay (income.v3ForPayday): the new pay
   period starts the day it arrives, and it isn't expected twice.
   ============================================================ */
var coreCurrentWindow = currentWindow;
/* how early still counts as "the next pay": 5 days, or less for weekly pay */
function earlyLimitFor(w){ return Math.max(1, Math.min(5, Math.floor(dayDiff(w.start, w.next) / 2))); }
/* the payday a pay logged on this date belongs to, when it came early; otherwise null */
function earlyPayFor(dateISO){
  if(!state.settings.payday || !/^\d{4}-\d{2}-\d{2}$/.test(String(dateISO || ""))) return null;
  var w = coreCurrentWindow(parseDate(dateISO)), ahead = dayDiff(parseDate(dateISO), w.next);
  return ahead > 0 && ahead <= earlyLimitFor(w) ? fmtISO(w.next) : null;
}
/* paydays whose pay came early, and the day each arrived */
function earlyArrivals(){
  var m = {};
  state.income.forEach(function(x){
    if(!x || !x.confirmed || !/^\d{4}-\d{2}-\d{2}$/.test(String(x.v3ForPayday || "")) || !(x.date < x.v3ForPayday)) return;
    if(!m[x.v3ForPayday] || x.date < m[x.v3ForPayday]) m[x.v3ForPayday] = x.date;
  });
  return m;
}
/* the pay period, moved to the day an early pay arrived */
currentWindow = function(ref){
  ref = ref || startOfToday();
  var w = coreCurrentWindow(ref);
  if(!state || !state.income || !state.income.length) return w;
  var early = earlyArrivals(), a = early[fmtISO(w.next)];
  if(a){
    var ad = parseDate(a);
    /* on or after the day it arrived, the next period has begun */
    if(ref.getTime() >= ad.getTime()){ var w2 = coreCurrentWindow(w.next); return {start:ad, end:w2.end, next:w2.next}; }
    /* before it, this period ends the day before it arrived */
    return {start:w.start, end:addDays(ad, -1), next:ad};
  }
  var b = early[fmtISO(w.start)];
  if(b) return {start:parseDate(b), end:w.end, next:w.next};
  return w;
};

/* has the pay for this payday been logged (early, on the day, or a few days late)? */
function payLoggedFor(payday){
  var iso = fmtISO(payday), from = fmtISO(addDays(payday, -5)), to = fmtISO(addDays(payday, 5));
  return state.income.some(function(x){
    return x.confirmed && (x.kind === "pay" || x.v3Kind === "pay") && (x.v3ForPayday === iso || (x.date >= from && x.date <= to));
  });
}
/* the payday whose pay you might be marking arrived: the one just gone (up to 3 days late) or the next (a few days early) */
function payDue(){
  if(!state.settings.payday) return null;
  var today = startOfToday(), w = coreCurrentWindow(today);
  if(dayDiff(w.start, today) <= 3 && !payLoggedFor(w.start)) return {payday:w.start, early:false};
  var toNext = dayDiff(today, w.next);
  if(toNext > 0 && toNext <= earlyLimitFor(w) && !payLoggedFor(w.next)) return {payday:w.next, early:true};
  return null;
}

function wishReadyAt(w){ return num(w.created) + WAIT_HOURS * 36e5; }
function wishHoursLeft(w){ return Math.max(0, Math.ceil((wishReadyAt(w) - NOW().getTime()) / 36e5)); }
function wishKept(){ return round2(state.planner.wishes.filter(function(w){ return w.status === "released"; }).reduce(function(n, w){ return n + num(w.price); }, 0)); }

function wishesHTML(){
  var all = state.planner.wishes, waiting = all.filter(function(w){ return w.status === "waiting"; }).sort(function(a, b){ return a.created - b.created; });
  var done = all.filter(function(w){ return w.status !== "waiting"; }).sort(function(a, b){ return b.created - a.created; }).slice(0, 12);
  var kept = wishKept(), letGo = all.filter(function(w){ return w.status === "released"; }).length;

    + '<div class="card"><div class="k">How it works</div><div class="s" style="margin-top:6px">Want something? Put it here instead of buying it. After two days most wants fade, and the ones that don’t are worth it.</div></div>'
    + '</div>';
  html += '<div class="grid">' + (waiting.length ? waiting.map(wishCardHTML).join("")
      : '<div class="card span12 soon"><h2>Nothing waiting</h2><p>Next time something catches your eye, add it here and let it sit for two days.</p><p style="margin-top:16px"><button type="button" class="btn primary" data-act="wish-add">+ Add a wish</button></p></div>')
    + '</div>';
  if(done.length) html += '<section class="card" style="margin-top:18px" aria-labelledby="wishDoneT"><div class="card-head"><h2 id="wishDoneT">Decided</h2></div>'
    + done.map(function(w){

          + '<div class="a">' + escapeHTML(money(w.price)) + '</div><button type="button" class="btn ghost sm" data-act="wish-del" data-id="' + escapeHTML(w.id) + '" aria-label="Remove ' + escapeHTML(w.name) + ' from the list">Remove</button></div>';

function wishCardHTML(w){
  var left = wishHoursLeft(w), ready = left <= 0, pct = Math.round(clamp(1 - left / WAIT_HOURS, 0, 1) * 100);
  var p = previewSpend(w.price);

    + '<div class="card-head"><h2 style="text-transform:none;letter-spacing:0;font-size:18px;color:var(--ink)">' + escapeHTML(w.name) + '</h2><span class="num" style="font-weight:700">' + escapeHTML(money(w.price)) + '</span></div>'
    + (w.why ? '<p class="hint" style="margin-bottom:10px">“' + escapeHTML(w.why) + '”</p>' : '')
    + '<div class="wait"><div class="bar" role="progressbar" aria-label="Waiting time" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>'
    + '<div class="wait-t">' + (ready ? '⏰ Two days are up. Still want it?' : '⏳ Ready in ' + (left >= 24 ? Math.floor(left / 24) + ' day' + (left >= 48 ? 's' : '') + ' ' + (left % 24) + ' h' : left + (left === 1 ? ' hour' : ' hours'))) + '</div></div>'
    + (fit ? '<p class="hint" style="margin-top:8px">' + escapeHTML(fit) + '</p>' : '')

    + (ready ? '<button type="button" class="btn primary sm" data-act="wish-go" data-id="' + escapeHTML(w.id) + '" data-to="released">Let it go 🌿</button>'

ACTIONS["wish-add"] = function(el){ wishDialog(el && el.getAttribute("data-amount") ? num(el.getAttribute("data-amount")) : 0); };

ACTIONS["wish-go"] = function(el){

ACTIONS["wish-del"] = function(el){

/* the wait ticks down while you look at it */
setInterval(function(){ if(current === "goals" && goalsView === "wish" && !document.querySelector(".dialog")) renderScreen("goals"); }, 60000);

/* ============================================================
   PLAN, from the ADHD Planner: the non-money side of keeping on
   top of money.
     - Today's steps: a few small tasks, sized to your energy;
     - Weekly reset: four loops to close, a 5-minute timer, and a
       win worth keeping;
     - Brain dump: somewhere to put everything that's in your head.

var planView = "today", planDate = null, planMore = false;

function planDay(iso){ var d = state.planner.days[iso]; if(!d) d = state.planner.days[iso] = {id:iso, energy:"steady", tasks:[], note:""}; return d; }
function weekKey(){ var t = startOfToday(); return fmtISO(addDays(t, -((t.getDay() + 6) % 7))); }
function planWeek(){ var k = weekKey(), w = state.planner.weeks[k]; if(!w) w = state.planner.weeks[k] = {id:k, checks:[], win:"", next:"", doneAt:null}; return w; }

RENDER.plan = function(){

  var html = pageTop("Plan", planView === "reset" ? "A reset, not a restart" : planView === "dump" ? "Get it out of your head" : "Today, at your pace") + seg;

  $("screen-plan").innerHTML = html;

};
ACTIONS["plan-view"] = function(el){ planView = el.getAttribute("data-v"); renderScreen("plan"); };

/* ---------- today's steps ---------- */
function stepsHTML(){

  var e = ENERGY.filter(function(x){ return x[0] === d.energy; })[0] || ENERGY[1];
  var limit = d.energy === "low" && !planMore ? 1 : d.tasks.length, done = d.tasks.filter(function(t){ return t.done; }).length;
  return '<div class="grid"><section class="card span7" aria-labelledby="stT"><div class="card-head"><h2 id="stT">Small steps</h2>'
    + '<input class="input" type="date" id="planDate" value="' + iso + '" aria-label="Plan for" style="max-width:170px"></div>'
    + (d.tasks.length ? '<div class="step-list">' + d.tasks.slice(0, limit).map(function(t){
        return '<div class="step' + (t.done ? ' done' : '') + '" data-id="' + escapeHTML(t.id) + '"><label class="check" style="margin:0;flex:1"><input type="checkbox" data-step="' + escapeHTML(t.id) + '"' + (t.done ? ' checked' : '') + '> <span>' + escapeHTML(t.text) + '</span></label>'
          + '<button type="button" class="small-btn" data-act="step-later" data-id="' + escapeHTML(t.id) + '" aria-label="Move ' + escapeHTML(t.text) + ' to tomorrow" title="Tomorrow">→</button>'
          + '<button type="button" class="small-btn" data-act="step-del" data-id="' + escapeHTML(t.id) + '" aria-label="Remove ' + escapeHTML(t.text) + '">×</button></div>';
      }).join("") + '</div>' : '<p class="empty">One small step is enough. Write it below.</p>')

    + (d.tasks.length ? '<p class="hint" style="margin-top:10px">' + done + ' of ' + d.tasks.length + ' done' + (done && done === d.tasks.length ? '. That’s everything. 🌿' : '') + '</p>' : '')
    + '</section><div class="span5" style="display:grid;gap:18px">'
    + '<section class="card" aria-labelledby="enT"><div class="card-head"><h2 id="enT">How full is your cup?</h2></div><div class="pills" role="group" aria-label="Energy" style="margin:0">'
      + ENERGY.map(function(x){ return '<button type="button" data-act="energy" data-e="' + x[0] + '" aria-pressed="' + (d.energy === x[0]) + '">' + x[1] + ' ' + x[2] + '</button>'; }).join("") + '</div>'
      + '<p class="hint" style="margin-top:10px">' + escapeHTML(e[3]) + '</p></section>'
    + '<section class="card" aria-labelledby="noT"><div class="card-head"><h2 id="noT">A note to myself</h2></div><textarea class="input note-area" id="dayNote" rows="4" placeholder="What would make today easier?" aria-labelledby="noT">' + escapeHTML(d.note || "") + '</textarea></section>'
    + '</div></div>';
}
function planIso(){ return planDate || fmtISO(startOfToday()); }
document.addEventListener("submit", function(e){
  if(e.target.id !== "stepForm") return;
  e.preventDefault();
  var text = $("stepText").value.trim(); if(!text) return;
  pushUndo("Step added"); planDay(planIso()).tasks.push({id:uid(), text:text.slice(0, 120), done:false});
  commit(); setTimeout(function(){ var f = $("stepText"); if(f) f.focus(); }, 0);
});
document.addEventListener("change", function(e){
  var t = e.target; if(!t) return;
  if(t.hasAttribute && t.hasAttribute("data-step")){
    var d = planDay(planIso()), task = d.tasks.filter(function(x){ return x.id === t.getAttribute("data-step"); })[0]; if(!task) return;
    pushUndo(t.checked ? "Step done" : "Step undone"); task.done = t.checked;
    var all = d.tasks.length && d.tasks.every(function(x){ return x.done; });
    commit(t.checked ? (all ? "All done. That’s a good day. 🌿" : "Done. One less thing.") : null);
  }
  if(t.id === "planDate"){ planDate = safeDate(t.value) || null; planMore = false; renderScreen("plan"); }
});
var noteTimer = null;
document.addEventListener("input", function(e){
  var t = e.target; if(!t) return;
  var save = function(fn){ clearTimeout(noteTimer); noteTimer = setTimeout(function(){ fn(); persist(); }, 500); };
  if(t.id === "dayNote") save(function(){ planDay(planIso()).note = t.value.slice(0, 2000); });
  if(t.id === "weekWin") save(function(){ planWeek().win = t.value.slice(0, 1000); });
  if(t.id === "weekNext") save(function(){ planWeek().next = t.value.slice(0, 1000); });
  if(t.id === "brainDump") save(function(){ state.notes = t.value.slice(0, 20000); var c = $("dumpCount"); if(c) c.textContent = dumpCount(); });
});
ACTIONS.energy = function(el){ pushUndo("Energy set"); planDay(planIso()).energy = el.getAttribute("data-e"); planMore = false; commit(); };
ACTIONS["step-more"] = function(){ planMore = true; renderScreen("plan"); };
ACTIONS["step-del"] = function(el){ var d = planDay(planIso()); pushUndo("Step removed"); d.tasks = d.tasks.filter(function(x){ return x.id !== el.getAttribute("data-id"); }); commit("Removed."); };
ACTIONS["step-later"] = function(el){
  var d = planDay(planIso()), t = d.tasks.filter(function(x){ return x.id === el.getAttribute("data-id"); })[0]; if(!t) return;
  pushUndo("Step moved"); d.tasks = d.tasks.filter(function(x){ return x !== t; });
  planDay(fmtISO(addDays(parseDate(planIso()), 1))).tasks.push(t); commit("Moved to tomorrow. No rush.");

/* ---------- weekly reset ---------- */

    + '<div class="timer-num num" id="timerNum" role="timer" aria-live="off">05:00</div></div>'
    + '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button type="button" class="btn primary" data-act="timer-start">' + (state.planner.timerEnd ? "Start again" : "Start") + '</button><button type="button" class="btn ghost" data-act="timer-stop">Reset</button></div>'
    + '<p class="hint" id="timerNote" role="status" style="text-align:center;margin-top:10px">One small job. You don’t need to finish everything.</p>'
    + '<label class="check" style="justify-content:center"><input type="checkbox" id="timerSound"' + (state.settings.timerSound !== false ? ' checked' : '') + '> Soft chime at the end</label></section>'
    + '<section class="card span6" aria-labelledby="wwT"><div class="card-head"><h2 id="wwT">A win worth keeping</h2></div><textarea class="input note-area" id="weekWin" rows="3" placeholder="Even something tiny…" aria-labelledby="wwT">' + escapeHTML(w.win || "") + '</textarea></section>'
    + '<section class="card span6" aria-labelledby="wnT"><div class="card-head"><h2 id="wnT">Make next week easier</h2></div><textarea class="input note-area" id="weekNext" rows="3" placeholder="One thing to simplify or let go…" aria-labelledby="wnT">' + escapeHTML(w.next || "") + '</textarea></section></div>';
}
document.addEventListener("change", function(e){
  var t = e.target; if(!t) return;
  if(t.hasAttribute && t.hasAttribute("data-reset")){
    var w = planWeek(), id = "check-" + t.getAttribute("data-reset"), c = w.checks.filter(function(x){ return x.id === id; })[0];
    pushUndo("Reset ticked");
    if(c) c.done = t.checked; else w.checks.push({id:id, done:t.checked});
    var all = RESET_ITEMS.every(function(_, i){ return w.checks.some(function(x){ return x.id === "check-" + i && x.done; }); });
    if(all && !w.doneAt) w.doneAt = NOW().toISOString();

});
var timerAudio = null, timerLoop = null;
ACTIONS["timer-start"] = function(){
  try{ var A = window.AudioContext || window.webkitAudioContext; if(A && !timerAudio) timerAudio = new A(); if(timerAudio) timerAudio.resume(); }catch(e){}
  state.planner.timerEnd = Date.now() + 5 * 60 * 1000; state.planner.timerNotified = null; persist(); renderScreen("plan");
};
ACTIONS["timer-stop"] = function(){ state.planner.timerEnd = null; persist(); renderScreen("plan"); };
function timerTick(){
  clearInterval(timerLoop);
  var paint = function(){
    var num = $("timerNum"); if(!num){ clearInterval(timerLoop); return; }
    var end = state.planner.timerEnd, left = end ? Math.max(0, Math.ceil((end - Date.now()) / 1000)) : 300;
    num.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    $("timerArc").setAttribute("stroke-dashoffset", (326.7 * (1 - left / 300)).toFixed(1));
    if(end && left === 0 && state.planner.timerNotified !== end){
      state.planner.timerNotified = end; persist();
      $("timerNote").textContent = "Your five minutes are done. Take a breath.";
      if(state.settings.timerSound !== false && timerAudio){ try{ var o = timerAudio.createOscillator(), g = timerAudio.createGain(), t0 = timerAudio.currentTime;
        o.type = "sine"; o.frequency.value = 523.25; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.08, t0 + .03); g.gain.exponentialRampToValueAtTime(.001, t0 + 1.1);
        o.connect(g); g.connect(timerAudio.destination); o.start(t0); o.stop(t0 + 1.15); }catch(e){} }

/* ============================================================
   YEAR PLANNER: the next twelve months at a glance, and a pot for
   every cost that doesn't come monthly (car insurance, the yearly
   subscription, Christmas). Money put in a pot comes off safe to
   spend straight away, so the big bill never lands as a shock.
   Pots are the shared core's set-aside envelopes, linked to the bill.
   ============================================================ */
function isIrregular(b){ return b.active !== false && !b.debtId && ((b.cadence === "everyN" && num(b.everyN) >= 2) || b.cadence === "once"); }
/* exactly the next 365 days: the rest of this month, eleven full months, then the start of this
   month next year. Every column is a real stretch of time ahead, nothing already gone. */
function yearMonths(){
  var t = startOfToday(), today = fmtISO(t), end = fmtISO(addDays(t, 364)), out = [], d = new Date(t.getFullYear(), t.getMonth(), 1, 12);
  while(fmtISO(d) <= end){
    var y = d.getFullYear(), m = d.getMonth(), first = fmtISO(d), last = fmtISO(new Date(y, m + 1, 0, 12));
    var from = first < today ? today : first, to = last > end ? end : last, rest = from !== first, head = to !== last;
    out.push({y:y, m:m, key:y + "-" + String(m + 1).padStart(2, "0"), from:from, to:to,
      short:rest ? MONTH_ABBR[m] + " (rest)" : head ? MONTH_ABBR[m] + " 1–" + parseDate(to).getDate() : MONTH_ABBR[m],
      label:rest ? "the rest of " + MONTH_NAMES[m] : head ? MONTH_NAMES[m] + " 1–" + parseDate(to).getDate() + " " + y : MONTH_NAMES[m] + (y !== t.getFullYear() ? " " + y : "")});
    d = new Date(y, m + 1, 1, 12);
  }
  return out;
}
/* what's due in each of the next twelve months, regular and irregular apart */
function yearTotals(){
  var months = yearMonths(), by = {};
  months.forEach(function(x){ by[x.key] = {regular:0, irregular:0, items:[]}; });
  state.billOccs.forEach(function(o){
    var span = months.filter(function(x){ return o.dueDate >= x.from && o.dueDate <= x.to; })[0], cell = span && by[span.key], b = billById(o.billId);
    if(!cell || o.skipped || !b) return;
    if(isIrregular(b)){ cell.irregular += num(o.amount); cell.items.push(o); } else cell.regular += num(o.amount);
  });
  return months.map(function(x){ var c = by[x.key]; return {y:x.y, m:x.m, key:x.key, short:x.short, label:x.label, regular:round2(c.regular), irregular:round2(c.irregular), items:c.items}; });
}
function potFor(b){ return state.envelopes.filter(function(e){ return !e.archived && e.kind === "setAside" && e.billIds.indexOf(b.id) >= 0; })[0] || null; }
function nextOccOf(b){ var today = fmtISO(startOfToday()); return state.billOccs.filter(function(o){ return o.billId === b.id && !o.paid && !o.skipped && o.dueDate >= today; }).sort(function(x, y){ return x.dueDate < y.dueDate ? -1 : 1; })[0] || null; }
function monthsUntil(iso){ var d = parseDate(iso), t = startOfToday(); return Math.max(1, (d.getFullYear() - t.getFullYear()) * 12 + d.getMonth() - t.getMonth()); }
/* how a pot stands: its balance, and what to put in this month to be ready on time */
function potPlan(b){
  var pot = potFor(b), occ = nextOccOf(b), amount = occ ? num(occ.amount) : num(b.amount);
  var bal = pot ? Math.max(0, budgetEnvelopeBalance(pot.id).balance) : 0, months = occ ? monthsUntil(occ.dueDate) : 12;
  var share = round2(Math.max(0, amount - bal) / months), month = fmtISO(startOfToday()).slice(0, 7);
  var inThisMonth = pot ? round2(state.envelopeMoves.reduce(function(n, m){ return m.envelopeId === pot.id && m.date.slice(0, 7) === month ? n + m.amount : n; }, 0)) : 0;
  return {pot:pot, occ:occ, amount:amount, balance:round2(bal), months:months, share:share, doneThisMonth:pot && (share <= 0.005 || inThisMonth >= share - 0.005), ready:bal >= amount - 0.005};
}

RENDER.year = function(){

/* ============================================================
   BANK FILE IMPORT: the CSV file your bank app exports. Read on
   this device only. You match the columns once (most are guessed),
   see every row before anything is saved, duplicates are skipped,
   categories are learned from what you chose before, and the whole
   import can be undone in one tap. Every row carries v3Import.
   ============================================================ */
/* ---------- reading the file ---------- */
function csvRows(text){
  text = String(text || "").replace(/^﻿/, "");
  var first = text.split(/\r?\n/).slice(0, 5).join("\n");
  var delim = [";", ",", "\t", "|"].map(function(d){ return {d:d, n:first.split(d).length}; }).sort(function(a, b){ return b.n - a.n; })[0].d;
  var rows = [], row = [], cell = "", q = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"'){ q = true; continue; }
    if(ch === delim){ row.push(cell.trim()); cell = ""; continue; }
    if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cell.trim()); cell = ""; if(row.some(function(c){ return c !== ""; })) rows.push(row); row = []; continue; }
    cell += ch;
  }
  row.push(cell.trim()); if(row.some(function(c){ return c !== ""; })) rows.push(row);
  return rows.slice(0, 5000);
}
/* "1.234,56", "-12,50", "12.50-", "€ 9,99": the file tells us which mark is the decimal */
function decimalMark(values){
  var comma = 0, dot = 0;
  values.forEach(function(v){ v = String(v).trim(); if(/,\d{1,2}-?$/.test(v)) comma++; else if(/\.\d{1,2}-?$/.test(v)) dot++; });
  return comma > dot ? "," : ".";
}
function bankNumber(v, mark){
  var s = String(v || "").replace(/[^\d,.\-+()]/g, ""); if(!s) return null;
  var neg = /^-|-$|^\(.*\)$/.test(s);
  s = s.replace(/[-+()]/g, "");
  s = mark === "," ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  var n = parseFloat(s); if(!isFinite(n)) return null;
  return round2(neg ? -n : n);
}
var DATE_FORMATS = [["ymd","2026-09-21"],["dmy","21-09-2026"],["mdy","09/21/2026"],["compact","20260921"]];
function bankDate(v, fmt){
  var s = String(v || "").trim(), p;
  if(fmt === "compact"){ p = s.match(/^(\d{4})(\d{2})(\d{2})/); return p ? safeDate(p[1] + "-" + p[2] + "-" + p[3], null) : null; }
  p = s.match(/(\d{1,4})[\-\/. ](\d{1,2})[\-\/. ](\d{1,4})/); if(!p) return null;
  var y, m, d;
  if(fmt === "ymd"){ y = p[1]; m = p[2]; d = p[3]; } else if(fmt === "dmy"){ d = p[1]; m = p[2]; y = p[3]; } else { m = p[1]; d = p[2]; y = p[3]; }
  if(String(y).length === 2) y = "20" + y;
  var iso = String(y).padStart(4, "0") + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  var dt = new Date(num(y), num(m) - 1, num(d), 12);
  return dt.getMonth() === num(m) - 1 && dt.getDate() === num(d) ? iso : null;
}
function guessDateFormat(values){
  var best = "ymd", score = -1;
  DATE_FORMATS.forEach(function(f){ var n = values.filter(function(v){ return bankDate(v, f[0]); }).length; if(n > score){ score = n; best = f[0]; } });
  /* 09/07/2026 reads both ways, and early in a month a whole file can: then a dollar household's
     bank means month first. Any day past the 12th in the file still decides it on its own. */
  if(best === "dmy" && state.settings.currencyCode === "USD" && values.filter(function(v){ return bankDate(v, "mdy"); }).length === score) best = "mdy";
  return best;
}
/* column names in English, Dutch, German, French and Spanish */
var COL_HINTS = {
  date:/^(date|datum|transactiedatum|boekingsdatum|buchungstag|buchungsdatum|valutadatum|date d'opération|fecha|posted|transaction date)/i,
  desc:/(omschrijving|description|naam|name|payee|merchant|verwendungszweck|beg[uü]nstigter|libell|concepto|details|memo|tegenpartij|counterparty)/i,
  amount:/^(bedrag|amount|betrag|montant|importe|value|transactiebedrag|bedrag \(eur\))/i,
  dir:/^(af ?bij|debit ?\/ ?credit|d\/c|soll ?\/ ?haben|credit ?\/ ?debit|type)$/i,
  credit:/^(credit|bij|money in|paid in|haben|gutschrift|cr[eé]dit)$/i,
  debit:/^(debit|af|money out|paid out|soll|belastung|d[eé]bit)$/i
};
function guessColumns(head, rows){
  var pick = function(re, not){ for(var i = 0; i < head.length; i++){ if(re.test(head[i]) && not.indexOf(i) < 0) return i; } return -1; };
  var g = {};
  g.date = pick(COL_HINTS.date, []);
  g.dir = pick(COL_HINTS.dir, [g.date]);
  g.debit = pick(COL_HINTS.debit, [g.date, g.dir]);
  g.credit = pick(COL_HINTS.credit, [g.date, g.dir, g.debit]);
  g.amount = g.debit >= 0 ? g.debit : pick(COL_HINTS.amount, [g.date, g.dir]);
  if(g.debit < 0) g.credit = -1;
  g.desc = pick(COL_HINTS.desc, [g.date, g.dir, g.amount, g.credit]);
  /* no names we know: the first date-like column, the first number-like column, the longest text column */
  var sample = rows.slice(0, 20);
  if(g.date < 0) g.date = head.map(function(_, i){ return sample.filter(function(r){ return bankDate(r[i], "ymd") || bankDate(r[i], "dmy") || bankDate(r[i], "compact"); }).length; }).reduce(function(best, n, i, arr){ return n > arr[best] ? i : best; }, 0);
  if(g.amount < 0) g.amount = head.map(function(_, i){ return i === g.date ? 0 : sample.filter(function(r){ return /^[\-+(]?[€$£]?\s?\d[\d.,]*\)?-?$/.test(String(r[i] || "").trim()); }).length; }).reduce(function(best, n, i, arr){ return n > arr[best] ? i : best; }, 0);
  if(g.desc < 0) g.desc = head.map(function(_, i){ return i === g.date || i === g.amount ? 0 : sample.reduce(function(n, r){ return n + String(r[i] || "").length; }, 0); }).reduce(function(best, n, i, arr){ return n > arr[best] ? i : best; }, 0);
  return g;
}
/* one row, read with the chosen columns: {date, desc, amount (always positive), dir "out" | "in"} */
function readBankRow(r, map){
  var date = bankDate(r[map.date], map.fmt), desc = String(r[map.desc] || "").replace(/\s+/g, " ").trim().slice(0, 80);
  var a = bankNumber(r[map.amount], map.mark), c = map.credit >= 0 ? bankNumber(r[map.credit], map.mark) : null, dir;
  if(map.credit >= 0 && c && Math.abs(c) > 0){ a = Math.abs(c); dir = "in"; }
  else if(a === null) return null;
  else if(map.dir >= 0){ var d = String(r[map.dir] || "").trim().toLowerCase(); dir = /^(bij|cr|credit|c|haben|in|\+)/.test(d) ? "in" : "out"; a = Math.abs(a); }
  else if(map.credit >= 0){ dir = "out"; a = Math.abs(a); }
  else { dir = a < 0 ? "out" : "in"; a = Math.abs(a); }
  if(!date || !(a > 0)) return null;
  return {date:date, desc:desc, amount:round2(a), dir:dir};
}
/* ---------- learning and duplicates ---------- */
function merchantKey(s){ return String(s || "").toLowerCase().replace(/[^a-zÀ-ɏ ]/g, " ").replace(/\b(bv|nv|ltd|gmbh|inc|pas|nr|term|betaalautomaat|ccv|sumup|zettle|by)\b/g, " ").trim().split(/\s+/).slice(0, 2).join(" "); }
function learnedCategories(){
  var by = {};
  state.transactions.forEach(function(t){ if(!t.note || !t.categoryId || t.billOccId) return; var k = merchantKey(t.note); if(!k) return; (by[k] = by[k] || {})[t.categoryId] = ((by[k] || {})[t.categoryId] || 0) + 1; });
  var out = {}; Object.keys(by).forEach(function(k){ var best = null; Object.keys(by[k]).forEach(function(c){ if(!best || by[k][c] > by[k][best]) best = c; }); out[k] = best; });
  return out;
}
function dupKey(date, amount, desc){ return date + "|" + round2(amount).toFixed(2) + "|" + merchantKey(desc); }
/* what's already here: exact rows (an earlier import of the same file), and by date and amount only
   (spending you typed in by hand, which the bank describes differently) */
function existingKeys(){
  var exact = {}, loose = [];
  var add = function(k){ exact[k] = (exact[k] || 0) + 1; };
  state.transactions.forEach(function(t){ add(dupKey(t.date, t.amount, t.note)); if(!t.v3Import) loose.push({dir:"out", date:t.date, amount:round2(t.amount), used:false}); });
  state.income.forEach(function(x){ add(dupKey(x.date, x.amount, x.label)); if(!x.v3Import) loose.push({dir:"in", date:x.date, amount:round2(x.amount), used:false}); });
  return {exact:exact, loose:loose};
}
/* the rows as they'd be saved: category guessed, repeats of earlier imports skipped, and rows that
   look like something you typed in by hand left unticked so nothing counts twice */
function planImport(rows, map){
  var learned = learnedCategories(), have = existingKeys(), claimed = {};
  return rows.map(function(r){
    var x = readBankRow(r, map); if(!x) return null;
    var k = dupKey(x.date, x.amount, x.desc);
    if(have.exact[k] > 0){ have.exact[k]--; x.dup = true; }
    else {
      var m = have.loose.filter(function(l){ return !l.used && l.dir === x.dir && Math.abs(l.amount - x.amount) < 0.005 && Math.abs(dayDiff(parseDate(l.date), parseDate(x.date))) <= 2; })[0];
      if(m){ m.used = true; x.maybe = true; }
    }
    x.categoryId = x.dir === "out" ? (learned[merchantKey(x.desc)] || null) : null;
    /* a bill you haven't ticked yet, same amount within a few days: this row pays it */
    if(x.dir === "out" && !x.dup && !x.maybe){
      var o = state.billOccs.filter(function(o){ return !o.paid && !o.skipped && !claimed[o.id] && Math.abs(num(o.amount) - x.amount) < 0.005 && Math.abs(dayDiff(parseDate(o.dueDate), parseDate(x.date))) <= 4; })[0];
      if(o){ claimed[o.id] = true; x.occId = o.id; x.billName = o.name; var b = billById(o.billId); if(b && b.categoryId) x.categoryId = b.categoryId; }
    }
    x.take = !x.dup && !x.maybe;
    return x;
  }).filter(Boolean);
}

/* ============================================================
   BANK FILE IMPORT, the dialog: pick the file and account, check
   the columns, untick anything you don't want, add. Undo from the
   message, or later from Settings → Imports.
   ============================================================ */

  var accts = state.accounts.filter(function(a){ return !a.archived && a.kind !== "card"; });

  openDialog("Import a bank file",
    '<p>In your bank’s app or website, look for <b>Download transactions</b> or <b>Export</b> and choose <b>CSV</b>. Then pick the file here.</p>'
    + '<div class="field"><label for="biFile">The file</label><input class="input" type="file" id="biFile" accept=".csv,.txt,text/csv,text/plain"><div class="error" id="biErr" role="alert"></div></div>'
    + (accts.length > 1 ? '<div class="field"><label for="biAcct">Which account is it from?</label><select class="select" id="biAcct">' + accts.map(function(a){ return '<option value="' + escapeHTML(a.id) + '"' + (a.id === acct.id ? ' selected' : '') + '>' + escapeHTML(a.name) + '</option>'; }).join("") + '</select></div>' : '')
    + '<p class="hint">🔒 The file is read on this device. Nothing is uploaded, and no bank login is needed.</p>',
    '<button type="button" class="btn ghost" data-close>Cancel</button>',
    function(){
      $("biFile").addEventListener("change", function(){
        var f = this.files && this.files[0]; if(!f) return;
        if(f.size > 5e6){ $("biErr").textContent = "That file is very big. Export a shorter date range and try again."; return; }
        var acctId = $("biAcct") ? $("biAcct").value : acct.id, reader = new FileReader();
        reader.onload = function(){

    var inCheck = chkDate && x.date <= chkDate ? true : null;

      var t = normTxn({amount:x.amount, categoryId:x.categoryId || null, note:x.desc, date:x.date, accountId:acctId, kind:"expense", includedInCheck:inCheck, v3Import:batch, billOccId:o && !o.paid ? o.id : null}, {next:nextSeq, defaultAccount:acctId});

  state.v3Imports.push({id:batch, at:NOW().toISOString(), file:String(fileName || "bank file").slice(0, 80), accountId:acctId, out:outs, in:ins});
  state.v3Imports = state.v3Imports.slice(-20);

/* ============================================================
   RULES AND TAGS
     - A rule: "when the bank calls it SPOTIFY AB, call it Spotify,
       file it under Subscriptions, tag it #fun". Rules run on every
       bank file, and you can run them over past purchases too.
     - Tags: any number per purchase (#holiday, #kids), across
       categories. Search "#holiday" to see one tag and its total.

   still recognised when the same bank file is imported again.

function ruleFor(text){
  var s = String(text || "").toLowerCase();
  if(!s) return null;
  return rulesList().filter(function(r){ return r.contains && s.indexOf(r.contains) >= 0; })[0] || null;
}
function cleanTag(t){ return String(t || "").toLowerCase().replace(/^#+/, "").replace(/[^a-z0-9À-ɏ_-]+/g, "").slice(0, 24); }
function readTags(text){
  var out = [];
  String(text || "").split(/[\s,]+/).forEach(function(x){ var t = cleanTag(x); if(t && out.indexOf(t) < 0) out.push(t); });
  return out.slice(0, 8);
}
function tagsOf(t){ return Array.isArray(t.v3Tags) ? t.v3Tags : []; }
function tagChips(t){ return tagsOf(t).map(function(x){ return '<span class="tag hash">#' + escapeHTML(x) + '</span>'; }).join(""); }
function allTags(){
  var by = {};
  state.transactions.forEach(function(t){ tagsOf(t).forEach(function(x){ by[x] = (by[x] || 0) + 1; }); });
  return Object.keys(by).sort(function(a, b){ return by[b] - by[a] || (a < b ? -1 : 1); });
}
/* what a rule does to one purchase; returns true when anything changed */
function applyRule(t, r){
  var changed = false;
  if(r.rename && t.note !== r.rename){ if(!t.v3Bank) t.v3Bank = t.note; t.note = r.rename; changed = true; }
  if(r.categoryId && !t.billOccId && t.categoryId !== r.categoryId && categoryById(r.categoryId)){ t.categoryId = r.categoryId; t.splits = null; changed = true; }
  if(r.tag && tagsOf(t).indexOf(r.tag) < 0){ t.v3Tags = tagsOf(t).concat([r.tag]); changed = true; }
  return changed;
}

  var today = fmtISO(startOfToday()), until = fmtISO(addDays(startOfToday(), 366)), stamp = NOW().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  var occs = state.billOccs.filter(function(o){ return !o.paid && !o.skipped && o.dueDate >= today && o.dueDate <= until; });
  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FinNestStudio//Ultimate Budget Planner//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Bills"];
  occs.forEach(function(o){
    var d = o.dueDate.replace(/-/g, ""), next = fmtISO(addDays(parseDate(o.dueDate), 1)).replace(/-/g, "");
    lines.push("BEGIN:VEVENT", "UID:" + o.id.replace(/[^A-Za-z0-9@._-]/g, "-") + "@ufd.finneststudio", "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + next, "SUMMARY:" + icsText(o.name + (opts.amounts ? " · " + money(o.amount) : "")), "TRANSP:TRANSPARENT");
    if(opts.remind) lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsText(o.name + " is due tomorrow"), "TRIGGER:-PT12H", "END:VALARM");

/* ---------- a backup locked with a passphrase ---------- */
var LOCK_ITER = 600000;
function b64(bytes){ var s = "", a = new Uint8Array(bytes); for(var i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s){ var bin = atob(String(s)), a = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function lockKey(pass, salt, iter){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
  });
}
function lockBackup(pass){
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  var plain = new TextEncoder().encode(JSON.stringify(wrapBackup(state)));
  return lockKey(pass, salt, LOCK_ITER).then(function(key){
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv, additionalData:new TextEncoder().encode(APP_ID)}, key, plain);
  }).then(function(ct){
    return {app:APP_ID, appName:APP_NAME, kind:"finnest-locked-backup", v:1, exportedAt:NOW().toISOString(),
      kdf:{name:"PBKDF2", hash:"SHA-256", iter:LOCK_ITER, salt:b64(salt)}, iv:b64(iv), data:b64(ct)};
  });
}
function isLockedBackup(p){ return !!p && p.kind === "finnest-locked-backup" && typeof p.data === "string" && p.kdf && p.iv; }
function unlockBackup(p, pass){
  var iter = Math.min(5e6, Math.max(1e5, Math.round(num(p.kdf.iter)) || LOCK_ITER));
  return lockKey(pass, unb64(p.kdf.salt), iter).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(p.iv), additionalData:new TextEncoder().encode(String(p.app || APP_ID))}, key, unb64(p.data));
  }).then(function(plain){ return JSON.parse(new TextDecoder().decode(plain)); });

/* ============================================================
   SAFE TO TRUST WITH REAL MONEY
     - Undo history: the last 30 changes, and you can step back to
       any of them (Ctrl Z / ⌘ Z undoes the last one).
     - Balance history per account: every check, and the adjustment
       it made, so a changed number always has a reason you can see.
     - Check a backup: opens a backup file (locked ones too), checks it
       can be restored and says what's in it. Nothing here changes.
     - A last good copy: once a day the dashboard keeps yesterday's
       saved data beside today's. If the saved data ever can't be read,
       it offers that copy back.
   ============================================================ */
var GOOD_KEY = KEY + "_good";
function goodCopy(){
  try{ var g = JSON.parse(localStorage.getItem(GOOD_KEY) || "null"); return g && g.day && typeof g.raw === "string" ? g : null; }catch(e){ return null; }
}
var safetyLoadPlain = load;
load = function(){
  safetyLoadPlain.apply(this, arguments);
  if(loadProblem) return;
  try{
    var raw = localStorage.getItem(KEY), g = goodCopy(), today = fmtISO(startOfToday());
    /* the first opening of each day keeps the copy that opened fine; skipped for very large data so it never crowds out the real save */
    if(raw && raw.length < 2e6 && (!g || g.day !== today)) localStorage.setItem(GOOD_KEY, JSON.stringify({day:today, raw:raw}));
  }catch(e){}
};
ACTIONS["restore-good"] = function(){
  var g = goodCopy(); if(!g) return;
  var parsed; try{ parsed = JSON.parse(g.raw); }catch(e){ toast("That copy can’t be read either."); return; }
  try{ state = migrate(parsed); }catch(e){ toast("That copy can’t be read either."); return; }
  loadProblem = null; materialiseBills(); closeDialog(); commit("Your data from " + longDateLabel(parseDate(g.day)) + " is back.");
};
